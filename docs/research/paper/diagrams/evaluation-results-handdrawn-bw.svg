      <circle cx="30" cy="62" r="6" fill="#000000"/>
      <circle cx="115" cy="62" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="3.0"/>
      <circle cx="115" cy="62" r="6" fill="#000000"/>
