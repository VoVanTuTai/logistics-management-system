      <rect x="8" y="12" width="12" height="33" fill="#94A3B8" stroke="#000000" stroke-width="2.2"/>
      <rect x="24" y="-2" width="12" height="47" fill="#475569" stroke="#000000" stroke-width="2.2"/>
