<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#F8FAFC;">
  <defs>
    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Clean Drop Shadow -->
    <filter id="cleanShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Orthogonal Arrow Markers -->
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F46E5" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E11D48" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lane-text { font-size: 13px; font-weight: 800; fill: #475569; text-transform: uppercase; letter-spacing: 1.5px; }
    .node-title { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
    .node-desc { font-size: 11.5px; font-weight: 400; fill: #64748B; }
    .gateway-text { font-size: 11px; font-weight: 700; fill: #1E293B; text-anchor: middle; }
    .label-yes { font-size: 10.5px; font-weight: 800; fill: #059669; }
    .label-no { font-size: 10.5px; font-weight: 800; fill: #E11D48; }
    .label-amber { font-size: 10.5px; font-weight: 800; fill: #D97706; }
    .badge-case { font-size: 10.5px; font-weight: 800; letter-spacing: 0.5px; }
  </style>

  <!-- ==================== HEADER BAR ==================== -->
  <g id="Header" transform="translate(60, 30)">
    <rect x="0" y="0" width="1800" height="75" rx="12" fill="url(#headerGrad)" filter="url(#cleanShadow)"/>
    <rect x="0" y="0" width="6" height="75" rx="3" fill="#4F46E5"/>
    
    <text x="30" y="32" font-size="20" font-weight="800" fill="#FFFFFF">QUY TRÌNH NGHIỆP VỤ BƯU CHÍNH (BPMN 2.0): TIẾP NHẬN &amp; XỬ LÝ SỰ CỐ KHIẾU NẠI</text>
    <text x="30" y="56" font-size="13" font-weight="400" fill="#94A3B8">Mô hình phân làn trách nhiệm (Swimlanes), luồng quyết định tuần tự và xử lý ngoại lệ (Human-in-the-Loop)</text>

    <!-- Legend Tags -->
    <g transform="translate(1320, 24)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1"/>
      <circle cx="15" cy="14" r="4.5" fill="#10B981"/>
      <text x="28" y="18" font-size="11.5" font-weight="700" fill="#A7F3D0">Duyệt tự động 100%</text>

      <rect x="155" y="0" width="140" height="28" rx="6" fill="rgba(245,158,11,0.15)" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="170" cy="14" r="4.5" fill="#F59E0B"/>
      <text x="183" y="18" font-size="11.5" font-weight="700" fill="#FDE68A">Chờ bổ sung 48h</text>

      <rect x="310" y="0" width="150" height="28" rx="6" fill="rgba(225,29,72,0.15)" stroke="#F43F5E" stroke-width="1"/>
      <circle cx="325" cy="14" r="4.5" fill="#F43F5E"/>
      <text x="338" y="18" font-size="11.5" font-weight="700" fill="#FECDD3">Chuyển giao HITL</text>
    </g>
  </g>

  <!-- ==================== 4 SWIMLANES POOL ==================== -->
  <g id="Swimlanes_Pool" transform="translate(60, 125)">
    
    <!-- SWIMLANE 1: CLIENT & USER INTERFACE -->
    <g id="Lane_Client">
      <rect x="0" y="0" width="1800" height="200" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="0" y="0" width="48" height="200" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="-100" y="30" transform="rotate(-90)" class="lane-text" text-anchor="middle">1. KHÁCH HÀNG / UI</text>
    </g>

    <!-- SWIMLANE 2: AI AGENT ORCHESTRATOR -->
    <g id="Lane_AI_Agent" transform="translate(0, 200)">
      <rect x="0" y="0" width="1800" height="230" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="0" y="0" width="48" height="230" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="-115" y="30" transform="rotate(-90)" class="lane-text" text-anchor="middle">2. AI ORCHESTRATOR</text>
    </g>

    <!-- SWIMLANE 3: CORE BACKEND & RAG -->
    <g id="Lane_Core_Backend" transform="translate(0, 430)">
      <rect x="0" y="0" width="1800" height="240" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="0" y="0" width="48" height="240" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="-120" y="30" transform="rotate(-90)" class="lane-text" text-anchor="middle">3. HỆ THỐNG LÕI &amp; RAG</text>
    </g>

    <!-- SWIMLANE 4: HUMAN SPECIALIST (HITL) -->
    <g id="Lane_Human_HITL" transform="translate(0, 670)">
      <rect x="0" y="0" width="1800" height="220" fill="#FFF1F2" fill-opacity="0.4" stroke="#FECDD3" stroke-width="1.5"/>
      <rect x="0" y="0" width="48" height="220" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1.5"/>
      <text x="-110" y="30" transform="rotate(-90)" class="lane-text" fill="#BE123C" text-anchor="middle">4. CON NGƯỜI (HITL)</text>
    </g>
  </g>

  <!-- ==================== FLOW NODES & ARROWS ==================== -->

  <!-- [START EVENT] (Lane 1) -->
  <g id="Node_Start" transform="translate(130, 205)">
    <circle cx="20" cy="20" r="20" fill="#ECFDF5" stroke="#10B981" stroke-width="3" filter="url(#cleanShadow)"/>
    <polygon points="16,12 28,20 16,28" fill="#059669"/>
    <text x="20" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Bắt đầu</text>
  </g>

  <!-- Connect Start -> Task 1 -->
  <path d="M 170 225 L 220 225" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- [TASK 1: USER INPUT] (Lane 1) -->
  <g id="Task_Input" transform="translate(220, 185)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="14" y="26" class="node-title">Khách báo sự cố</text>
    <text x="14" y="46" class="node-desc">Nhập văn bản tự do:</text>
    <text x="14" y="64" font-size="11" font-weight="600" fill="#4F46E5">"Đơn NX-884... bị vỡ nát"</text>
  </g>

  <!-- Connect Task 1 -> Task 2 (Down to Lane 2) -->
  <path d="M 310 265 L 310 370 L 350 370" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- [TASK 2: CONTEXT DISAMBIGUATION] (Lane 2) -->
  <g id="Task_Context" transform="translate(350, 330)">
    <rect x="0" y="0" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#818CF8" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="14" y="26" class="node-title">Agent 1: Tách Context</text>
    <text x="14" y="46" class="node-desc">Bóc tách Entity: Mã NX-,</text>
    <text x="14" y="64" class="node-desc">Loại sự cố (Vỡ / Mất / Trễ)</text>
  </g>

  <!-- Connect Task 2 -> Gateway 1 -->
  <path d="M 560 370 L 610 370" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- [GATEWAY 1: ĐÃ ĐĂNG NHẬP?] (Lane 2) -->
  <g id="GW_Auth" transform="translate(610, 340)">
    <polygon points="30,0 60,30 30,60 0,30" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#cleanShadow)"/>
    <text x="30" y="28" class="gateway-text">Đã đăng</text>
    <text x="30" y="42" class="gateway-text">nhập?</text>
  </g>

  <!-- Branch GW 1 -> NO (Guest Guard) Up to Lane 1 -->
  <path d="M 640 340 L 640 240 L 680 240" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="648" y="290" class="label-no" fill="#D97706">KHÔNG</text>

  <!-- [CASE 7: GUEST PII MASKING] (Lane 1) -->
  <g id="Card_Guest_PII" transform="translate(680, 200)">
    <rect x="0" y="0" width="180" height="75" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="12" y="22" fill="#B45309" class="badge-case">CASE 7: GUEST GUARD</text>
    <text x="12" y="42" font-size="11" font-weight="600" fill="#0F172A">Che mờ SĐT: 098***3456</text>
    <text x="12" y="60" font-size="11" fill="#D97706">Yêu cầu Đăng nhập</text>
  </g>

  <!-- Branch GW 1 -> YES (Down to Lane 3) -->
  <path d="M 640 400 L 640 495 L 680 495" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="648" y="450" class="label-yes">CÓ</text>

  <!-- [TASK 3: FETCH LIVE OPS] (Lane 3) -->
  <g id="Task_Live_Ops" transform="translate(680, 455)">
    <rect x="0" y="0" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="14" y="26" class="node-title">Truy vấn Vận hành</text>
    <text x="14" y="46" class="node-desc">Lấy trạng thái thực tế &amp;</text>
    <text x="14" y="64" class="node-desc">thời điểm ký nhận (t_del)</text>
  </g>

  <!-- Connect Task 3 -> Gateway 2 -->
  <path d="M 870 495 L 920 495" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- [GATEWAY 2: THỜI HIỆU 24H?] (Lane 3) -->
  <g id="GW_SLA" transform="translate(920, 465)">
    <polygon points="30,0 60,30 30,60 0,30" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#cleanShadow)"/>
    <text x="30" y="28" class="gateway-text">Trong</text>
    <text x="30" y="42" class="gateway-text">24 giờ?</text>
  </g>

  <!-- Branch GW 2 -> NO (Expired) Up to Lane 2 -->
  <path d="M 950 465 L 950 370 L 990 370" fill="none" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowRose)"/>
  <text x="958" y="420" class="label-no">&gt; 24H</text>

  <!-- [CASE 2: SLA EXPIRED] (Lane 2) -->
  <g id="Card_SLA_Expired" transform="translate(990, 330)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#FEF2F2" stroke="#FECDD3" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="12" y="22" fill="#BE123C" class="badge-case">CASE 2: QUÁ HẠN 24H</text>
    <text x="12" y="42" font-size="11" font-weight="600" fill="#0F172A">Từ chối tự động đền 100%</text>
    <text x="12" y="60" font-size="11" fill="#E11D48">Tặng Voucher 30% cước</text>
  </g>

  <!-- Branch GW 2 -> YES (Valid) Continue Lane 3 -->
  <path d="M 980 495 L 1030 495" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="988" y="487" class="label-yes">≤ 24H</text>

  <!-- [TASK 4: RAG POLICY] (Lane 3) -->
  <g id="Task_RAG_Policy" transform="translate(1030, 455)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="14" y="26" class="node-title">Agent 2: RAG Chính sách</text>
    <text x="14" y="46" class="node-desc">Truy xuất luật bồi thường,</text>
    <text x="14" y="64" class="node-desc">hạn mức bảo hiểm Khai giá</text>
  </g>

  <!-- Connect Task 4 -> Gateway 3 -->
  <path d="M 1210 495 L 1250 495" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- [GATEWAY 3: ĐỦ BẰNG CHỨNG?] (Lane 3) -->
  <g id="GW_Evidence" transform="translate(1250, 465)">
    <polygon points="30,0 60,30 30,60 0,30" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#cleanShadow)"/>
    <text x="30" y="28" class="gateway-text">Đủ ảnh &amp;</text>
    <text x="30" y="42" class="gateway-text">BBBT?</text>
  </g>

  <!-- Branch GW 3 -> NO (Missing) Up to Lane 2 -->
  <path d="M 1280 465 L 1280 370 L 1320 370" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1288" y="420" class="label-amber">THIẾU</text>

  <!-- [CASE 3: PENDING EVIDENCE] (Lane 2) -->
  <g id="Card_Pending_Evidence" transform="translate(1320, 330)">
    <rect x="0" y="0" width="180" height="80" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#cleanShadow)"/>
    <text x="12" y="22" fill="#B45309" class="badge-case">CASE 3: CHỜ BỔ SUNG</text>
    <text x="12" y="42" font-size="11" font-weight="600" fill="#0F172A">Gửi Link upload 3 ảnh vỡ</text>
    <text x="12" y="60" font-size="11" fill="#D97706">Hạn nộp: Trong 48 giờ</text>
  </g>

  <!-- Branch GW 3 -> YES (Continue Lane 3) -->
  <path d="M 1310 495 L 1360 495" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1318" y="487" class="label-yes">ĐỦ</text>

  <!-- [GATEWAY 4: TIÊU CHÍ DUYỆT TỰ ĐỘNG?] (Lane 3) -->
  <g id="GW_Auto_Approve" transform="translate(1360, 465)">
    <polygon points="30,0 60,30 30,60 0,30" fill="#FFFFFF" stroke="#10B981" stroke-width="2" filter="url(#cleanShadow)"/>
    <text x="30" y="24" class="gateway-text">≤ 2 Triệu &amp;</text>
    <text x="30" y="38" class="gateway-text">Độ tin cậy</text>
    <text x="30" y="52" class="gateway-text">≥ 85%?</text>
  </g>

  <!-- Branch GW 4 -> YES (HAPPY PATH) Up to Lane 1 (AUTO APPROVED CARD) -->
  <path d="M 1390 465 L 1390 225 L 1440 225" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1398" y="290" class="label-yes" font-size="11">ĐẠT (YES)</text>

  <!-- [FINAL 1: AUTO APPROVED CARD] (Lane 1) -->
  <g id="Final_Auto_Approved" transform="translate(1440, 185)">
    <rect x="0" y="0" width="300" height="85" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="14" y="24" fill="#065F46" class="badge-case">CASE 1: TỰ ĐỘNG BỒI THƯỜNG (HAPPY PATH)</text>
    <text x="14" y="46" font-size="12.5" font-weight="700" fill="#0F172A">✔ Sinh mã Ticket: CLM-88219</text>
    <text x="14" y="66" font-size="11.5" fill="#047857">Chuyển tiền vào Ví Shop / Khách trong 2 giờ</text>
  </g>

  <!-- End Event 1 -->
  <g id="End_Event_1" transform="translate(1765, 212)">
    <circle cx="13" cy="13" r="13" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
    <rect x="8" y="8" width="10" height="10" fill="#059669"/>
  </g>
  <path d="M 1740 225 L 1765 225" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Branch GW 4 -> NO (ESCALATE TO HITL) Down to Lane 4 -->
  <path d="M 1390 525 L 1390 755 L 1440 755" fill="none" stroke="#E11D48" stroke-width="2.5" marker-end="url(#arrowRose)"/>
  <text x="1398" y="630" class="label-no" font-size="11">&gt; 2 TRIỆU / TRANH CHẤP</text>

  <!-- [TASK 5: HITL DISPATCHING] (Lane 4) -->
  <g id="Task_HITL_Dispatch" transform="translate(1440, 715)">
    <rect x="0" y="0" width="300" height="85" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="14" y="24" fill="#BE123C" class="badge-case">CASE 4: CHUYỂN GIAO THẨM ĐỊNH VIÊN (HITL)</text>
    <text x="14" y="46" font-size="12.5" font-weight="700" fill="#0F172A">⚖️ Đóng gói Dossier hồ sơ sự cố</text>
    <text x="14" y="66" font-size="11.5" fill="#E11D48">Gán Ticket cho Trưởng Bưu cục • Cam kết gọi 2h</text>
  </g>

  <!-- End Event 2 -->
  <g id="End_Event_2" transform="translate(1765, 742)">
    <circle cx="13" cy="13" r="13" fill="#FFF1F2" stroke="#E11D48" stroke-width="3"/>
    <rect x="8" y="8" width="10" height="10" fill="#BE123C"/>
  </g>
  <path d="M 1740 755 L 1765 755" fill="none" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowRose)"/>

  <!-- ==================== FOOTER STANDARDS ==================== -->
  <g id="Footer" transform="translate(60, 1030)">
    <rect x="0" y="0" width="1800" height="35" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="22" font-size="11.5" fill="#64748B">
      Tiêu chuẩn thiết kế: <tspan font-weight="700" fill="#0F172A">BPMN 2.0 Chuẩn Công nghiệp</tspan> • Luồng trực giao 90° (Orthogonal Lines) • Tách bạch trách nhiệm 4 làn bơi • Sẵn sàng import vào Figma &amp; in ấn slide Khóa luận tốt nghiệp.
    </text>
  </g>
</svg>
