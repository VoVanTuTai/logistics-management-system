<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#FFFFFF;">
  <defs>
    <!-- Monochrome Arrow Markers -->
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    text { font-family: "Times New Roman", Times, "Segoe UI", -apple-system, serif; }
    .doc-title { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .doc-sub { font-size: 13px; font-style: italic; fill: #333333; text-anchor: middle; }
    .lane-title { font-size: 12px; font-weight: bold; fill: #000000; text-transform: uppercase; letter-spacing: 1px; }
    .node-title { font-size: 13px; font-weight: bold; fill: #000000; }
    .node-desc { font-size: 11px; fill: #222222; }
    .gw-text { font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .branch-label { font-size: 11px; font-weight: bold; fill: #000000; }
    .case-label { font-size: 11px; font-weight: bold; fill: #000000; }
  </style>

  <!-- ==================== HEADER (CHUẨN BÁO CÁO KHÓA LUẬN) ==================== -->
  <g id="Header" transform="translate(0, 30)">
    <text x="800" y="25" class="doc-title">HÌNH 4.1: SƠ ĐỒ QUY TRÌNH NGHIỆP VỤ (BPMN 2.0) XỬ LÝ SỰ CỐ &amp; KHIẾU NẠI BƯU PHẨM</text>
    <text x="800" y="48" class="doc-sub">Phân định trách nhiệm 4 làn bơi, 4 điểm kiểm soát điều kiện và cơ chế chuyển giao con người (HITL)</text>
    <line x1="100" y1="65" x2="1500" y2="65" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- ==================== 4 SWIMLANES POOL ==================== -->
  <g id="Swimlanes_Pool" transform="translate(100, 110)">
    
    <!-- Outer Box -->
    <rect x="0" y="0" width="1400" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

    <!-- SWIMLANE 1: KHÁCH HÀNG & GIAO DIỆN -->
    <g id="Lane_1">
      <line x1="0" y1="180" x2="1400" y2="180" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="40" height="180" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="-90" y="25" transform="rotate(-90)" class="lane-title" text-anchor="middle">LÀN 1: KHÁCH HÀNG / GIAO DIỆN</text>
    </g>

    <!-- SWIMLANE 2: AI AGENT ORCHESTRATOR -->
    <g id="Lane_2" transform="translate(0, 180)">
      <line x1="0" y1="200" x2="1400" y2="200" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="40" height="200" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="-100" y="25" transform="rotate(-90)" class="lane-title" text-anchor="middle">LÀN 2: AI ORCHESTRATOR (:3013)</text>
    </g>

    <!-- SWIMLANE 3: HỆ THỐNG LÕI & RAG -->
    <g id="Lane_3" transform="translate(0, 380)">
      <line x1="0" y1="220" x2="1400" y2="220" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="40" height="220" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="-110" y="25" transform="rotate(-90)" class="lane-title" text-anchor="middle">LÀN 3: HỆ THỐNG LÕI &amp; RAG</text>
    </g>

    <!-- SWIMLANE 4: CON NGƯỜI (HITL) -->
    <g id="Lane_4" transform="translate(0, 600)">
      <rect x="0" y="0" width="40" height="200" fill="#E5E7EB" stroke="#000000" stroke-width="1"/>
      <text x="-100" y="25" transform="rotate(-90)" class="lane-title" text-anchor="middle">LÀN 4: CON NGƯỜI (HITL)</text>
    </g>
  </g>

  <!-- ==================== BPMN ELEMENTS (MONOCHROME) ==================== -->

  <!-- [START EVENT] (Lane 1) -->
  <g id="Start_Event" transform="translate(160, 180)">
    <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="20" y="52" text-anchor="middle" font-size="11" font-weight="bold">Bắt đầu</text>
  </g>

  <!-- Line Start -> Task 1 -->
  <path d="M 200 200 L 235 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- [TASK 1: USER INPUT] (Lane 1) -->
  <g id="Task_1" transform="translate(235, 165)">
    <rect x="0" y="0" width="160" height="70" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="22" class="node-title">1. Nhập câu hỏi</text>
    <text x="10" y="40" class="node-desc">• Khách báo hàng hỏng</text>
    <text x="10" y="56" class="node-desc">• Ví dụ: "Đơn NX-..."</text>
  </g>

  <!-- Line Task 1 -> Task 2 (Down to Lane 2) -->
  <path d="M 315 235 L 315 340 L 350 340" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- [TASK 2: CONTEXT DISAMBIGUATION] (Lane 2) -->
  <g id="Task_2" transform="translate(350, 305)">
    <rect x="0" y="0" width="175" height="70" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="22" class="node-title">2. Tách Context</text>
    <text x="10" y="40" class="node-desc">• Trích xuất mã NX-</text>
    <text x="10" y="56" class="node-desc">• Nhận diện loại sự cố</text>
  </g>

  <!-- Line Task 2 -> Gateway 1 -->
  <path d="M 525 340 L 565 340" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- [GATEWAY 1: ĐÃ ĐĂNG NHẬP?] (Lane 2) -->
  <g id="GW_1" transform="translate(565, 315)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="25" y="23" class="gw-text">Đã đăng</text>
    <text x="25" y="36" class="gw-text">nhập?</text>
  </g>

  <!-- Branch GW 1 -> [Không] (Up to Lane 1) -->
  <path d="M 590 315 L 590 200 L 630 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="596" y="250" class="branch-label">[Không]</text>

  <!-- [CASE 7: GUEST PII MASKING] (Lane 1) -->
  <g id="Case_7_Guest" transform="translate(630, 165)">
    <rect x="0" y="0" width="165" height="70" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="20" class="case-label">CASE 7: KHÁCH VÃNG LAI</text>
    <text x="10" y="38" class="node-desc">• Che SĐT: 098***3456</text>
    <text x="10" y="54" class="node-desc">• Yêu cầu Đăng nhập</text>
  </g>

  <!-- Branch GW 1 -> [Có] (Down to Lane 3) -->
  <path d="M 590 365 L 590 535 L 630 535" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="596" y="440" class="branch-label">[Có]</text>

  <!-- [TASK 3: FETCH LIVE OPS] (Lane 3) -->
  <g id="Task_3" transform="translate(630, 500)">
    <rect x="0" y="0" width="165" height="70" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="22" class="node-title">3. Truy vấn Vận hành</text>
    <text x="10" y="40" class="node-desc">• Lấy trạng thái từ DB</text>
    <text x="10" y="56" class="node-desc">• Lấy thời gian ký nhận</text>
  </g>

  <!-- Line Task 3 -> Gateway 2 -->
  <path d="M 795 535 L 835 535" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- [GATEWAY 2: THỜI HIỆU 24H?] (Lane 3) -->
  <g id="GW_2" transform="translate(835, 510)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="25" y="23" class="gw-text">Trong</text>
    <text x="25" y="36" class="gw-text">24 giờ?</text>
  </g>

  <!-- Branch GW 2 -> [> 24h] (Up to Lane 2) -->
  <path d="M 860 510 L 860 340 L 900 340" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="866" y="420" class="branch-label">[&gt; 24h]</text>

  <!-- [CASE 2: SLA EXPIRED] (Lane 2) -->
  <g id="Case_2_Expired" transform="translate(900, 305)">
    <rect x="0" y="0" width="165" height="70" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="20" class="case-label">CASE 2: QUÁ HẠN 24H</text>
    <text x="10" y="38" class="node-desc">• Từ chối đền 100%</text>
    <text x="10" y="54" class="node-desc">• Tặng Voucher 30% cước</text>
  </g>

  <!-- Branch GW 2 -> [≤ 24h] (Continue Lane 3) -->
  <path d="M 885 535 L 925 535" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="890" y="525" class="branch-label">[≤ 24h]</text>

  <!-- [TASK 4: RAG POLICY] (Lane 3) -->
  <g id="Task_4" transform="translate(925, 500)">
    <rect x="0" y="0" width="155" height="70" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="22" class="node-title">4. RAG Chính sách</text>
    <text x="10" y="40" class="node-desc">• Đối chiếu luật BBBT</text>
    <text x="10" y="56" class="node-desc">• Lấy mức bồi thường</text>
  </g>

  <!-- Line Task 4 -> Gateway 3 -->
  <path d="M 1080 535 L 1115 535" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- [GATEWAY 3: ĐỦ BẰNG CHỨNG?] (Lane 3) -->
  <g id="GW_3" transform="translate(1115, 510)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="25" y="23" class="gw-text">Đủ ảnh</text>
    <text x="25" y="36" class="gw-text">&amp; BBBT?</text>
  </g>

  <!-- Branch GW 3 -> [Thiếu] (Up to Lane 2) -->
  <path d="M 1140 510 L 1140 340 L 1175 340" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="1146" y="420" class="branch-label">[Thiếu]</text>

  <!-- [CASE 3: PENDING EVIDENCE] (Lane 2) -->
  <g id="Case_3_Missing" transform="translate(1175, 305)">
    <rect x="0" y="0" width="165" height="70" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="20" class="case-label">CASE 3: CHỜ BỔ SUNG</text>
    <text x="10" y="38" class="node-desc">• Gửi Link tải 3 ảnh vỡ</text>
    <text x="10" y="54" class="node-desc">• Hạn bổ sung: 48 giờ</text>
  </g>

  <!-- Branch GW 3 -> [Đủ] (Continue Lane 3) -->
  <path d="M 1165 535 L 1205 535" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="1170" y="525" class="branch-label">[Đủ]</text>

  <!-- [GATEWAY 4: TIÊU CHÍ DUYỆT TỰ ĐỘNG?] (Lane 3) -->
  <g id="GW_4" transform="translate(1205, 510)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="25" y="21" class="gw-text">≤ 2 Triệu</text>
    <text x="25" y="34" class="gw-text">&amp; Không</text>
    <text x="25" y="46" class="gw-text">tranh chấp?</text>
  </g>

  <!-- Branch GW 4 -> [Đạt] Up to Lane 1 (AUTO APPROVE) -->
  <path d="M 1230 510 L 1230 200 L 1265 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="1236" y="260" class="branch-label">[Đạt]</text>

  <!-- [FINAL 1: AUTO APPROVED CARD] (Lane 1) -->
  <g id="Final_1" transform="translate(1265, 165)">
    <rect x="0" y="0" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="10" y="20" class="case-label">CASE 1: TỰ ĐỘNG DUYỆT</text>
    <text x="10" y="38" class="node-desc">• Tạo Ticket: CLM-88219</text>
    <text x="10" y="54" class="node-desc">• Chuyển tiền trong 2 giờ</text>
  </g>

  <!-- End 1 -->
  <g id="End_1" transform="translate(1460, 190)">
    <circle cx="10" cy="10" r="10" fill="#000000"/>
    <circle cx="10" cy="10" r="7" fill="#FFFFFF"/>
    <circle cx="10" cy="10" r="4" fill="#000000"/>
  </g>
  <path d="M 1445 200 L 1460 200" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- Branch GW 4 -> [Không đạt] Down to Lane 4 (HITL) -->
  <path d="M 1230 560 L 1230 790 L 1265 790" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="1236" y="680" class="branch-label">[Không đạt / &gt; 2M]</text>

  <!-- [TASK 5: HITL DISPATCHING] (Lane 4) -->
  <g id="Task_5_HITL" transform="translate(1265, 755)">
    <rect x="0" y="0" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="10" y="20" class="case-label">CASE 4: CHUYỂN GIAO (HITL)</text>
    <text x="10" y="38" class="node-desc">• Đóng gói Dossier sự cố</text>
    <text x="10" y="54" class="node-desc">• Bàn giao Trưởng Bưu cục</text>
  </g>

  <!-- End 2 -->
  <g id="End_2" transform="translate(1460, 780)">
    <circle cx="10" cy="10" r="10" fill="#000000"/>
    <circle cx="10" cy="10" r="7" fill="#FFFFFF"/>
    <circle cx="10" cy="10" r="4" fill="#000000"/>
  </g>
  <path d="M 1445 790 L 1460 790" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>

  <!-- ==================== FOOTER ==================== -->
  <g id="Footer" transform="translate(100, 930)">
    <line x1="0" y1="0" x2="1400" y2="0" stroke="#000000" stroke-width="1"/>
    <text x="0" y="22" font-size="11" font-style="italic" fill="#333333">
      Ghi chú: Sơ đồ vẽ theo chuẩn BPMN 2.0 (Business Process Model and Notation). Đường nét đen trắng tiêu chuẩn in ấn đồ án kỹ thuật.
    </text>
  </g>
</svg>
