<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 960" width="1650" height="960" style="background:#FFFFFF;">
  <style>
    text { font-family: Arial, "Times New Roman", sans-serif; }
    .doc-title { font-size: 17px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .doc-sub { font-size: 12.5px; font-style: italic; fill: #333333; text-anchor: middle; }
    .lane-text { font-size: 11.5px; font-weight: bold; fill: #000000; text-transform: uppercase; letter-spacing: 1px; }
    .box-title { font-size: 12.5px; font-weight: bold; fill: #000000; }
    .box-sub { font-size: 11px; fill: #222222; }
    .gw-text { font-size: 10.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .branch-text { font-size: 11px; font-weight: bold; fill: #000000; }
  </style>

  <!-- ==================== HEADER (CHUẨN BÁO CÁO KHÓA LUẬN) ==================== -->
  <g id="Header">
    <text x="825" y="45" class="doc-title">HÌNH 4.1: SƠ ĐỒ TIẾN TRÌNH NGHIỆP VỤ (BPMN 2.0) XỬ LÝ SỰ CỐ &amp; KHIẾU NẠI BƯU PHẨM</text>
    <text x="825" y="65" class="doc-sub">Quy chuẩn luồng trực giao 90°: Phân định 4 làn trách nhiệm, các điểm kiểm soát điều kiện và cơ chế Human-in-the-Loop</text>
    <line x1="80" y1="80" x2="1570" y2="80" stroke="#000000" stroke-width="1.2"/>
  </g>

  <!-- ==================== 4 SWIMLANES POOL ==================== -->
  <g id="Pool">
    <!-- Khung bao ngoài toàn bộ bể bơi -->
    <rect x="80" y="100" width="1490" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>

    <!-- LÀN 1: KHÁCH HÀNG / GIAO DIỆN (y: 100 -> 280, cao 180, tâm y: 190) -->
    <line x1="80" y1="280" x2="1570" y2="280" stroke="#000000" stroke-width="1.2"/>
    <rect x="80" y="100" width="40" height="180" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
    <text x="-190" y="105" transform="rotate(-90)" class="lane-text" text-anchor="middle">LÀN 1: KHÁCH HÀNG / GIAO DIỆN</text>

    <!-- LÀN 2: AI ORCHESTRATOR (y: 280 -> 480, cao 200, tâm y: 380) -->
    <line x1="80" y1="480" x2="1570" y2="480" stroke="#000000" stroke-width="1.2"/>
    <rect x="80" y="280" width="40" height="200" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="-380" y="105" transform="rotate(-90)" class="lane-text" text-anchor="middle">LÀN 2: AI ORCHESTRATOR (:3013)</text>

    <!-- LÀN 3: HỆ THỐNG LÕI & RAG (y: 480 -> 700, cao 220, tâm y: 590) -->
    <line x1="80" y1="700" x2="1570" y2="700" stroke="#000000" stroke-width="1.2"/>
    <rect x="80" y="480" width="40" height="220" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
    <text x="-590" y="105" transform="rotate(-90)" class="lane-text" text-anchor="middle">LÀN 3: HỆ THỐNG LÕI &amp; RAG</text>

    <!-- LÀN 4: CON NGƯỜI (HITL) (y: 700 -> 900, cao 200, tâm y: 800) -->
    <rect x="80" y="700" width="40" height="200" fill="#E5E7EB" stroke="#000000" stroke-width="1"/>
    <text x="-800" y="105" transform="rotate(-90)" class="lane-text" text-anchor="middle">LÀN 4: CON NGƯỜI (HITL)</text>
  </g>

  <!-- ==================== CÁC NÚT TÁC VỤ (NODES & TASKS) - TỌA ĐỘ TUYỆT ĐỐI ==================== -->

  <!-- [BẮT ĐẦU] (Làn 1, tâm y = 190) -->
  <g id="Start_Node">
    <circle cx="165" cy="190" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="165" y="222" text-anchor="middle" font-size="11" font-weight="bold">Bắt đầu</text>
  </g>

  <!-- Mũi tên: Bắt đầu -> Tác vụ 1 -->
  <line x1="185" y1="190" x2="220" y2="190" stroke="#000000" stroke-width="1.5"/>
  <polygon points="220,186 228,190 220,194" fill="#000000"/>

  <!-- [TÁC VỤ 1: NHẬP PHẢN ÁNH] (Làn 1, x: 230 -> 390, y: 160 -> 220) -->
  <g id="Task_1">
    <rect x="230" y="160" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="242" y="182" class="box-title">1. Nhập phản ánh</text>
    <text x="242" y="198" class="box-sub">• Khách báo hàng hỏng</text>
    <text x="242" y="211" class="box-sub">• "Đơn NX-... bị vỡ nát"</text>
  </g>

  <!-- Mũi tên: Tác vụ 1 Đáy (x: 310, y: 220) -> Tác vụ 2 Trái (x: 360, y: 380) -->
  <polyline points="310,220 310,380 352,380" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="352,376 360,380 352,384" fill="#000000"/>

  <!-- [TÁC VỤ 2: TÁCH CONTEXT] (Làn 2, x: 360 -> 520, y: 350 -> 410) -->
  <g id="Task_2">
    <rect x="360" y="350" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="372" y="372" class="box-title">2. Tách Context</text>
    <text x="372" y="388" class="box-sub">• Trích xuất mã: NX-...</text>
    <text x="372" y="401" class="box-sub">• Bóc tách loại: Bể vỡ</text>
  </g>

  <!-- Mũi tên: Tác vụ 2 Phải (520, 380) -> Gateway 1 Trái (560, 380) -->
  <line x1="520" y1="380" x2="552" y2="380" stroke="#000000" stroke-width="1.5"/>
  <polygon points="552,376 560,380 552,384" fill="#000000"/>

  <!-- [GATEWAY 1: ĐÃ ĐĂNG NHẬP?] (Làn 2, Tâm: 585, 380) -->
  <g id="GW_1">
    <polygon points="585,355 610,380 585,405 560,380" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="585" y="377" class="gw-text">Đã đăng</text>
    <text x="585" y="389" class="gw-text">nhập?</text>
  </g>

  <!-- Nhánh [Không]: GW 1 Đỉnh trên (585, 355) -> Lên Làn 1 (585, 190) -> Case 7 Trái (640, 190) -->
  <polyline points="585,355 585,190 632,190" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="632,186 640,190 632,194" fill="#000000"/>
  <text x="593" y="275" class="branch-text">[Không]</text>

  <!-- [CASE 7: GUEST GUARD] (Làn 1, x: 640 -> 800, y: 160 -> 220) -->
  <g id="Case_7">
    <rect x="640" y="160" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="652" y="180" class="box-title">CASE 7: GUEST GUARD</text>
    <text x="652" y="196" class="box-sub">• Che SĐT: 098***3456</text>
    <text x="652" y="209" class="box-sub">• Yêu cầu Đăng nhập</text>
  </g>

  <!-- Nhánh [Có]: GW 1 Đỉnh dưới (585, 405) -> Xuống Làn 3 (585, 590) -> Tác vụ 3 Trái (640, 590) -->
  <polyline points="585,405 585,590 632,590" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="632,586 640,590 632,594" fill="#000000"/>
  <text x="593" y="500" class="branch-text">[Có]</text>

  <!-- [TÁC VỤ 3: TRUY VẤN VẬN HÀNH] (Làn 3, x: 640 -> 800, y: 560 -> 620) -->
  <g id="Task_3">
    <rect x="640" y="560" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="652" y="582" class="box-title">3. Truy vấn Vận hành</text>
    <text x="652" y="598" class="box-sub">• Trạng thái: DELIVERED</text>
    <text x="652" y="611" class="box-sub">• Giờ ký nhận (t_del)</text>
  </g>

  <!-- Mũi tên: Tác vụ 3 Phải (800, 590) -> Gateway 2 Trái (840, 590) -->
  <line x1="800" y1="590" x2="832" y2="590" stroke="#000000" stroke-width="1.5"/>
  <polygon points="832,586 840,590 832,594" fill="#000000"/>

  <!-- [GATEWAY 2: THỜI HIỆU 24H?] (Làn 3, Tâm: 865, 590) -->
  <g id="GW_2">
    <polygon points="865,565 890,590 865,615 840,590" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="865" y="587" class="gw-text">Trong</text>
    <text x="865" y="599" class="gw-text">24 giờ?</text>
  </g>

  <!-- Nhánh [> 24h]: GW 2 Đỉnh trên (865, 565) -> Lên Làn 2 (865, 380) -> Case 2 Trái (920, 380) -->
  <polyline points="865,565 865,380 912,380" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="912,376 920,380 912,384" fill="#000000"/>
  <text x="873" y="475" class="branch-text">[&gt; 24h]</text>

  <!-- [CASE 2: SLA EXPIRED] (Làn 2, x: 920 -> 1080, y: 350 -> 410) -->
  <g id="Case_2">
    <rect x="920" y="350" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="932" y="370" class="box-title">CASE 2: QUÁ HẠN 24H</text>
    <text x="932" y="386" class="box-sub">• Từ chối tự động đền 100%</text>
    <text x="932" y="399" class="box-sub">• Tặng Voucher cước 30%</text>
  </g>

  <!-- Nhánh [≤ 24h]: GW 2 Đỉnh phải (890, 590) -> Tác vụ 4 Trái (920, 590) -->
  <line x1="890" y1="590" x2="912" y2="590" stroke="#000000" stroke-width="1.5"/>
  <polygon points="912,586 920,590 912,594" fill="#000000"/>
  <text x="893" y="580" class="branch-text">[≤ 24h]</text>

  <!-- [TÁC VỤ 4: RAG POLICY] (Làn 3, x: 920 -> 1080, y: 560 -> 620) -->
  <g id="Task_4">
    <rect x="920" y="560" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="932" y="582" class="box-title">4. RAG Chính sách</text>
    <text x="932" y="598" class="box-sub">• Quy chuẩn BBBT 24h</text>
    <text x="932" y="611" class="box-sub">• Hạn mức Khai giá</text>
  </g>

  <!-- Mũi tên: Tác vụ 4 Phải (1080, 590) -> Gateway 3 Trái (1120, 590) -->
  <line x1="1080" y1="590" x2="1112" y2="590" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1112,586 1120,590 1112,594" fill="#000000"/>

  <!-- [GATEWAY 3: ĐỦ BẰNG CHỨNG?] (Làn 3, Tâm: 1145, 590) -->
  <g id="GW_3">
    <polygon points="1145,565 1170,590 1145,615 1120,590" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="1145" y="587" class="gw-text">Đủ ảnh &amp;</text>
    <text x="1145" y="599" class="gw-text">BBBT?</text>
  </g>

  <!-- Nhánh [Thiếu]: GW 3 Đỉnh trên (1145, 565) -> Lên Làn 2 (1145, 380) -> Case 3 Trái (1200, 380) -->
  <polyline points="1145,565 1145,380 1192,380" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1192,376 1200,380 1192,384" fill="#000000"/>
  <text x="1153" y="475" class="branch-text">[Thiếu]</text>

  <!-- [CASE 3: CHỜ BỔ SUNG] (Làn 2, x: 1200 -> 1360, y: 350 -> 410) -->
  <g id="Case_3">
    <rect x="1200" y="350" width="160" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="1212" y="370" class="box-title">CASE 3: CHỜ BỔ SUNG</text>
    <text x="1212" y="386" class="box-sub">• Gửi link tải ảnh vỡ</text>
    <text x="1212" y="399" class="box-sub">• Thời hạn: 48 giờ</text>
  </g>

  <!-- Nhánh [Đủ]: GW 3 Đỉnh phải (1170, 590) -> Gateway 4 Trái (1220, 590) -->
  <line x1="1170" y1="590" x2="1212" y2="590" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1212,586 1220,590 1212,594" fill="#000000"/>
  <text x="1175" y="580" class="branch-text">[Đủ]</text>

  <!-- [GATEWAY 4: DUYỆT TỰ ĐỘNG?] (Làn 3, Tâm: 1245, 590) -->
  <g id="GW_4">
    <polygon points="1245,565 1270,590 1245,615 1220,590" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="1245" y="585" class="gw-text">≤ 2 Triệu &amp;</text>
    <text x="1245" y="597" class="gw-text">Hợp lệ?</text>
  </g>

  <!-- Nhánh [Đạt]: GW 4 Đỉnh trên (1245, 565) -> Lên Làn 1 (1245, 190) -> Final 1 Trái (1310, 190) -->
  <polyline points="1245,565 1245,190 1302,190" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1302,186 1310,190 1302,194" fill="#000000"/>
  <text x="1253" y="275" class="branch-text">[Đạt]</text>

  <!-- [CASE 1: TỰ ĐỘNG DUYỆT] (Làn 1, x: 1310 -> 1490, y: 160 -> 220) -->
  <g id="Final_1">
    <rect x="1310" y="160" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1322" y="180" class="box-title">CASE 1: TỰ ĐỘNG DUYỆT</text>
    <text x="1322" y="196" class="box-sub">• Sinh mã: CLM-88219</text>
    <text x="1322" y="209" class="box-sub">• Chuyển tiền Ví trong 2h</text>
  </g>

  <!-- Mũi tên: Final 1 Phải (1490, 190) -> Kết thúc 1 (1525, 190) -->
  <line x1="1490" y1="190" x2="1515" y2="190" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1515,186 1523,190 1515,194" fill="#000000"/>
  <circle cx="1535" cy="190" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle cx="1535" cy="190" r="7" fill="#000000"/>

  <!-- Nhánh [Vượt ngưỡng / HITL]: GW 4 Đỉnh dưới (1245, 615) -> Xuống Làn 4 (1245, 800) -> Task 5 Trái (1310, 800) -->
  <polyline points="1245,615 1245,800 1302,800" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1302,796 1310,800 1302,804" fill="#000000"/>
  <text x="1253" y="710" class="branch-text">[&gt; 2M / HITL]</text>

  <!-- [CASE 4: CHUYỂN GIAO HITL] (Làn 4, x: 1310 -> 1490, y: 770 -> 830) -->
  <g id="Task_5_HITL">
    <rect x="1310" y="770" width="180" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="1322" y="790" class="box-title">CASE 4: CHUYỂN GIAO (HITL)</text>
    <text x="1322" y="806" class="box-sub">• Đóng gói Dossier sự cố</text>
    <text x="1322" y="819" class="box-sub">• Gán cho Trưởng bưu cục</text>
  </g>

  <!-- Mũi tên: Task 5 Phải (1490, 800) -> Kết thúc 2 (1525, 800) -->
  <line x1="1490" y1="800" x2="1515" y2="800" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1515,796 1523,800 1515,804" fill="#000000"/>
  <circle cx="1535" cy="800" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <circle cx="1535" cy="800" r="7" fill="#000000"/>

  <!-- ==================== FOOTER ==================== -->
  <g id="Footer">
    <line x1="80" y1="920" x2="1570" y2="920" stroke="#000000" stroke-width="1"/>
    <text x="80" y="940" font-size="11" font-style="italic" fill="#333333">
      Ghi chú: Sơ đồ vẽ theo chuẩn BPMN 2.0 (Business Process Model and Notation). Sử dụng mũi tên đa giác tuyệt đối (Explicit Polygons) tương thích 100% với Figma SVG Parser.
    </text>
  </g>
</svg>
