<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#FFFFFF;">
  <style>
    text { font-family: Arial, "Times New Roman", sans-serif; }
    .title-h1 { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .title-sub { font-size: 13px; font-style: italic; fill: #333333; text-anchor: middle; }
    .stage-title { font-size: 13px; font-weight: bold; fill: #000000; }
    .box-title { font-size: 13px; font-weight: bold; fill: #000000; }
    .box-sub { font-size: 11px; fill: #222222; }
    .math-text { font-family: Arial, "Times New Roman", serif; font-size: 12px; font-weight: bold; fill: #000000; }
  </style>

  <!-- ==================== HEADER ==================== -->
  <g id="Header">
    <text x="800" y="45" class="title-h1">HÌNH 2.1: QUY TRÌNH PHÂN ĐOẠN NGỮ NGHĨA &amp; VECTOR HÓA DỮ LIỆU BƯU CHÍNH (RAG PIPELINE)</text>
    <text x="800" y="65" class="title-sub">Giải thuật Hybrid Section-Aware Semantic Splitting, Cửa sổ trượt Overlap 16% và Không gian Vector 768 chiều</text>
    <line x1="80" y1="80" x2="1520" y2="80" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- ==================== 5 PIPELINE STAGES (MONOCHROME) ==================== -->

  <!-- STAGE 1: AST MARKDOWN PARSING (x: 80, w: 260) -->
  <g id="Stage_1">
    <rect x="80" y="100" width="260" height="780" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="80" y="100" width="260" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="92" y="123" class="stage-title">GIAI ĐOẠN 1: AST PARSER</text>

    <!-- Content 1.1 -->
    <rect x="95" y="155" width="230" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="105" y="177" class="box-title">Văn bản Nguồn (.md)</text>
    <text x="105" y="197" class="box-sub">• 01-pricing-iata.md</text>
    <text x="105" y="213" class="box-sub">• 02-insurance-claim.md</text>
    <text x="105" y="229" class="box-sub">• 09-negative-sop.md</text>
    <line x1="105" y1="240" x2="315" y2="240" stroke="#000000" stroke-width="0.5"/>
    <text x="105" y="260" class="box-sub">Đặc thù: Chứa bảng cước,</text>
    <text x="105" y="276" class="box-sub">mệnh đề điều kiện pháp lý</text>
    <text x="105" y="292" class="box-sub">và thời hạn 24 giờ</text>

    <!-- Arrow 1.1 -> 1.2 -->
    <line x1="210" y1="305" x2="210" y2="337" stroke="#000000" stroke-width="1.5"/>
    <polygon points="206,337 210,345 214,337" fill="#000000"/>

    <!-- Content 1.2 -->
    <rect x="95" y="345" width="230" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="105" y="367" class="box-title">Phân tích Cú pháp AST</text>
    <text x="105" y="387" class="box-sub">• Quét thẻ: #, ##, ###</text>
    <text x="105" y="403" class="box-sub">• Tách ranh giới Section</text>
    <text x="105" y="419" class="box-sub">• Khắc phục nhược điểm của</text>
    <text x="105" y="435" font-weight="bold" class="box-sub">  Naive Fixed-size Chunking</text>
    <line x1="105" y1="450" x2="315" y2="450" stroke="#000000" stroke-width="0.5"/>
    <text x="105" y="470" class="box-sub">Ngăn chặn việc cắt ngang</text>
    <text x="105" y="486" class="box-sub">giữa bảng tính cước và</text>
    <text x="105" y="502" class="box-sub">mệnh đề "NẾU có biên bản"</text>
  </g>

  <!-- Connect Stage 1 -> Stage 2 -->
  <line x1="340" y1="490" x2="372" y2="490" stroke="#000000" stroke-width="1.5"/>
  <polygon points="372,486 380,490 372,494" fill="#000000"/>

  <!-- STAGE 2: BREADCRUMB ENRICHMENT (x: 380, w: 260) -->
  <g id="Stage_2">
    <rect x="380" y="100" width="260" height="780" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="380" y="100" width="260" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="392" y="123" class="stage-title">GIAI ĐOẠN 2: BREADCRUMB</text>

    <rect x="395" y="155" width="230" height="390" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="405" y="177" class="box-title">Gắn Siêu dữ liệu Ngữ cảnh</text>
    <text x="405" y="199" class="box-sub">Mỗi Chunk được tự động nối</text>
    <text x="405" y="215" class="box-sub">tiền tố nguồn phân cấp:</text>

    <rect x="405" y="230" width="210" height="110" fill="#F9FAFB" stroke="#000000" stroke-width="0.5"/>
    <text x="410" y="250" class="math-text">Tiền tố Breadcrumb:</text>
    <text x="410" y="270" font-size="10" fill="#000000">"Tài liệu: Quy trình Khiếu nại &gt;</text>
    <text x="410" y="285" font-size="10" fill="#000000">Mục 3: Hàng bể vỡ khi đồng kiểm &gt;</text>
    <text x="410" y="300" font-size="10" fill="#000000">Điều kiện lập BBBT 24h:"</text>
    <text x="410" y="320" font-size="10" font-style="italic" fill="#333333">+ [Nội dung chi tiết...]</text>

    <line x1="405" y1="355" x2="615" y2="355" stroke="#000000" stroke-width="0.5"/>
    <text x="405" y="375" class="box-title">Tác dụng kỹ thuật:</text>
    <text x="405" y="395" class="box-sub">• Vector hóa luôn "nhớ" được</text>
    <text x="405" y="411" class="box-sub">  tiêu đề mục cha</text>
    <text x="405" y="431" class="box-sub">• Tránh nhầm lẫn giữa cước</text>
    <text x="405" y="447" class="box-sub">  nội thành và liên tỉnh</text>
    <text x="405" y="467" class="box-sub">• Giữ nguyên giá trị ngữ nghĩa</text>
    <text x="405" y="483" class="box-sub">  khi tìm kiếm câu ngắn</text>
  </g>

  <!-- Connect Stage 2 -> Stage 3 -->
  <line x1="640" y1="490" x2="672" y2="490" stroke="#000000" stroke-width="1.5"/>
  <polygon points="672,486 680,490 672,494" fill="#000000"/>

  <!-- STAGE 3: SLIDING WINDOW OVERLAP 16% (x: 680, w: 280) -->
  <g id="Stage_3">
    <rect x="680" y="100" width="280" height="780" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="680" y="100" width="280" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="692" y="123" class="stage-title">GIAI ĐOẠN 3: CỬA SỔ TRƯỢT</text>

    <rect x="695" y="155" width="250" height="390" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="705" y="177" class="box-title">Thông số Cửa sổ Trượt (Overlap)</text>
    <text x="705" y="199" class="box-sub">• Ngưỡng tối đa (MaxWords): 250 từ</text>
    <text x="705" y="217" class="box-sub">• Vùng gối đầu (Overlap): 40 từ</text>
    <text x="705" y="235" class="box-sub">• Bước trượt (Stride):</text>
    <text x="715" y="255" class="math-text">Stride = 250 - 40 = 210 từ</text>

    <line x1="705" y1="275" x2="935" y2="275" stroke="#000000" stroke-width="0.5"/>
    <text x="705" y="295" class="box-title">Tỷ lệ Chồng lấn Ngữ cảnh:</text>
    <text x="715" y="320" class="math-text">R_overlap = 40 / 250 = 16.0%</text>

    <!-- Visual Overlap Bars -->
    <rect x="705" y="345" width="180" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="715" y="361" font-size="10">Chunk A (Từ 1 - 250)</text>

    <rect x="845" y="377" width="90" height="24" fill="#E5E7EB" stroke="#000000" stroke-width="1"/>
    <text x="850" y="393" font-size="9" font-weight="bold">Vùng 40 từ</text>

    <rect x="845" y="409" width="90" height="24" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="850" y="425" font-size="10">Chunk B (Từ 211 - 460)</text>

    <text x="705" y="475" class="box-sub">Tác dụng: Đảm bảo không bị</text>
    <text x="705" y="493" class="box-sub">đứt gãy thông tin tại các điểm</text>
    <text x="705" y="511" class="box-sub">ranh giới cắt văn bản.</text>
  </g>

  <!-- Connect Stage 3 -> Stage 4 -->
  <line x1="960" y1="490" x2="992" y2="490" stroke="#000000" stroke-width="1.5"/>
  <polygon points="992,486 1000,490 992,494" fill="#000000"/>

  <!-- STAGE 4: 768-DIM VECTORIZATION (x: 1000, w: 260) -->
  <g id="Stage_4">
    <rect x="1000" y="100" width="260" height="780" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="1000" y="100" width="260" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="1012" y="123" class="stage-title">GIAI ĐOẠN 4: VECTOR HÓA</text>

    <rect x="1015" y="155" width="230" height="390" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1025" y="177" class="box-title">Gemini Embedding-001</text>
    <text x="1025" y="199" class="box-sub">• Mô hình: models/embedding-001</text>
    <text x="1025" y="217" class="box-sub">• Số chiều: D = 768 chiều thực</text>

    <rect x="1025" y="233" width="210" height="85" fill="#F9FAFB" stroke="#000000" stroke-width="0.5"/>
    <text x="1030" y="253" class="math-text">Không gian Vector R^768:</text>
    <text x="1030" y="273" font-size="10" fill="#000000">V = [v_1, v_2, ..., v_768]</text>
    <text x="1030" y="293" class="math-text">Chuẩn hóa L2: ||V||_2 = 1.0</text>

    <line x1="1025" y1="335" x2="1235" y2="335" stroke="#000000" stroke-width="0.5"/>
    <text x="1025" y="357" class="box-title">Tệp chỉ mục Vector:</text>
    <text x="1025" y="377" class="box-sub">• docs/knowledge-base/</text>
    <text x="1035" y="393" font-weight="bold" class="box-sub">  vector-index.json</text>
    <text x="1025" y="413" class="box-sub">• Tổng số: 62 Chunks đã nhúng</text>
    <text x="1025" y="433" class="box-sub">• Tốc độ truy vấn: &lt; 5 ms</text>
  </g>

  <!-- Connect Stage 4 -> Stage 5 -->
  <line x1="1260" y1="490" x2="1292" y2="490" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1292,486 1300,490 1292,494" fill="#000000"/>

  <!-- STAGE 5: HYBRID SEARCH SCORING (x: 1300, w: 220) -->
  <g id="Stage_5">
    <rect x="1300" y="100" width="220" height="780" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="1300" y="100" width="220" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="1310" y="123" class="stage-title">GIAI ĐOẠN 5: TÌM KIẾM LAI</text>

    <rect x="1312" y="155" width="196" height="390" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1322" y="177" class="box-title">Công thức Điểm Kép:</text>
    
    <rect x="1320" y="193" width="180" height="95" fill="#F9FAFB" stroke="#000000" stroke-width="0.5"/>
    <text x="1324" y="213" class="math-text">FinalScore =</text>
    <text x="1324" y="233" class="math-text">  0.70 × CosineScore</text>
    <text x="1324" y="253" class="math-text">+ 0.35 × LexicalScore</text>
    <text x="1324" y="273" font-size="10" fill="#333333">(Logistics Thesaurus)</text>

    <line x1="1320" y1="300" x2="1500" y2="300" stroke="#000000" stroke-width="0.5"/>
    <text x="1322" y="320" class="box-title">Ngưỡng lọc Chấp nhận:</text>
    <text x="1327" y="340" class="math-text">Threshold τ = 0.52</text>
    <text x="1322" y="365" class="box-sub">Các đoạn có điểm &lt; 0.52</text>
    <text x="1322" y="381" class="box-sub">sẽ bị loại bỏ, ngăn ngừa</text>
    <text x="1322" y="397" class="box-sub">nhiễu vào Context của LLM.</text>

    <line x1="1320" y1="415" x2="1500" y2="415" stroke="#000000" stroke-width="0.5"/>
    <text x="1322" y="435" class="box-title">Độ chính xác đạt:</text>
    <text x="1327" y="460" font-size="16" font-weight="bold" fill="#000000">96.8%</text>
    <text x="1322" y="480" class="box-sub">(So với 42.5% của Naive)</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="Footer">
    <line x1="80" y1="920" x2="1520" y2="920" stroke="#000000" stroke-width="1"/>
    <text x="80" y="940" font-size="11" font-style="italic" fill="#333333">
      Ghi chú: Sơ đồ luồng dữ liệu (Data Pipeline) theo quy chuẩn nghiên cứu khoa học. Sử dụng mũi tên đa giác tuyệt đối (Explicit Polygons) tương thích 100% với Figma SVG Parser.
    </text>
  </g>
</svg>
