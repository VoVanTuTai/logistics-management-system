<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#FFFFFF;">
  <style>
    text { font-family: Arial, "Times New Roman", sans-serif; }
    .title-h1 { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .title-sub { font-size: 13px; font-style: italic; fill: #333333; text-anchor: middle; }
    .tier-label { font-size: 13px; font-weight: bold; fill: #000000; text-transform: uppercase; }
    .box-title { font-size: 13px; font-weight: bold; fill: #000000; }
    .box-sub { font-size: 11px; fill: #222222; }
  </style>

  <!-- ==================== HEADER ==================== -->
  <g id="Header">
    <text x="800" y="45" class="title-h1">HÌNH 1.1: SƠ ĐỒ KIẾN TRÚC TỔNG THỂ HỆ THỐNG AI CHATBOT LOGISTICS ĐA TẦNG</text>
    <text x="800" y="65" class="title-sub">Mô hình triển khai phân tán tích hợp API Gateway, AI Orchestrator, Live Microservices Mesh và Động cơ RAG</text>
    <line x1="80" y1="80" x2="1520" y2="80" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- ==================== 4 ARCHITECTURE TIERS (MONOCHROME) ==================== -->
  
  <!-- TIER 1: CLIENT APPLICATIONS (y: 100) -->
  <g id="Tier_1_Clients">
    <rect x="80" y="100" width="1440" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="80" y="100" width="220" height="28" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="92" y="119" class="tier-label">TẦNG 1: CLIENT APPS (ĐA KÊNH)</text>

    <!-- Client Box 1 -->
    <rect x="110" y="145" width="310" height="85" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="122" y="167" class="box-title">Guest Web Portal (:5177)</text>
    <text x="122" y="187" class="box-sub">• Nền tảng: ReactJS / Vite SPA</text>
    <text x="122" y="203" class="box-sub">• Khách vãng lai tra cứu đơn hàng</text>
    <text x="122" y="219" class="box-sub">• Chế độ bảo mật: PII Masking</text>

    <!-- Client Box 2 -->
    <rect x="460" y="145" width="310" height="85" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="472" y="167" class="box-title">Customer Mobile App (:8082)</text>
    <text x="472" y="187" class="box-sub">• Nền tảng: React Native / Expo</text>
    <text x="472" y="203" class="box-sub">• Khách hàng nhận / Gửi cá nhân</text>
    <text x="472" y="219" class="box-sub">• Giao diện Thẻ tương tác 1 chạm</text>

    <!-- Client Box 3 -->
    <rect x="810" y="145" width="310" height="85" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="822" y="167" class="box-title">Merchant Web Portal (:5174)</text>
    <text x="822" y="187" class="box-sub">• Nền tảng: ReactJS Web Dashboard</text>
    <text x="822" y="203" class="box-sub">• Chủ cửa hàng thương mại điện tử</text>
    <text x="822" y="219" class="box-sub">• Tra cứu danh sách đơn gom, COD</text>

    <!-- Client Box 4 -->
    <rect x="1160" y="145" width="330" height="85" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1172" y="167" class="box-title">Operations Platform (:5173)</text>
    <text x="1172" y="187" class="box-sub">• Nền tảng: ReactJS Ops Dashboard</text>
    <text x="1172" y="203" class="box-sub">• Bưu tá, Trưởng bưu cục, Điều hành</text>
    <text x="1172" y="219" class="box-sub">• Tiếp nhận ca sự cố &amp; Khiếu nại HITL</text>
  </g>

  <!-- Connect Tier 1 -> Tier 2 -->
  <line x1="800" y1="250" x2="800" y2="292" stroke="#000000" stroke-width="1.5"/>
  <polygon points="796,292 800,300 804,292" fill="#000000"/>
  <text x="810" y="280" font-size="11" font-weight="bold">HTTPS / RESTful</text>

  <!-- TIER 2: API GATEWAY & SECURITY PROXY (y: 300) -->
  <g id="Tier_2_Gateway">
    <rect x="80" y="300" width="1440" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="80" y="300" width="300" height="28" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="92" y="319" class="tier-label">TẦNG 2: API GATEWAY &amp; PII PROXY (:3000)</text>

    <rect x="110" y="340" width="420" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="122" y="362" class="box-title">Định tuyến &amp; Tải cân bằng (Reverse Proxy)</text>
    <text x="122" y="382" class="box-sub">Single Point of Entry • Rate Limiting chống quét mã</text>

    <rect x="560" y="340" width="450" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="572" y="362" class="box-title">Xác thực &amp; Phân quyền (JWT Claims Resolver)</text>
    <text x="572" y="382" class="box-sub">Bóc tách Role: GUEST / CUSTOMER / MERCHANT / OPS</text>

    <rect x="1040" y="340" width="450" height="55" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1052" y="362" class="box-title">Bộ lọc Khử định danh (PII Sanitizer Pipeline)</text>
    <text x="1052" y="382" class="box-sub">Tự động che SĐT (098***), che địa chỉ nhà riêng cho khách vãng lai</text>
  </g>

  <!-- Connect Tier 2 -> Tier 3 -->
  <line x1="800" y1="410" x2="800" y2="452" stroke="#000000" stroke-width="1.5"/>
  <polygon points="796,452 800,460 804,452" fill="#000000"/>
  <text x="810" y="440" font-size="11" font-weight="bold">Internal Network</text>

  <!-- TIER 3: AI ORCHESTRATOR & LIVE MESH (y: 460) -->
  <g id="Tier_3_Orchestrator_Mesh">
    <rect x="80" y="460" width="1440" height="230" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="80" y="460" width="340" height="28" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="92" y="479" class="tier-label">TẦNG 3: AI ORCHESTRATOR &amp; LIVE MESH</text>

    <!-- AI Orchestrator Box -->
    <rect x="110" y="505" width="650" height="165" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="110" y="505" width="650" height="26" fill="#E5E7EB" stroke="#000000" stroke-width="1"/>
    <text x="122" y="523" class="box-title">AI Agent Orchestrator Service (NestJS :3013)</text>
    
    <text x="126" y="557" class="box-title">• Query Normalizer &amp; Logistics Thesaurus:</text>
    <text x="138" y="575" class="box-sub">Chuẩn hóa tiếng Việt, ánh xạ từ vựng: ["vỡ, bể"] → ["hư hỏng, bồi thường"]</text>

    <text x="126" y="599" class="box-title">• Deterministic Intent Parser (Context Disambiguation):</text>
    <text x="138" y="617" class="box-sub">Bóc tách Regex: mã đơn NX-XXXXXX, mã khiếu nại CLM-XXXXX</text>

    <text x="126" y="641" class="box-title">• State Machine Controller &amp; HITL Dispatcher:</text>
    <text x="138" y="659" class="box-sub">Điều phối 5 FR, kiểm soát ngưỡng tự động ≤ 2.000.000 đ và chuyển giao con người</text>

    <!-- Arrow Orchestrator -> Mesh -->
    <line x1="760" y1="585" x2="812" y2="585" stroke="#000000" stroke-width="1.5"/>
    <polygon points="812,581 820,585 812,589" fill="#000000"/>
    <text x="765" y="575" font-size="10" font-weight="bold">Fetch Live</text>

    <!-- Live Mesh Box -->
    <rect x="820" y="505" width="670" height="165" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="820" y="505" width="670" height="26" fill="#E5E7EB" stroke="#000000" stroke-width="1"/>
    <text x="832" y="523" class="box-title">Live Microservices Mesh (Hệ sinh thái Nghiệp vụ Vận hành)</text>

    <rect x="836" y="543" width="300" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="846" y="561" class="box-title">Tracking Service (:3005)</text>
    <text x="846" y="579" class="box-sub">• Lấy timeline sự kiện: Đã giao, Đang lấy, t_del</text>

    <rect x="1150" y="543" width="320" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1160" y="561" class="box-title">Order Service (:3002)</text>
    <text x="1160" y="579" class="box-sub">• Chi tiết đơn, tiền thu hộ COD, Người gửi/nhận</text>

    <rect x="836" y="605" width="300" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="846" y="623" class="box-title">Claim Service (:3007)</text>
    <text x="846" y="641" class="box-sub">• Quản lý mã hồ sơ bồi thường CLM-</text>

    <rect x="1150" y="605" width="320" height="52" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
    <text x="1160" y="623" class="box-title">Carrier &amp; Pricing Service (:3008)</text>
    <text x="1160" y="641" class="box-sub">• Bảng cước vận chuyển chuẩn IATA</text>
  </g>

  <!-- Connect Tier 3 -> Tier 4 -->
  <line x1="800" y1="690" x2="800" y2="732" stroke="#000000" stroke-width="1.5"/>
  <polygon points="796,732 800,740 804,732" fill="#000000"/>
  <text x="810" y="720" font-size="11" font-weight="bold">Context Augmented</text>

  <!-- TIER 4: RAG REPOSITORY & COGNITIVE ENGINE (y: 740) -->
  <g id="Tier_4_RAG_LLM">
    <rect x="80" y="740" width="1440" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="80" y="740" width="340" height="28" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="92" y="759" class="tier-label">TẦNG 4: RAG REPOSITORY &amp; LLM REASONING</text>

    <!-- RAG Repository Box -->
    <rect x="110" y="785" width="650" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text x="124" y="809" class="box-title">Kho Tri thức Văn bản Nghiệp vụ (RAG Knowledge Base)</text>
    <text x="124" y="831" class="box-sub">• Tài liệu Markdown có cấu trúc: 01-pricing, 02-insurance-claim, 09-negative-sop</text>
    <text x="124" y="851" class="box-sub">• Mô hình nhúng Vector: Google Gemini Embedding-001 (Không gian 768 chiều thực)</text>
    <text x="124" y="871" class="box-sub">• Giải thuật phân đoạn: Section-Aware Semantic Splitting (Stride = 210 từ, Overlap = 16%)</text>
    <text x="124" y="891" class="box-sub">• Điểm tìm kiếm lai: Score = 0.70 × CosineSimilarity + 0.35 × LexicalKeywordScore</text>

    <!-- Arrow RAG -> LLM -->
    <line x1="760" y1="845" x2="822" y2="845" stroke="#000000" stroke-width="1.5"/>
    <polygon points="822,841 830,845 822,849" fill="#000000"/>
    <text x="765" y="835" font-size="10" font-weight="bold">Grounding</text>

    <!-- LLM Cognitive Engine Box -->
    <rect x="830" y="785" width="660" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text x="844" y="809" class="box-title">Động cơ Suy luận Nhận thức (LLM Cognitive Reasoning Engine)</text>
    <text x="844" y="831" class="box-sub">• Mô hình nền tảng: Google Gemini Flash</text>
    <text x="844" y="851" class="box-sub">• Tham số khống chế ảo giác: Temperature = 0.2 (Buộc suy luận tuyệt đối trên Context)</text>
    <text x="844" y="871" class="box-sub">• Định dạng đầu ra: Cấu trúc JSON Schema nghiêm ngặt cho Rich UI Component</text>
    <text x="844" y="891" class="box-sub">• Các thẻ hỗ trợ: ORDER_TRACKING_CARD, CAROUSEL_SELECTOR, CLAIM_PROGRESS_CARD</text>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="Footer">
    <line x1="80" y1="955" x2="1520" y2="955" stroke="#000000" stroke-width="1"/>
    <text x="80" y="977" font-size="11" font-style="italic" fill="#333333">
      Ghi chú: Bản vẽ kiến trúc tổng thể phần mềm theo chuẩn UML Component &amp; Deployment Diagram. Tiêu chuẩn in ấn đơn sắc (Monochrome) cho thuyết minh Khóa luận tốt nghiệp.
    </text>
  </g>
</svg>
