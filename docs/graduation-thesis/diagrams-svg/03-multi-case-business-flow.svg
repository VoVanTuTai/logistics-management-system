  <!-- Cột 3: x=1120, w=450 (x kết thúc: 1570) -->
  <rect x="1120" y="100" width="450" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="1120" y="100" width="450" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <text x="1135" y="123" class="col-title">3. CẤU TRÚC GIAO DIỆN PHẢN HỒI (CARDS)</text>

  <!-- ==================== HÀNG 1: CA 1 TRA CỨU ĐƠN LẺ (y: 150 -> 275, tâm y: 212.5) ==================== -->
  <!-- Col 1 Box 1 -->
  <rect x="95" y="150" width="410" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="107" y="172" class="card-title">Ý định 1: Tra cứu đơn lẻ (TRACKING_EXACT)</text>
  <text x="107" y="194" class="card-sub">• Mẫu câu: "Đơn NX-884920489 đi tới đâu rồi?"</text>
  <text x="107" y="214" class="card-sub">• Regex bóc tách: /(NX|CLM)-\d{6,}/i</text>
  <text x="107" y="234" class="card-sub">• Đặc thù: Khách đã có mã đơn xác định</text>
  <text x="107" y="254" font-weight="bold" class="card-sub">→ Trích xuất mã và bỏ qua bước phân loại LLM</text>

  <!-- Mũi tên Hàng 1 (Cột 1 -> Cột 2) -->
  <line x1="505" y1="212" x2="572" y2="212" stroke="#000000" stroke-width="1.5"/>
  <polygon points="572,208 580,212 572,216" fill="#000000"/>

  <!-- Col 2 Box 1 -->
  <rect x="595" y="150" width="450" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="607" y="172" class="card-title">Xử lý Ca 1: Truy vấn Vận đơn Trực tiếp</text>
  <text x="607" y="194" class="card-sub">• Gọi nội bộ: GET :3005/orders/track/:orderCode</text>
  <text x="607" y="214" class="card-sub">• Tổng hợp timeline: Đã tạo → Đã lấy → Đang giao</text>
  <text x="607" y="234" class="card-sub">• Trích xuất thông tin tài xế và thời gian dự kiến (ETA)</text>
  <text x="607" y="254" font-weight="bold" class="card-sub">Đầu ra: Đóng gói JSON Schema ORDER_TRACKING_CARD</text>

  <!-- Mũi tên Hàng 1 (Cột 2 -> Cột 3) -->
  <line x1="1045" y1="212" x2="1112" y2="212" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1112,208 1120,212 1112,216" fill="#000000"/>

  <!-- Col 3 Box 1 -->
  <rect x="1135" y="150" width="420" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="1135" y="150" width="420" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <text x="1145" y="166" class="card-title">ORDER_TRACKING_CARD</text>
  <text x="1145" y="194" class="card-sub">• Đơn hàng: NX-884920489 [ĐANG GIAO HÀNG]</text>
  <text x="1145" y="214" class="card-sub">• Tài xế: Nguyễn Văn Ba (0909***890)</text>
  <text x="1145" y="234" class="card-sub">• Dự kiến giao: Hôm nay, trước 17:30</text>
  <text x="1145" y="258" font-size="10.5" font-weight="bold">[ Nút: Theo dõi GPS ]   [ Nút: Gọi hỗ trợ ]</text>

  <!-- ==================== HÀNG 2: CA 2 NHIỀU ĐƠN GẦN ĐÂY (y: 300 -> 425, tâm y: 362.5) ==================== -->
  <!-- Col 1 Box 2 -->
  <rect x="95" y="300" width="410" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="107" y="322" class="card-title">Ý định 2: Nhiều đơn gần đây (RECENT_ORDERS)</text>
  <text x="107" y="344" class="card-sub">• Mẫu câu: "Đơn hàng gần đây của tôi đã giao chưa?"</text>
  <text x="107" y="364" class="card-sub">• Câu hỏi mập mờ, không cung cấp mã cụ thể</text>
  <text x="107" y="384" class="card-sub">• Khách hàng thường không nhớ mã 12 ký tự</text>
  <text x="107" y="404" font-weight="bold" class="card-sub">→ Tự động kích hoạt cơ chế bóc tách danh sách</text>

  <!-- Mũi tên Hàng 2 (Cột 1 -> Cột 2) -->
  <line x1="505" y1="362" x2="572" y2="362" stroke="#000000" stroke-width="1.5"/>
  <polygon points="572,358 580,362 572,366" fill="#000000"/>

  <!-- Col 2 Box 2 -->
  <rect x="595" y="300" width="450" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="607" y="322" class="card-title">Xử lý Ca 2: Xây dựng Tập Thẻ Tương tác</text>
  <text x="607" y="344" class="card-sub">• Đọc userId từ JWT, gọi: GET :3002/orders/my-orders?limit=3</text>
  <text x="607" y="364" class="card-sub">• Trả về 3 đơn hàng gần nhất có gắn nút bấm chọn</text>
  <text x="607" y="384" class="card-sub">• Khách chạm chọn 1 đơn → Tự động chuyển tiếp vào Ca 1</text>
  <text x="607" y="404" font-weight="bold" class="card-sub">Đầu ra: Đóng gói JSON Schema ORDER_CAROUSEL_CARD</text>

  <!-- Mũi tên Hàng 2 (Cột 2 -> Cột 3) -->
  <line x1="1045" y1="362" x2="1112" y2="362" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1112,358 1120,362 1112,366" fill="#000000"/>

  <!-- Col 3 Box 2 -->
  <rect x="1135" y="300" width="420" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="1135" y="300" width="420" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <text x="1145" y="316" class="card-title">ORDER_CAROUSEL_CARD</text>
  <text x="1145" y="344" class="card-sub">• Thẻ 1: NX-884920489 (Đang giao) [Chọn tra cứu]</text>
  <text x="1145" y="364" class="card-sub">• Thẻ 2: NX-992102144 (Đang lấy) [Chọn tra cứu]</text>
  <text x="1145" y="384" class="card-sub">• Thẻ 3: NX-110294821 (Đã giao) [Chọn tra cứu]</text>
  <text x="1145" y="408" font-size="10" font-style="italic">Tương tác 1 chạm, loại bỏ thao tác gõ mã thủ công</text>

  <!-- ==================== HÀNG 3: CA 3 BỒI THƯỜNG & BBBT (y: 450 -> 575, tâm y: 512.5) ==================== -->
  <!-- Col 1 Box 3 -->
  <rect x="95" y="450" width="410" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="107" y="472" class="card-title">Ý định 3: Hàng bể vỡ, hỏng (DAMAGE_CLAIM)</text>
  <text x="107" y="494" class="card-sub">• Mẫu câu: "Hàng gốm sứ bị vỡ nát ai bồi thường?"</text>
  <text x="107" y="514" class="card-sub">• Từ khóa Thesaurus: ["vỡ, bể, nát"] → ["hư hỏng"]</text>
  <text x="107" y="534" class="card-sub">• Nhận diện khiếu nại sự cố vận chuyển</text>
  <text x="107" y="554" font-weight="bold" class="card-sub">→ Kích hoạt luồng đối chiếu quy định bồi thường</text>

  <!-- Mũi tên Hàng 3 (Cột 1 -> Cột 2) -->
  <line x1="505" y1="512" x2="572" y2="512" stroke="#000000" stroke-width="1.5"/>
  <polygon points="572,508 580,512 572,516" fill="#000000"/>

  <!-- Col 2 Box 3 -->
  <rect x="595" y="450" width="450" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="607" y="472" class="card-title">Xử lý Ca 3: Thẩm định Bồi thường &amp; BBBT</text>
  <text x="607" y="494" class="card-sub">• RAG trích xuất điều kiện: Lập Biên bản bất thường ≤ 24h</text>
  <text x="607" y="514" class="card-sub">• Nếu đủ BBBT &amp; Giá trị ≤ 2.000.000 đ: Duyệt đền bù 100%</text>
  <text x="607" y="534" class="card-sub">• Nếu quá 24h hoặc tranh chấp: Chuyển giao Human-in-the-Loop</text>
  <text x="607" y="554" font-weight="bold" class="card-sub">Đầu ra: Tự động tạo hồ sơ CLM-202609-XXXXX</text>

  <!-- Mũi tên Hàng 3 (Cột 2 -> Cột 3) -->
  <line x1="1045" y1="512" x2="1112" y2="512" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1112,508 1120,512 1112,516" fill="#000000"/>

  <!-- Col 3 Box 3 -->
  <rect x="1135" y="450" width="420" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="1135" y="450" width="420" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <text x="1145" y="466" class="card-title">CLAIM_PROGRESS_CARD</text>
  <text x="1145" y="494" class="card-sub">• Mã hồ sơ: CLM-88219 [ĐÃ DUYỆT 100%]</text>
  <text x="1145" y="514" class="card-sub">• Số tiền bồi thường: 1.250.000 VNĐ (Khai giá)</text>
  <text x="1145" y="534" class="card-sub">• Biên bản BBBT: Đã tiếp nhận có chữ ký bưu tá</text>
  <text x="1145" y="558" font-size="10.5" font-weight="bold">[ Nút: Xác nhận nhận tiền qua ví ]</text>

  <!-- ==================== HÀNG 4: CA 4 DỰ TOÁN IATA (y: 600 -> 725, tâm y: 662.5) ==================== -->
  <!-- Col 1 Box 4 -->
  <rect x="95" y="600" width="410" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="107" y="622" class="card-title">Ý định 4: Dự toán cước quy đổi (PRICING_IATA)</text>
  <text x="107" y="644" class="card-sub">• Mẫu câu: "Thùng 50x40x30 nặng 3kg cước bao nhiêu?"</text>
  <text x="107" y="664" class="card-sub">• Bóc tách 3 chiều: Dài, Rộng, Cao (cm) và Cân nặng</text>
  <text x="107" y="684" class="card-sub">• Đặc thù: Hàng hóa nhẹ nhưng chiếm thể tích lớn</text>
  <text x="107" y="704" font-weight="bold" class="card-sub">→ Áp dụng công thức quy đổi quốc tế IATA</text>

  <!-- Mũi tên Hàng 4 (Cột 1 -> Cột 2) -->
  <line x1="505" y1="662" x2="572" y2="662" stroke="#000000" stroke-width="1.5"/>
  <polygon points="572,658 580,662 572,666" fill="#000000"/>

  <!-- Col 2 Box 4 -->
  <rect x="595" y="600" width="450" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="607" y="622" class="card-title">Xử lý Ca 4: Tính toán Quy chuẩn IATA</text>
  <text x="607" y="644" class="card-sub">• Công thức đường bộ: W_dim = (D x R x C) / 5000 (kg)</text>
  <text x="607" y="664" class="card-sub">• So sánh: W_tính_cước = max(W_thực_tế, W_dim)</text>
  <text x="607" y="684" class="card-sub">• Tính phụ phí cồng kềnh và áp dụng chính sách hoàn 50% cước</text>
  <text x="607" y="704" font-weight="bold" class="card-sub">Đầu ra: Đóng gói JSON Schema IATA_PRICING_CARD</text>

  <!-- Mũi tên Hàng 4 (Cột 2 -> Cột 3) -->
  <line x1="1045" y1="662" x2="1112" y2="662" stroke="#000000" stroke-width="1.5"/>
  <polygon points="1112,658 1120,662 1112,666" fill="#000000"/>

  <!-- Col 3 Box 4 -->
  <rect x="1135" y="600" width="420" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="1135" y="600" width="420" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <text x="1145" y="616" class="card-title">IATA_PRICING_CARD</text>
  <text x="1145" y="644" class="card-sub">• Kích thước: 50x40x30 cm | Thực tế: 3.5 kg</text>
  <text x="1145" y="664" class="card-sub">• Trọng lượng quy đổi IATA (5000): 12.0 kg</text>
  <text x="1145" y="684" class="card-sub">• Cước tiêu chuẩn: 68.000 đ | Phụ phí: 24.000 đ</text>
  <text x="1145" y="708" font-size="11" font-weight="bold">Tổng cộng dự toán cước: 92.000 VNĐ</text>

  <!-- ==================== HÀNG 5: CA 5 KHÁCH VÃNG LAI (y: 750 -> 875, tâm y: 812.5) ==================== -->
  <!-- Col 1 Box 5 -->
  <rect x="95" y="750" width="410" height="125" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="107" y="772" class="card-title">Ý định 5: Khách vãng lai (GUEST_GUARD)</text>
  <text x="107" y="794" class="card-sub">• Mẫu câu: Tra cứu mã đơn trên cổng công khai</text>
  <text x="107" y="814" class="card-sub">• Yêu cầu không có Bearer Auth Token</text>
  <text x="107" y="834" class="card-sub">• Nguy cơ: Kẻ xấu dò quét SĐT và địa chỉ nhà riêng</text>
  <text x="107" y="854" font-weight="bold" class="card-sub">→ Kích hoạt bộ lọc khử định danh dữ liệu PII</text>

