<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#FFFFFF;">
  <defs>
    <marker id="arrowB3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <style>
    text { font-family: "Times New Roman", Times, "Segoe UI", -apple-system, serif; }
    .title-h1 { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .title-sub { font-size: 13px; font-style: italic; fill: #333333; text-anchor: middle; }
    .col-title { font-size: 13px; font-weight: bold; fill: #000000; text-transform: uppercase; }
    .card-title { font-size: 13px; font-weight: bold; fill: #000000; }
    .card-sub { font-size: 11px; fill: #222222; }
  </style>

  <!-- ==================== HEADER ==================== -->
  <g id="Header" transform="translate(0, 30)">
    <text x="800" y="25" class="title-h1">HÌNH 3.1: PHÂN ĐỊNH 5 CA NGHIỆP VỤ &amp; CẤU TRÚC GIAO DIỆN TƯƠNG TÁC (DECISION FLOW)</text>
    <text x="800" y="48" class="title-sub">Bóc tách ý định người dùng, ánh xạ điều phối microservices và cấu trúc dữ liệu phản hồi dạng thẻ (Rich UI Cards)</text>
    <line x1="80" y1="65" x2="1520" y2="65" stroke="#000000" stroke-width="1.5"/>
  </g>

  <!-- ==================== 3 COLUMNS (MONOCHROME) ==================== -->

  <!-- COL 1: INTENT CLASSIFICATION (x: 80, width: 420) -->
  <g id="Col_1" transform="translate(80, 110)">
    <rect x="0" y="0" width="420" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="15" y="23" class="col-title">1. TIẾP NHẬN &amp; PHÂN LOẠI Ý ĐỊNH</text>

    <!-- Intent 1 -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="390" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Ý định 1: Tra cứu đơn lẻ (TRACKING_EXACT)</text>
      <text x="12" y="42" class="card-sub">• Mẫu câu: "Đơn NX-884920489 đi tới đâu rồi?"</text>
      <text x="12" y="60" class="card-sub">• Regex bóc tách: /(NX|CLM)-\d{6,}/i</text>
      <text x="12" y="78" class="card-sub">• Cơ chế: Gọi thẳng Tracking Service, bỏ qua LLM</text>
    </g>

    <!-- Intent 2 -->
    <g transform="translate(15, 195)">
      <rect x="0" y="0" width="390" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Ý định 2: Tra cứu nhiều đơn (RECENT_ORDERS)</text>
      <text x="12" y="42" class="card-sub">• Mẫu câu: "Đơn hàng gần đây của tôi đã giao chưa?"</text>
      <text x="12" y="60" class="card-sub">• Không có mã đơn: Khách không nhớ mã dài 12 ký tự</text>
      <text x="12" y="78" class="card-sub">• Cơ chế: Đọc JWT Token, lấy 3 đơn gần nhất</text>
    </g>

    <!-- Intent 3 -->
    <g transform="translate(15, 340)">
      <rect x="0" y="0" width="390" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Ý định 3: Sự cố hàng bể vỡ (DAMAGE_CLAIM)</text>
      <text x="12" y="42" class="card-sub">• Mẫu câu: "Hàng gốm sứ bị vỡ nát ai đền tiền?"</text>
      <text x="12" y="60" class="card-sub">• Từ khóa đồng nghĩa: ["vỡ, bể, nát"] → ["hư hỏng"]</text>
      <text x="12" y="78" class="card-sub">• Cơ chế: RAG quy định BBBT trong 24 giờ</text>
    </g>

    <!-- Intent 4 -->
    <g transform="translate(15, 485)">
      <rect x="0" y="0" width="390" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Ý định 4: Dự toán cước quy đổi (PRICING_IATA)</text>
      <text x="12" y="42" class="card-sub">• Mẫu câu: "Thùng 50x40x30 nặng 3kg cước bao nhiêu?"</text>
      <text x="12" y="60" class="card-sub">• Bóc tách 3 chiều Dài, Rộng, Cao (cm)</text>
      <text x="12" y="78" class="card-sub">• Cơ chế: Áp dụng công thức IATA quốc tế</text>
    </g>

    <!-- Intent 5 -->
    <g transform="translate(15, 630)">
      <rect x="0" y="0" width="390" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Ý định 5: Khách vãng lai (GUEST_GUARD)</text>
      <text x="12" y="42" class="card-sub">• Mẫu câu: Tra cứu mã NX- khi chưa đăng nhập</text>
      <text x="12" y="60" class="card-sub">• Nguy cơ: Kẻ xấu dò quét SĐT, địa chỉ nhà riêng</text>
      <text x="12" y="78" class="card-sub">• Cơ chế: Tự động che mờ dữ liệu cá nhân PII</text>
    </g>
  </g>

  <!-- Connect Col 1 -> Col 2 -->
  <path d="M 500 500 L 540 500" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowB3)"/>

  <!-- COL 2: BUSINESS ORCHESTRATION (x: 540, width: 480) -->
  <g id="Col_2" transform="translate(540, 110)">
    <rect x="0" y="0" width="480" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="15" y="23" class="col-title">2. ĐIỀU PHỐI LOGIC NGHIỆP VỤ</text>

    <!-- Logic 1 -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="450" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Xử lý Ca 1: Truy vấn Vận đơn Thời gian thực</text>
      <text x="12" y="42" class="card-sub">• Gọi nội bộ: GET :3005/orders/track/:orderCode</text>
      <text x="12" y="60" class="card-sub">• Tổng hợp timeline: Đã tạo → Đã lấy → Đang giao</text>
      <text x="12" y="78" class="card-sub">• Lấy tên &amp; SĐT tài xế giao hàng nếu đang phát</text>
    </g>

    <!-- Logic 2 -->
    <g transform="translate(15, 195)">
      <rect x="0" y="0" width="450" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Xử lý Ca 2: Xây dựng Danh sách Thẻ Tương tác</text>
      <text x="12" y="42" class="card-sub">• Truy vấn Order Service: GET :3002/orders/my-orders</text>
      <text x="12" y="60" class="card-sub">• Tạo danh sách thẻ Carousel đính kèm nút bấm 1 chạm</text>
      <text x="12" y="78" class="card-sub">• Khách chọn 1 đơn → Chuyển tiếp tức thì vào Ca 1</text>
    </g>

    <!-- Logic 3 -->
    <g transform="translate(15, 340)">
      <rect x="0" y="0" width="450" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Xử lý Ca 3: Thẩm định Bồi thường &amp; BBBT</text>
      <text x="12" y="42" class="card-sub">• Kiểm tra thời hiệu: Δt = t_hiện_tại - t_ký_nhận ≤ 24h</text>
      <text x="12" y="60" class="card-sub">• Nếu đủ BBBT &amp; Giá trị ≤ 2 Triệu: Duyệt đền bù 100%</text>
      <text x="12" y="78" class="card-sub">• Nếu &gt; 2 Triệu hoặc tranh chấp: Chuyển giao HITL</text>
    </g>

    <!-- Logic 4 -->
    <g transform="translate(15, 485)">
      <rect x="0" y="0" width="450" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Xử lý Ca 4: Tính toán Quy đổi Thể tích IATA</text>
      <text x="12" y="42" class="card-sub">• Đường bộ: W_dim = (D x R x C) / 5000 (kg)</text>
      <text x="12" y="60" class="card-sub">• Đường bay: W_dim = (D x R x C) / 6000 (kg)</text>
      <text x="12" y="78" class="card-sub">• Trọng lượng tính cước: W = max(W_thực_tế, W_dim)</text>
    </g>

    <!-- Logic 5 -->
    <g transform="translate(15, 630)">
      <rect x="0" y="0" width="450" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <text x="12" y="22" class="card-title">Xử lý Ca 5: Khử định danh Thông tin Cá nhân</text>
      <text x="12" y="42" class="card-sub">• Số điện thoại: 0984123456 → 098***3456</text>
      <text x="12" y="60" class="card-sub">• Người nhận: Nguyễn Văn An → N*** V** A</text>
      <text x="12" y="78" class="card-sub">• Địa chỉ: Cắt bỏ số nhà, chỉ hiển thị Quận/Huyện</text>
    </g>
  </g>

  <!-- Connect Col 2 -> Col 3 -->
  <path d="M 1020 500 L 1060 500" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowB3)"/>

  <!-- COL 3: UI RESPONSE STRUCTURE (x: 1060, width: 460) -->
  <g id="Col_3" transform="translate(1060, 110)">
    <rect x="0" y="0" width="460" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
    <text x="15" y="23" class="col-title">3. CẤU TRÚC GIAO DIỆN PHẢN HỒI (CARDS)</text>

    <!-- Card 1 -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="430" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="10" y="16" class="card-title">ORDER_TRACKING_CARD</text>
      <text x="10" y="46" class="card-sub">• Đơn hàng: NX-884920489 [ĐANG GIAO]</text>
      <text x="10" y="64" class="card-sub">• Tài xế: Nguyễn Văn Ba (0909***890)</text>
      <text x="10" y="82" class="card-sub">• Dự kiến giao: Trước 17:30 hôm nay</text>
      <text x="10" y="102" font-size="10" font-weight="bold">[ Nút: Theo dõi GPS ] [ Nút: Gọi hỗ trợ ]</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(15, 195)">
      <rect x="0" y="0" width="430" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="10" y="16" class="card-title">ORDER_CAROUSEL_CARD</text>
      <text x="10" y="46" class="card-sub">• Item 1: NX-884920489 (Đang giao) [Chọn]</text>
      <text x="10" y="64" class="card-sub">• Item 2: NX-992102144 (Đang lấy) [Chọn]</text>
      <text x="10" y="82" class="card-sub">• Item 3: NX-110294821 (Đã giao) [Chọn]</text>
      <text x="10" y="102" font-size="10" font-style="italic">Tương tác 1 chạm không cần gõ chữ</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(15, 340)">
      <rect x="0" y="0" width="430" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="10" y="16" class="card-title">CLAIM_PROGRESS_CARD</text>
      <text x="10" y="46" class="card-sub">• Mã bồi thường: CLM-88219 [ĐÃ DUYỆT 100%]</text>
      <text x="10" y="64" class="card-sub">• Số tiền duyệt: 1.250.000 VNĐ (Khai giá)</text>
      <text x="10" y="82" class="card-sub">• Biên bản: Đã tiếp nhận BBBT có chữ ký bưu tá</text>
      <text x="10" y="102" font-size="10" font-weight="bold">[ Nút: Xác nhận nhận tiền qua ví ]</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(15, 485)">
      <rect x="0" y="0" width="430" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="10" y="16" class="card-title">IATA_PRICING_CARD</text>
      <text x="10" y="46" class="card-sub">• Kích thước: 50x40x30 cm | Cân nặng: 3.5 kg</text>
      <text x="10" y="64" class="card-sub">• Quy đổi IATA (5000): 12.0 kg tính cước</text>
      <text x="10" y="82" class="card-sub">• Cước chính: 68.000 đ | Phụ phí: 24.000 đ</text>
      <text x="10" y="102" font-size="10" font-weight="bold">Tổng cộng dự toán: 92.000 VNĐ</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(15, 630)">
      <rect x="0" y="0" width="430" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <rect x="0" y="0" width="430" height="24" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
      <text x="10" y="16" class="card-title">MASKED_PUBLIC_CARD</text>
      <text x="10" y="46" class="card-sub">• Trạng thái lộ trình: Hiển thị đầy đủ</text>
      <text x="10" y="64" class="card-sub">• Người nhận: N*** V** A (098***3456)</text>
      <text x="10" y="82" class="card-sub">• Địa chỉ: P. Bến Nghé, Quận 1, TP.HCM</text>
      <text x="10" y="102" font-size="10" font-weight="bold">[ Nút: Đăng nhập để xem đầy đủ ]</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g id="Footer" transform="translate(80, 930)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#000000" stroke-width="1"/>
    <text x="0" y="22" font-size="11" font-style="italic" fill="#333333">
      Ghi chú: Sơ đồ phân nhánh quyết định (Decision Flowchart). Chuẩn in ấn đen trắng cho thuyết minh luận văn tốt nghiệp kỹ sư.
    </text>
  </g>
</svg>
