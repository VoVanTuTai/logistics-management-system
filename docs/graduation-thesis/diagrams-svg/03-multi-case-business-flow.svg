  <text x="607" y="794" class="card-sub">• SĐT người nhận: 0984123456 → 098***3456</text>
  <text x="607" y="814" class="card-sub">• Tên khách hàng: Nguyễn Văn An → N*** V** A</text>
  <text x="607" y="834" class="card-sub">• Địa chỉ: Cắt bỏ số nhà ngõ ngách, chỉ giữ lại Quận/Huyện</text>
  <text x="607" y="854" font-weight="bold" class="card-sub">Đầu ra: Đóng gói JSON Schema MASKED_PUBLIC_CARD</text>

