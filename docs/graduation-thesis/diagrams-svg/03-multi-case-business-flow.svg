  <rect x="580" y="100" width="480" height="800" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="580" y="100" width="480" height="35" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
