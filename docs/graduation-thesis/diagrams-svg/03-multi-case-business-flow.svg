  <!-- ==================== HEADER ==================== -->
  <g id="Header">
    <text x="825" y="45" class="doc-title">HÌNH 3.1: MA TRẬN ĐIỀU PHỐI 5 CA NGHIỆP VỤ &amp; CẤU TRÚC PHẢN HỒI GIAO DIỆN (RICH UI)</text>
    <text x="825" y="65" class="doc-sub">Liên kết 1-1 theo 5 hàng ngang song song: Phân loại Ý định → Logic Điều phối → Thẻ phản hồi tương tác</text>
    <line x1="80" y1="80" x2="1570" y2="80" stroke="#000000" stroke-width="1.2"/>
  </g>

