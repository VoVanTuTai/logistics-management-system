  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: REPORTING-SERVICE</text>
  <rect x="684" y="9" width="192" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="780.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">ANALYTICS &amp; BI WAREHOUSE</text>
  <text x="18" y="68" class="panel-sec-title">▶ KHO DỮ LIỆU PHÂN TÍCH &amp; BÁO CÁO OLAP</text>
  <circle cx="25" cy="84" r="2" fill="#000000"/>
  <text x="36" y="88" class="panel-body">Báo cáo đa chiều: Tổng hợp KPI sản lượng bưu cục, năng suất tài xế, tỷ lệ giao</text>
  <text x="36" y="106" class="panel-body">thành công và tỷ lệ sự cố theo ngày (KpiDaily) và theo tháng (KpiMonthly).</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Tiến trình tính toán định kỳ (AggregationJob): Tự động kích hoạt lúc 00:05 mỗi</text>
  <text x="36" y="144" class="panel-body">ngày để quét gom dữ liệu phân tích mà không gây tải lên cơ sở dữ liệu OLTP của các</text>
  <text x="36" y="162" class="panel-body">service vận hành.</text>
  <text x="18" y="190" class="panel-sec-title">▶ CHIẾU BÁO CÁO VẬN ĐƠN (STATUS PROJECTION)</text>
  <circle cx="25" cy="206" r="2" fill="#000000"/>
  <text x="36" y="210" class="panel-body">Bảng ShipmentStatusProjection gom nhóm đa chiều (courierCode, hubCode, zoneCode)</text>
  <text x="36" y="228" class="panel-body">giúp lãnh đạo bưu chính lọc báo cáo tức thời theo từng đơn vị.</text>
  <rect x="14" y="732" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
