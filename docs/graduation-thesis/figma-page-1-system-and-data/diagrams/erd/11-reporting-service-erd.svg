    <!-- KpiDaily (N) -> KpiMonthly (1) Direct Cross -->
    <path d="M 520 140 L 680 140" stroke="#000000" stroke-width="1.8" fill="none" marker-start="url(#crow-many)" marker-end="url(#crow-one)"/>
    <!-- AggregationJob (1) -> KpiDaily (N) via Center Highway Lane 1 -->
    <path d="M 520 464 L 560 464 L 560 220 L 520 220" stroke="#000000" stroke-width="1.8" fill="none" marker-start="url(#crow-one)" marker-end="url(#crow-many)"/>
    
<g transform="translate(1200, 20)">
  <rect width="700" height="1020" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="700" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: REPORTING-SERVICE</text>
  <rect x="515" y="9" width="171" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="600.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">ANALYTICS &amp; BI ENGINE</text>
  <text x="18" y="70" class="panel-sec-title">▶ BẢN CHIẾU OLAP &amp; PHÂN TÍCH HIỆU SUẤT VẬN HÀNH</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Bản chiếu phân tích OLAP: Tách biệt hoàn toàn cơ sở dữ liệu phân tích báo</text>
  <text x="36" y="110" class="panel-body">cáo với CSDL giao dịch (OLTP), ngăn chặn nghẽn hệ thống.</text>
  <circle cx="25" cy="128" r="2" fill="#000000"/>
  <text x="36" y="132" class="panel-body">Tổng hợp chỉ số KPI tự động: Cronjob ban đêm tự động tính toán tỷ lệ giao</text>
  <text x="36" y="150" class="panel-body">đúng hạn (On-Time Delivery %), năng suất xử lý bưu cục và doanh thu theo</text>
  <text x="36" y="168" class="panel-body">bưu tá.</text>
  <circle cx="25" cy="186" r="2" fill="#000000"/>
  <text x="36" y="190" class="panel-body">Cảnh báo vi phạm cam kết SLA: Cờ isSlaBreached tự động đánh dấu các bưu</text>
  <text x="36" y="208" class="panel-body">kiện bị giam giữ quá thời gian quy định tại kho.</text>
  <text x="18" y="240" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="258" r="2" fill="#000000"/>
  <text x="36" y="262" class="panel-body">Tiêu thụ sự kiện từ RabbitMQ: Lắng nghe toàn bộ sự kiện từ shipment, scan,</text>
  <text x="36" y="280" class="panel-body">delivery và payment để cập nhật các bảng tổng hợp.</text>
  <circle cx="25" cy="298" r="2" fill="#000000"/>
  <text x="36" y="302" class="panel-body">hubCode / merchantId: Cho phép lọc báo cáo linh hoạt theo từng chi nhánh</text>
  <text x="36" y="320" class="panel-body">hoặc từng đối tác thương mại điện tử.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: PostgreSQL 16 | Workload: OLAP &amp; Batch Aggregation | Indexing: BRIN on reportDate</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 1230)">
