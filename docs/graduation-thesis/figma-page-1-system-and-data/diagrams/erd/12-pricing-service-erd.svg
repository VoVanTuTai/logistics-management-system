  <text x="14" y="23" class="tbl-header">DimensionalRule</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">DIMENSIONAL_RULES (CÔNG THỨC Q...</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) QUY CHUẨN THỂ TÍ</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">formula</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) (DÀI * RỘNG * CA</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">applyThresholdKg</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">FLOAT NGƯỠNG ÁP DỤNG QUY ĐỔI</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
