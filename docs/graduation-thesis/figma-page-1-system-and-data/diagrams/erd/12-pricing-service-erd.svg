<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 750" width="100%" height="100%" style="background:#F8FAFC;">

  <defs>
    <filter id="card-shadow" x="-2%" y="-1.5%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="table-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#475569" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#475569" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#475569" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#0284C7"/>
    </marker>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 12.5px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.5px; text-transform: uppercase; }
    .doc-title { font-size: 24px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13.5px; font-weight: 400; fill: #CBD5E1; }
    .meta-tag { font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
    
    .svc-title { font-size: 18px; font-weight: 800; fill: #0F172A; }
    .svc-sub { font-size: 12.5px; font-weight: 500; fill: #64748B; }
    .svc-port { font-size: 12px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; fill: #0284C7; }

    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #CBD5E1; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #0F172A; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #1D4ED8; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #6D28D9; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #334155; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #64748B; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #B91C1C; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #1D4ED8; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #6D28D9; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #0F172A; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #1E293B; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #334155; }
    .panel-bold { font-weight: 700; fill: #0F172A; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #0284C7; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 30)">
    <rect width="1920" height="105" rx="12" fill="url(#header-grad)" filter="url(#card-shadow)"/>
    <text x="30" y="32" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE | DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="30" y="65" class="doc-title">12. PRICING-SERVICE (CÔNG CỤ TÍNH CƯỚC QUY ĐỔI HÀNG KHÔNG IATA)</text>
    <text x="30" y="90" class="doc-subtitle">Công cụ tính cước quy đổi IATA 1:5000, tính cước nấc lũy tiến &amp; phí bảo hiểm khai giá</text>
    
    <!-- Badges -->
    <rect x="1560" y="36" width="160" height="34" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="1640" y="58" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">PORT :3012</text>

    <rect x="1740" y="36" width="180" height="34" rx="6" fill="#1E293B" stroke="#D97706" stroke-width="1.2"/>
    <text x="1830" y="58" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">DB: in-memory</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 155)">
    <rect width="1920" height="500" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)"/>

<g transform="translate(20, 20)">
  <rect width="470" height="236" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#78350F"/>
  <text x="14" y="23" class="tbl-header">PricingQuote (Entity)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">CÔNG THỨC IATA</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="50" r="2" fill="#94A3B8"/>
  <text x="30" y="54" class="tbl-field-normal">originZoneCode</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(32) VÙNG GỬI</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="74" r="2" fill="#94A3B8"/>
  <text x="30" y="78" class="tbl-field-normal">destZoneCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) VÙNG NHẬN</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">actualWeightKg</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">FLOAT CÂN NẶNG THỰC TẾ</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">length / width / height</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">FLOAT (cm) KÍCH THƯỚC 3 CHIỀU</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="146" r="2" fill="#94A3B8"/>
  <text x="30" y="150" class="tbl-field-normal">volumetricWeightKg</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">FLOAT (L*W*H)/5000 IATA</text>
  <rect x="1" y="156" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="170" r="2" fill="#94A3B8"/>
  <text x="30" y="174" class="tbl-field-normal">chargeableWeightKg</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">FLOAT MAX(Actual, Volumetric)</text>
  <rect x="1" y="180" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="194" r="2" fill="#94A3B8"/>
  <text x="30" y="198" class="tbl-field-normal">baseFee / vatAmount</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">DECIMAL CƯỚC CƠ BẢN + VAT 8%</text>
  <rect x="1" y="204" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="218" r="2" fill="#94A3B8"/>
  <text x="30" y="222" class="tbl-field-normal">insuranceFee</text>
  <text x="458" y="222" class="tbl-type" text-anchor="end">DECIMAL 0.5% GIÁ TRỊ KHAI GIÁ</text>
</g>
<g transform="translate(510, 20)">
  <rect width="470" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#78350F"/>
  <text x="14" y="23" class="tbl-header">TieredRateMatrix</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">BẢNG CƯỚC NẤC LŨY TIẾN</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="50" r="2" fill="#94A3B8"/>
  <text x="30" y="54" class="tbl-field-normal">routeType</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">ENUM INTRA_PROVINCE, INTER_ZONE...</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="74" r="2" fill="#94A3B8"/>
  <text x="30" y="78" class="tbl-field-normal">weightStepKg</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">FLOAT NẤC CÂN NẶNG ĐẦU TIÊN (0.5kg)</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">firstStepPrice</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">DECIMAL GIÁ NẤC ĐẦU (VNĐ)</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">additionalKgPrice</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">DECIMAL GIÁ MỖI 0.5KG TIẾP THEO</text>
</g>

<g transform="translate(1010, 20)">
  <rect width="890" height="460" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#table-shadow)"/>
  <rect x="0" y="0" width="890" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="14" y="13" width="7" height="18" rx="2" fill="#D97706"/>
  <text x="28" y="27" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PRICING-SERVICE</text>
  <rect x="710" y="10" width="166" height="24" rx="5" fill="#D9770618" stroke="#D97706" stroke-width="1"/>
  <text x="793" y="26" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">PRICING ENGINE</text>
  <text x="18" y="68" class="panel-sec-title">▶ CÔNG THỨC TÍNH CƯỚC BƯU CHÍNH QUỐC TẾ (IATA AIRFREIGHT STANDARD)</text>
  <circle cx="25" cy="84" r="2.2" fill="#D97706"/>
  <text x="36" y="88" class="panel-body"><tspan class="panel-bold">Quy đổi thể tích:</tspan> Áp dụng chuẩn IATA: <tspan class="panel-code">Khối lượng quy đổi = (Dài × Rộng × Cao) / 5000</tspan>.</text>
  <circle cx="25" cy="104" r="2.2" fill="#D97706"/>
  <text x="36" y="108" class="panel-body"><tspan class="panel-bold">Khối lượng tính cước:</tspan> Lấy giá trị lớn nhất: <tspan class="panel-code">Chargeable Weight = MAX(Cân nặng thực tế, Cân nặng quy đổi)</tspan>.</text>
  <circle cx="25" cy="124" r="2.2" fill="#D97706"/>
  <text x="36" y="128" class="panel-body"><tspan class="panel-bold">Bảo hiểm &amp; Phụ phí:</tspan> Tự động tính phí bảo hiểm 0.5% đối với hàng có khai giá trị cao trên 1.000.000 VNĐ.</text>
  <text x="18" y="156" class="panel-sec-title">▶ KIẾN TRÚC KHÔNG LƯU TRẠNG THÁI (STATELESS CALCULATION ENGINE)</text>
  <circle cx="25" cy="172" r="2.2" fill="#D97706"/>
  <text x="36" y="176" class="panel-body"><tspan class="panel-bold">Hiệu năng cực đại:</tspan> Xử lý tính cước trực tiếp trong bộ nhớ (In-memory) trong thời gian dưới 5ms, phục vụ tra cứu cước tức thì trên Web Shop và Chatbot.</text>
  <rect x="14" y="420" width="862" height="28" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="445.0" y="438" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Engine: In-Memory Stateless | Formula: (L*W*H)/5000 IATA Standard | Latency: Sub-5ms Execution</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 675)">
    <rect width="1920" height="55" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="25" cy="28" r="6" fill="#38BDF8"/>
    <text x="42" y="32" font-size="12" font-weight="700" fill="#38BDF8">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="32" font-size="11.5" fill="#E2E8F0">Cung cấp API tính cước tức thời cho shipment-service khi tạo đơn và chatbot-service khi tư vấn giá</text>
    <text x="1900" y="32" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
