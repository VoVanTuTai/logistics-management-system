</g>

    <path d="M 494 60 L 514 60" stroke="#000000" stroke-width="1.8" fill="none" marker-start="url(#crow-one)" marker-end="url(#crow-one)"/>
    <path d="M 259 184 L 259 204" stroke="#000000" stroke-width="1.8" fill="none" marker-start="url(#crow-one)" marker-end="url(#crow-one)"/>
    
<g transform="translate(1010, 20)">
  <rect width="890" height="640" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PRICING-SERVICE</text>
  <rect x="677" y="9" width="199" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="776.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">IATA STANDARD CALCULATION</text>
  <text x="18" y="68" class="panel-sec-title">▶ ĐỘNG CƠ TÍNH CƯỚC TỐC ĐỘ CAO (IN-MEMORY PRICING ENGINE)</text>
  <circle cx="25" cy="84" r="2" fill="#000000"/>
  <text x="36" y="88" class="panel-body">Kiến trúc không trạng thái (Stateless Engine): pricing-service tải ma trận bảng</text>
  <text x="36" y="106" class="panel-body">cước và quy tắc phụ phí lên bộ nhớ RAM để tính toán siêu tốc (&lt; 5ms).</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Quy chuẩn cước hàng không IATA: Tự động so sánh giữa trọng lượng thực tế (Gross</text>
  <text x="36" y="144" class="panel-body">Weight) và trọng lượng quy đổi thể tích (Volumetric Weight = L x W x H / 5000),</text>
  <text x="36" y="162" class="panel-body">lấy giá trị lớn hơn để tính cước.</text>
  <circle cx="25" cy="178" r="2" fill="#000000"/>
  <text x="36" y="182" class="panel-body">Dịch vụ giá trị gia tăng (VAS): Tự động tính phí bảo hiểm bưu gửi và phí thu hộ</text>
  <text x="36" y="200" class="panel-body">COD theo tỷ lệ lũy tiến.</text>
  <rect x="14" y="602" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="619" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: In-Memory Rule Engine (TypeScript) | Standards: IATA Cargo Dimensional Rules | Latency: &lt; 5ms</text>
</g>
  </g>

