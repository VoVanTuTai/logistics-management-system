<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 750" width="100%" height="100%" style="background:#FFFFFF;">

  <defs>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#000000" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#000000" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#000000" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Technical Blueprint Frame -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1970" height="720" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="1960" height="710" fill="none" stroke="#000000" stroke-width="0.8"/>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 11.5px; font-weight: 700; fill: #000000; letter-spacing: 1.2px; text-transform: uppercase; }
    .doc-title { font-size: 23px; font-weight: 800; fill: #000000; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13px; font-weight: 400; fill: #374151; }
    
    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #000000; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #4B5563; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #000000; font-style: italic; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #1F2937; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #4B5563; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #FFFFFF; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #000000; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #000000; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #000000; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #000000; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #1F2937; }
    .panel-bold { font-weight: 700; fill: #000000; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #000000; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 32)">
    <rect width="1920" height="100" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="1920" y2="32" stroke="#E5E7EB" stroke-width="1"/>
    <text x="24" y="22" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE • DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="24" y="58" class="doc-title">12. PRICING-SERVICE (CÔNG CỤ TÍNH CƯỚC QUY ĐỔI HÀNG KHÔNG IATA)</text>
    <text x="24" y="82" class="doc-subtitle">Công cụ tính cước quy đổi IATA 1:5000, tính cước nấc lũy tiến &amp; phí bảo hiểm khai giá</text>
    
    <!-- Badges -->
    <rect x="1570" y="32" width="160" height="36" rx="4" fill="#F3F4F6" stroke="#000000" stroke-width="1.2"/>
    <text x="1650" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">PORT :3012</text>

    <rect x="1750" y="32" width="170" height="36" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text x="1835" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">DB: in-memory</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 150)">
    <rect width="1920" height="510" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>

<g transform="translate(20, 20)">
  <rect width="470" height="236" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">PricingQuote (Entity)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">CÔNG THỨC IATA</text>
  <circle cx="18" cy="50" r="1.8" fill="#000000"/>
  <text x="30" y="54" class="tbl-field-normal">originZoneCode</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(32) VÙNG GỬI</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">destZoneCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) VÙNG NHẬN</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">actualWeightKg</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">FLOAT CÂN NẶNG THỰC TẾ</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">length / width / height</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">FLOAT (cm) KÍCH THƯỚC 3 CHIỀU</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">volumetricWeightKg</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">FLOAT (L*W*H)/5000 IATA</text>
  <circle cx="18" cy="170" r="1.8" fill="#000000"/>
  <text x="30" y="174" class="tbl-field-normal">chargeableWeightKg</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">FLOAT MAX(Actual, Volumetric)</text>
  <circle cx="18" cy="194" r="1.8" fill="#000000"/>
  <text x="30" y="198" class="tbl-field-normal">baseFee / vatAmount</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">DECIMAL CƯỚC CƠ BẢN + VAT 8%</text>
  <circle cx="18" cy="218" r="1.8" fill="#000000"/>
  <text x="30" y="222" class="tbl-field-normal">insuranceFee</text>
  <text x="458" y="222" class="tbl-type" text-anchor="end">DECIMAL 0.5% GIÁ TRỊ KHAI GIÁ</text>
</g>
<g transform="translate(510, 20)">
  <rect width="470" height="140" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">TieredRateMatrix</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">BẢNG CƯỚC NẤC LŨY TIẾN</text>
  <circle cx="18" cy="50" r="1.8" fill="#000000"/>
  <text x="30" y="54" class="tbl-field-normal">routeType</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">ENUM INTRA_PROVINCE, INTER_ZONE...</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">weightStepKg</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">FLOAT NẤC CÂN NẶNG ĐẦU TIÊN (0.5kg)</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">firstStepPrice</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">DECIMAL GIÁ NẤC ĐẦU (VNĐ)</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">additionalKgPrice</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">DECIMAL GIÁ MỖI 0.5KG TIẾP THEO</text>
</g>

<g transform="translate(1010, 20)">
  <rect width="890" height="470" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PRICING-SERVICE</text>
  <rect x="710" y="9" width="166" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="793" y="25" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">PRICING ENGINE</text>
  <text x="18" y="66" class="panel-sec-title">▶ CÔNG THỨC TÍNH CƯỚC BƯU CHÍNH QUỐC TẾ (IATA AIRFREIGHT STANDARD)</text>
  <circle cx="25" cy="82" r="2" fill="#000000"/>
  <text x="36" y="86" class="panel-body"><tspan class="panel-bold">Quy đổi thể tích:</tspan> Áp dụng chuẩn IATA: <tspan class="panel-code">Khối lượng quy đổi = (Dài × Rộng × Cao) / 5000</tspan>.</text>
  <circle cx="25" cy="102" r="2" fill="#000000"/>
  <text x="36" y="106" class="panel-body"><tspan class="panel-bold">Khối lượng tính cước:</tspan> Lấy giá trị lớn nhất: <tspan class="panel-code">Chargeable Weight = MAX(Cân nặng thực tế, Cân nặng quy đổi)</tspan>.</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body"><tspan class="panel-bold">Bảo hiểm &amp; Phụ phí:</tspan> Tự động tính phí bảo hiểm 0.5% đối với hàng có khai giá trị cao trên 1.000.000 VNĐ.</text>
  <text x="18" y="154" class="panel-sec-title">▶ KIẾN TRÚC KHÔNG LƯU TRẠNG THÁI (STATELESS CALCULATION ENGINE)</text>
  <circle cx="25" cy="170" r="2" fill="#000000"/>
  <text x="36" y="174" class="panel-body"><tspan class="panel-bold">Hiệu năng cực đại:</tspan> Xử lý tính cước trực tiếp trong bộ nhớ (In-memory) trong thời gian dưới 5ms, phục vụ tra cứu cước tức thì trên Web Shop và Chatbot.</text>
  <rect x="14" y="432" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="449" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: In-Memory Stateless | Formula: (L*W*H)/5000 IATA Standard | Latency: Sub-5ms Execution</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 680)">
    <rect width="1920" height="50" rx="6" fill="#F9FAFB" stroke="#000000" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="5" fill="#000000"/>
    <text x="42" y="29" font-size="12" font-weight="700" fill="#000000">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="29" font-size="11.5" fill="#1F2937">Cung cấp API tính cước tức thời cho shipment-service khi tạo đơn và chatbot-service khi tư vấn giá</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
