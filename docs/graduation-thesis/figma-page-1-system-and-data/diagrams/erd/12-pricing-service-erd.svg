  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PRICING-SERVICE</text>
  <rect x="487" y="9" width="199" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="586.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">IATA STANDARD CALCULATION</text>
  <text x="18" y="70" class="panel-sec-title">▶ ĐỘNG CƠ TÍNH CƯỚC TỐC ĐỘ CAO (IN-MEMORY PRICING ENGINE)</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Kiến trúc không trạng thái (Stateless Engine): pricing-service tải ma trận</text>
  <text x="36" y="110" class="panel-body">bảng cước và quy tắc phụ phí lên bộ nhớ RAM để tính toán siêu tốc (&lt; 5ms).</text>
  <circle cx="25" cy="128" r="2" fill="#000000"/>
  <text x="36" y="132" class="panel-body">Quy chuẩn cước hàng không IATA: Tự động so sánh giữa trọng lượng thực tế</text>
  <text x="36" y="150" class="panel-body">(Gross Weight) và trọng lượng quy đổi thể tích (Volumetric Weight = L x W</text>
  <text x="36" y="168" class="panel-body">x H / 5000), lấy giá trị lớn hơn để tính cước.</text>
  <circle cx="25" cy="186" r="2" fill="#000000"/>
  <text x="36" y="190" class="panel-body">Dịch vụ giá trị gia tăng (VAS): Tự động tính phí bảo hiểm bưu gửi và phí</text>
  <text x="36" y="208" class="panel-body">thu hộ COD theo tỷ lệ lũy tiến.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: In-Memory Rule Engine (TypeScript) | Standards: IATA Cargo Dimensional Rules | Latency: &lt; 5ms</text>
