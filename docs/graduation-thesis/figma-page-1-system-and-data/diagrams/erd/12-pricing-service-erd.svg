  <text x="14" y="23" class="tbl-header">VasCatalog</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">VAS_CATALOG (DỊCH VỤ GIÁ TRỊ G...</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) MÃ DỊCH VỤ CỘNG</text>
