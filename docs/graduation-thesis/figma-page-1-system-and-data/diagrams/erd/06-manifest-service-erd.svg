    <text x="310" y="29" font-size="11.5" fill="#1F2937">Phát hành sự kiện MANIFEST.SEALED, MANIFEST.RECEIVED tới scan-service &amp; tracking-service</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
