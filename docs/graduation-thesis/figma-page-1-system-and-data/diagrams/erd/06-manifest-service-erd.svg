<g transform="translate(1200, 20)">
  <rect width="700" height="1020" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="700" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: MANIFEST-SERVICE</text>
  <rect x="516" y="9" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="601.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">LINE-HAUL LOGISTICS</text>
  <text x="18" y="70" class="panel-sec-title">▶ NGHIỆP VỤ ĐÓNG BAO &amp; NIÊM PHONG TRUNG CHUYỂN</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Gom tải trung chuyển đường trục: Đóng hàng trăm đơn hàng lẻ vào một bảng</text>
  <text x="36" y="110" class="panel-body">kê lớn (Manifest), gắn với biển số xe tải và tài xế liên tỉnh.</text>
  <circle cx="25" cy="128" r="2" fill="#000000"/>
  <text x="36" y="132" class="panel-body">Kiểm soát chì niêm phong (SealRecord): Bắt buộc chụp ảnh và ghi nhận số</text>
  <text x="36" y="150" class="panel-body">kẹp chì vật lý trước khi cho xe lăn bánh rời kho xuất.</text>
  <circle cx="25" cy="168" r="2" fill="#000000"/>
  <text x="36" y="172" class="panel-body">Biên bản bàn giao đích (ReceiveRecord): Kho đích đối soát số seal, cắt chì</text>
  <text x="36" y="190" class="panel-body">và tự động phát hiện số bưu kiện thừa/thiếu (Discrepancy Check).</text>
  <text x="18" y="222" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="240" r="2" fill="#000000"/>
  <text x="36" y="244" class="panel-body">originHubCode / destinationHubCode: Điều phối luồng xe tải trung chuyển</text>
  <text x="36" y="262" class="panel-body">giữa các bưu cục trên mạng lưới.</text>
  <circle cx="25" cy="280" r="2" fill="#000000"/>
  <text x="36" y="284" class="panel-body">shipmentCode: Tự động cập nhật trạng thái IN_TRANSIT hàng loạt cho toàn bộ</text>
  <text x="36" y="302" class="panel-body">bưu kiện trong bao.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: PostgreSQL 16 | Integrity: Digital Seal Verification | Aggregation: High-throughput Batching</text>
</g>
  </g>

