<g transform="translate(1010, 20)">
  <rect width="890" height="770" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: MANIFEST-SERVICE</text>
  <rect x="706" y="9" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="791.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">LINEHAUL INTEGRITY</text>
  <text x="18" y="68" class="panel-sec-title">▶ NGHIỆP VỤ ĐÓNG BAO &amp; NIÊM PHONG TRUNG CHUYỂN</text>
  <circle cx="25" cy="84" r="2" fill="#000000"/>
  <text x="36" y="88" class="panel-body">Đóng bảng kê (Manifest): Đóng gói hàng trăm bưu kiện lẻ vào một tải hàng/thùng xe</text>
  <text x="36" y="106" class="panel-body">tải lớn trung chuyển giữa 2 bưu cục.</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Kẹp chì chống gian lận (SealRecord): Bắt buộc kiểm soát mã kẹp chì vật lý</text>
  <text x="36" y="144" class="panel-body">(sealCode), chụp ảnh trước khi xe lăn bánh rời kho nguồn.</text>
  <circle cx="25" cy="160" r="2" fill="#000000"/>
  <text x="36" y="164" class="panel-body">Đối soát bưu cục đích (ReceiveRecord): Khi xe đến bưu cục nhận, quét lại mã seal.</text>
  <text x="36" y="182" class="panel-body">Nếu seal bị đứt hoặc sai số hiệu, hệ thống tự động cảnh báo nghi vấn tráo hàng.</text>
  <text x="18" y="210" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="226" r="2" fill="#000000"/>
  <text x="36" y="230" class="panel-body">originHubCode / destinationHubCode: Ánh xạ tới bảng Hub trong masterdata-service.</text>
  <circle cx="25" cy="246" r="2" fill="#000000"/>
  <text x="36" y="250" class="panel-body">shipmentCode: Danh sách vận đơn trong ManifestItem tự động được đồng bộ trạng thái</text>
  <text x="36" y="268" class="panel-body">sang IN_TRANSIT hàng loạt.</text>
  <text x="18" y="296" class="panel-sec-title">▶ HỖ TRỢ ĐIỀU TRA ĐIỂM GÃY</text>
  <circle cx="25" cy="312" r="2" fill="#000000"/>
  <text x="36" y="316" class="panel-body">Các mốc thời gian sealedAt và receivedAt là bằng chứng pháp lý quan trọng được</text>
  <text x="36" y="334" class="panel-body">shipment-service trích xuất trong các hồ sơ InvestigationCase.</text>
  <rect x="14" y="732" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="749" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: manifest_db (PostgreSQL 16) | Pattern: Two-Phase Handover | Security: Physical Seal Verification</text>
</g>
  </g>

