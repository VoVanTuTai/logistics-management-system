<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 880" width="100%" height="100%" style="background:#FFFFFF;">

  <defs>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#000000" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#000000" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#000000" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Technical Blueprint Frame -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1970" height="850" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="1960" height="840" fill="none" stroke="#000000" stroke-width="0.8"/>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 11.5px; font-weight: 700; fill: #000000; letter-spacing: 1.2px; text-transform: uppercase; }
    .doc-title { font-size: 23px; font-weight: 800; fill: #000000; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13px; font-weight: 400; fill: #374151; }
    
    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #000000; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #4B5563; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #000000; font-style: italic; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #1F2937; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #4B5563; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #FFFFFF; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #000000; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #000000; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #000000; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #000000; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #1F2937; }
    .panel-bold { font-weight: 700; fill: #000000; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #000000; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 32)">
    <rect width="1920" height="100" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="1920" y2="32" stroke="#E5E7EB" stroke-width="1"/>
    <text x="24" y="22" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE • DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="24" y="58" class="doc-title">5. DISPATCH-SERVICE (DỊCH VỤ ĐIỀU PHỐI NHIỆM VỤ COURIER)</text>
    <text x="24" y="82" class="doc-subtitle">Phân bổ và điều phối nhiệm vụ gom/phát/hoàn cho tài xế theo khu vực địa bàn</text>
    
    <!-- Badges -->
    <rect x="1570" y="32" width="160" height="36" rx="4" fill="#F3F4F6" stroke="#000000" stroke-width="1.2"/>
    <text x="1650" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">PORT :3004</text>

    <rect x="1750" y="32" width="170" height="36" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text x="1835" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">DB: dispatch_db</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 150)">
    <rect width="1920" height="640" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>

<g transform="translate(20, 20)">
  <rect width="470" height="236" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">Task (tasks)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">NHIỆM VỤ COURIER</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">taskCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE (TSK-2026-001)</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">taskType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">ENUM PICKUP, DELIVERY, RETURN</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">status</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">ENUM CREATED, ASSIGNED, COMPLETED</text>
  <rect x="8" y="139" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="150" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="150" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">VARCHAR(32) FK-dist shipment.code</text>
  <rect x="8" y="163" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="174" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="174" class="tbl-field-dist">pickupRequestId</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">VARCHAR(32) FK-dist pickup_requests</text>
  <circle cx="18" cy="194" r="1.8" fill="#000000"/>
  <text x="30" y="198" class="tbl-field-normal">note</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">TEXT GHI CHÚ GIAO HÀNG</text>
  <circle cx="18" cy="218" r="1.8" fill="#000000"/>
  <text x="30" y="222" class="tbl-field-normal">createdAt</text>
  <text x="458" y="222" class="tbl-type" text-anchor="end">TIMESTAMP DEFAULT NOW()</text>
</g>
<g transform="translate(510, 20)">
  <rect width="470" height="164" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">TaskAssignment</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">LỊCH SỬ GÁN TÀI XẾ</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="10" y="67" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="20" y="78" class="badge-fk" text-anchor="middle">FK</text>
  <text x="42" y="78" class="tbl-field-fk">taskId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">CUID FK -&gt; tasks.id</text>
  <rect x="8" y="91" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="102" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="102" class="tbl-field-dist">courierId</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) FK-dist auth.users</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">assignedAt</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">TIMESTAMP THỜI ĐIỂM GÁN</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">unassignedAt</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">TIMESTAMP THỜI ĐIỂM ĐỔI TÀI XẾ</text>
</g>
<g transform="translate(20, 280)">
  <rect width="470" height="188" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">OpsAuditLog (Dispatch)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">ops_audit_logs</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">actorId / actorUsername</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) ĐIỀU PHỐI VIÊN</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">action / targetType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) ASSIGN_TASK, REASSIGN</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">targetId / ipAddress</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(64) NULLABLE</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">before / after</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB AUDIT DIFF</text>
  <circle cx="18" cy="170" r="1.8" fill="#000000"/>
  <text x="30" y="174" class="tbl-field-normal">createdAt</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">TIMESTAMP INDEX</text>
</g>
<g transform="translate(510, 220)">
  <rect width="470" height="164" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">OutboxEvent (Dispatch)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">outbox_events</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">eventId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) UNIQUE</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">eventType / routingKey</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) TASK.ASSIGNED, ...</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">aggregateType / aggregateId</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(64) Task / id</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">payload</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB TASK PAYLOAD</text>
</g>

    <path d="M 490 60 L 510 60" stroke="#000000" stroke-width="1.8" fill="none" marker-start="url(#crow-one)" marker-end="url(#crow-many)"/>
    
<g transform="translate(1010, 20)">
  <rect width="890" height="600" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: DISPATCH-SERVICE</text>
  <rect x="710" y="9" width="166" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="793" y="25" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">TASK DISPATCHING</text>
  <text x="18" y="66" class="panel-sec-title">▶ VAI TRÒ ĐIỀU PHỐI NHIỆM VỤ TỰ ĐỘNG (DISPATCH MANAGEMENT)</text>
  <circle cx="25" cy="82" r="2" fill="#000000"/>
  <text x="36" y="86" class="panel-body"><tspan class="panel-bold">Phân công 3 loại nhiệm vụ:</tspan> Quản lý tập trung: <tspan class="panel-code">PICKUP</tspan> (Gom hàng shop), <tspan class="panel-code">DELIVERY</tspan> (Phát hàng cho khách), <tspan class="panel-code">RETURN</tspan> (Chuyển hoàn).</text>
  <circle cx="25" cy="102" r="2" fill="#000000"/>
  <text x="36" y="106" class="panel-body"><tspan class="panel-bold">Lịch sử điều chuyển (Re-assignment):</tspan> Bảng <tspan class="panel-code">task_assignments</tspan> cho phép đổi tài xế nếu Courier bị sự cố xe cộ mà vẫn bảo toàn lịch sử bàn giao.</text>
  <text x="18" y="134" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="150" r="2" fill="#000000"/>
  <text x="36" y="154" class="panel-body"><tspan class="panel-code">courierId</tspan>: Ánh xạ tài xế di động nhận việc trên mobile app.</text>
  <circle cx="25" cy="170" r="2" fill="#000000"/>
  <text x="36" y="174" class="panel-body"><tspan class="panel-code">shipmentCode / pickupRequestId</tspan>: Khóa liên kết đối tượng cần giao hoặc cần lấy.</text>
  <rect x="14" y="562" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="579" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: dispatch_db (PostgreSQL 16) | Task Types: PICKUP, DELIVERY, RETURN | Audit: Full Ops Log</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 810)">
    <rect width="1920" height="50" rx="6" fill="#F9FAFB" stroke="#000000" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="5" fill="#000000"/>
    <text x="42" y="29" font-size="12" font-weight="700" fill="#000000">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="29" font-size="11.5" fill="#1F2937">Bắn sự kiện TASK.ASSIGNED thông báo đẩy (Push Notification) đến Courier Mobile App</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
