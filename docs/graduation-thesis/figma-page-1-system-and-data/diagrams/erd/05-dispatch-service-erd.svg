<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 880" width="100%" height="100%" style="background:#F8FAFC;">

  <defs>
    <filter id="card-shadow" x="-2%" y="-1.5%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="table-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#475569" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#475569" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#475569" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#0284C7"/>
    </marker>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 12.5px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.5px; text-transform: uppercase; }
    .doc-title { font-size: 24px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13.5px; font-weight: 400; fill: #CBD5E1; }
    .meta-tag { font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
    
    .svc-title { font-size: 18px; font-weight: 800; fill: #0F172A; }
    .svc-sub { font-size: 12.5px; font-weight: 500; fill: #64748B; }
    .svc-port { font-size: 12px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; fill: #0284C7; }

    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #CBD5E1; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #0F172A; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #1D4ED8; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #6D28D9; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #334155; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #64748B; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #B91C1C; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #1D4ED8; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #6D28D9; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #0F172A; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #1E293B; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #334155; }
    .panel-bold { font-weight: 700; fill: #0F172A; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #0284C7; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 30)">
    <rect width="1920" height="105" rx="12" fill="url(#header-grad)" filter="url(#card-shadow)"/>
    <text x="30" y="32" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE | DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="30" y="65" class="doc-title">5. DISPATCH-SERVICE (DỊCH VỤ ĐIỀU PHỐI NHIỆM VỤ COURIER)</text>
    <text x="30" y="90" class="doc-subtitle">Phân bổ và điều phối nhiệm vụ gom/phát/hoàn cho tài xế theo khu vực địa bàn</text>
    
    <!-- Badges -->
    <rect x="1560" y="36" width="160" height="34" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="1640" y="58" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">PORT :3004</text>

    <rect x="1740" y="36" width="180" height="34" rx="6" fill="#1E293B" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="1830" y="58" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">DB: dispatch_db</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 155)">
    <rect width="1920" height="630" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)"/>

<g transform="translate(20, 20)">
  <rect width="470" height="236" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#6D28D9"/>
  <text x="14" y="23" class="tbl-header">Task (tasks)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">NHIỆM VỤ COURIER</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="74" r="2" fill="#94A3B8"/>
  <text x="30" y="78" class="tbl-field-normal">taskCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE (TSK-2026-001)</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">taskType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">ENUM PICKUP, DELIVERY, RETURN</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">status</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">ENUM CREATED, ASSIGNED, COMPLETED</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <rect x="8" y="139" width="26" height="14" rx="3" fill="#EDE9FE"/>
  <text x="21" y="150" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="150" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">VARCHAR(32) FK-dist shipment.code</text>
  <rect x="1" y="156" width="468" height="24" fill="#F8FAFC"/>
  <rect x="8" y="163" width="26" height="14" rx="3" fill="#EDE9FE"/>
  <text x="21" y="174" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="174" class="tbl-field-dist">pickupRequestId</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">VARCHAR(32) FK-dist pickup_requests</text>
  <rect x="1" y="180" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="194" r="2" fill="#94A3B8"/>
  <text x="30" y="198" class="tbl-field-normal">note</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">TEXT GHI CHÚ GIAO HÀNG</text>
  <rect x="1" y="204" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="218" r="2" fill="#94A3B8"/>
  <text x="30" y="222" class="tbl-field-normal">createdAt</text>
  <text x="458" y="222" class="tbl-type" text-anchor="end">TIMESTAMP DEFAULT NOW()</text>
</g>
<g transform="translate(510, 20)">
  <rect width="470" height="164" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#6D28D9"/>
  <text x="14" y="23" class="tbl-header">TaskAssignment</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">LỊCH SỬ GÁN TÀI XẾ</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <rect x="10" y="67" width="20" height="14" rx="3" fill="#DBEAFE"/>
  <text x="20" y="78" class="badge-fk" text-anchor="middle">FK</text>
  <text x="42" y="78" class="tbl-field-fk">taskId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">CUID FK -&gt; tasks.id</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <rect x="8" y="91" width="26" height="14" rx="3" fill="#EDE9FE"/>
  <text x="21" y="102" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="102" class="tbl-field-dist">courierId</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) FK-dist auth.users</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">assignedAt</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">TIMESTAMP THỜI ĐIỂM GÁN</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="146" r="2" fill="#94A3B8"/>
  <text x="30" y="150" class="tbl-field-normal">unassignedAt</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">TIMESTAMP THỜI ĐIỂM ĐỔI TÀI XẾ</text>
</g>
<g transform="translate(20, 280)">
  <rect width="470" height="188" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#475569"/>
  <text x="14" y="23" class="tbl-header">OpsAuditLog (Dispatch)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">ops_audit_logs</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="74" r="2" fill="#94A3B8"/>
  <text x="30" y="78" class="tbl-field-normal">actorId / actorUsername</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) ĐIỀU PHỐI VIÊN</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">action / targetType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) ASSIGN_TASK, REASSIGN</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">targetId / ipAddress</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(64) NULLABLE</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="146" r="2" fill="#94A3B8"/>
  <text x="30" y="150" class="tbl-field-normal">before / after</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB AUDIT DIFF</text>
  <rect x="1" y="156" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="170" r="2" fill="#94A3B8"/>
  <text x="30" y="174" class="tbl-field-normal">createdAt</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">TIMESTAMP INDEX</text>
</g>
<g transform="translate(510, 220)">
  <rect width="470" height="164" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#475569"/>
  <text x="14" y="23" class="tbl-header">OutboxEvent (Dispatch)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">outbox_events</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="74" r="2" fill="#94A3B8"/>
  <text x="30" y="78" class="tbl-field-normal">eventId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) UNIQUE</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">eventType / routingKey</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) TASK.ASSIGNED, ...</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">aggregateType / aggregateId</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(64) Task / id</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="146" r="2" fill="#94A3B8"/>
  <text x="30" y="150" class="tbl-field-normal">payload</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB TASK PAYLOAD</text>
</g>

    <path d="M 490 60 L 510 60" stroke="#475569" stroke-width="1.8" fill="none" marker-start="url(#crow-one)" marker-end="url(#crow-many)"/>
    
<g transform="translate(1010, 20)">
  <rect width="890" height="590" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#table-shadow)"/>
  <rect x="0" y="0" width="890" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="14" y="13" width="7" height="18" rx="2" fill="#7C3AED"/>
  <text x="28" y="27" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: DISPATCH-SERVICE</text>
  <rect x="710" y="10" width="166" height="24" rx="5" fill="#7C3AED18" stroke="#7C3AED" stroke-width="1"/>
  <text x="793" y="26" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">TASK DISPATCHING</text>
  <text x="18" y="68" class="panel-sec-title">▶ VAI TRÒ ĐIỀU PHỐI NHIỆM VỤ TỰ ĐỘNG (DISPATCH MANAGEMENT)</text>
  <circle cx="25" cy="84" r="2.2" fill="#7C3AED"/>
  <text x="36" y="88" class="panel-body"><tspan class="panel-bold">Phân công 3 loại nhiệm vụ:</tspan> Quản lý tập trung: <tspan class="panel-code">PICKUP</tspan> (Gom hàng shop), <tspan class="panel-code">DELIVERY</tspan> (Phát hàng cho khách), <tspan class="panel-code">RETURN</tspan> (Chuyển hoàn).</text>
  <circle cx="25" cy="104" r="2.2" fill="#7C3AED"/>
  <text x="36" y="108" class="panel-body"><tspan class="panel-bold">Lịch sử điều chuyển (Re-assignment):</tspan> Bảng <tspan class="panel-code">task_assignments</tspan> cho phép đổi tài xế nếu Courier bị sự cố xe cộ mà vẫn bảo toàn lịch sử bàn giao.</text>
  <text x="18" y="136" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="152" r="2.2" fill="#7C3AED"/>
  <text x="36" y="156" class="panel-body"><tspan class="panel-code">courierId</tspan>: Ánh xạ tài xế di động nhận việc trên mobile app.</text>
  <circle cx="25" cy="172" r="2.2" fill="#7C3AED"/>
  <text x="36" y="176" class="panel-body"><tspan class="panel-code">shipmentCode / pickupRequestId</tspan>: Khóa liên kết đối tượng cần giao hoặc cần lấy.</text>
  <rect x="14" y="550" width="862" height="28" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="445.0" y="568" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Engine: dispatch_db (PostgreSQL 16) | Task Types: PICKUP, DELIVERY, RETURN | Audit: Full Ops Log</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 805)">
    <rect width="1920" height="55" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="25" cy="28" r="6" fill="#38BDF8"/>
    <text x="42" y="32" font-size="12" font-weight="700" fill="#38BDF8">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="32" font-size="11.5" fill="#E2E8F0">Bắn sự kiện TASK.ASSIGNED thông báo đẩy (Push Notification) đến Courier Mobile App</text>
    <text x="1900" y="32" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
