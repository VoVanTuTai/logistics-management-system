  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: DISPATCH-SERVICE</text>
  <rect x="516" y="9" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="601.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">DISPATCH ENGINE</text>
  <text x="18" y="70" class="panel-sec-title">▶ TRỌNG TÂM ĐIỀU PHỐI &amp; PHÂN BỔ NHIỆM VỤ</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Khởi tạo tác vụ tự động: Tự động gom đơn theo tuyến bưu tá dựa trên địa</text>
  <text x="36" y="110" class="panel-body">chỉ phường/xã và ranh giới polygon từ masterdata-service.</text>
  <circle cx="25" cy="128" r="2" fill="#000000"/>
  <text x="36" y="132" class="panel-body">Cân bằng tải tài xế: Thuật toán phân bổ công việc theo số lượng đơn hiện</text>
  <text x="36" y="150" class="panel-body">tại và lịch sử chấp nhận cuốc của từng bưu tá.</text>
  <circle cx="25" cy="168" r="2" fill="#000000"/>
  <text x="36" y="172" class="panel-body">Nhật ký can thiệp Ops: Ghi nhận vết điều phối thủ công khi trưởng bưu cục</text>
  <text x="36" y="190" class="panel-body">gán lại việc khẩn cấp (Reassign).</text>
  <text x="18" y="222" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="240" r="2" fill="#000000"/>
  <text x="36" y="244" class="panel-body">courierId: Ánh xạ chuẩn xác tới tài khoản auth-service và phân tuyến</text>
  <text x="36" y="262" class="panel-body">masterdata-service.</text>
  <circle cx="25" cy="280" r="2" fill="#000000"/>
  <text x="36" y="284" class="panel-body">shipmentCode / pickupRequestId: Đồng bộ trạng thái thực thi tác vụ sang</text>
  <text x="36" y="302" class="panel-body">shipment-service &amp; pickup-service.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: PostgreSQL 16 | Assignment: Automated Polygon Matching | SLA: Real-time Dispatch</text>
