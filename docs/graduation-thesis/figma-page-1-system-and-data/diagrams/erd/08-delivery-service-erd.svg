<g transform="translate(1010, 20)">
  <rect width="890" height="820" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: DELIVERY-SERVICE</text>
  <rect x="710" y="9" width="166" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="793" y="25" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">LAST-MILE FULFILLMENT</text>
  <text x="18" y="66" class="panel-sec-title">▶ VAI TRÒ PHÁT HÀNG CHẶNG CUỐI &amp; BẢO ĐẢM PHÁP LÝ (LAST-MILE)</text>
  <circle cx="25" cy="82" r="2" fill="#000000"/>
  <text x="36" y="86" class="panel-body"><tspan class="panel-bold">Bằng chứng giao hàng (POD):</tspan> Lưu trữ ảnh chụp người nhận hoặc vị trí đặt bưu phẩm tại <tspan class="panel-code">pods</tspan> để giải quyết tranh chấp sau phát.</text>
  <circle cx="25" cy="102" r="2" fill="#000000"/>
  <text x="36" y="106" class="panel-body"><tspan class="panel-bold">Xác thực OTP 2 lớp:</tspan> Đối với đơn hàng giá trị cao hoặc hàng cồng kềnh, Courier bắt buộc phải nhập mã OTP gửi tới máy khách hàng vào <tspan class="panel-code">otp_records</tspan>.</text>
  <text x="18" y="134" class="panel-sec-title">▶ QUY TRÌNH XỬ LÝ SỰ CỐ GIAO KHÔNG THÀNH (NDR) &amp; CHUYỂN HOÀN</text>
  <circle cx="25" cy="150" r="2" fill="#000000"/>
  <text x="36" y="154" class="panel-body"><tspan class="panel-bold">Tối đa 3 lần giao (SLA):</tspan> Khi phát thất bại, hệ thống sinh bản ghi <tspan class="panel-code">NdrCase</tspan> lưu lý do chuẩn hóa và hẹn giờ giao lại <tspan class="panel-code">rescheduleAt</tspan>.</text>
  <circle cx="25" cy="170" r="2" fill="#000000"/>
  <text x="36" y="174" class="panel-body"><tspan class="panel-bold">Tự động kích hoạt chuyển hoàn:</tspan> Quá 3 lần giao bất thành hoặc khách từ chối nhận, hệ thống sinh <tspan class="panel-code">ReturnCase</tspan> đưa bưu phẩm vào luồng quay đầu trả shop.</text>
  <text x="18" y="202" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="218" r="2" fill="#000000"/>
  <text x="36" y="222" class="panel-body"><tspan class="panel-code">DELIVERY.DELIVERED Event</tspan>: Kích hoạt sang <tspan class="panel-code">payment-service</tspan> tạo trạng thái thu tiền COD và cập nhật <tspan class="panel-code">shipment.currentStatus = DELIVERED</tspan>.</text>
  <rect x="14" y="782" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="799" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: delivery_db (PostgreSQL 16) | SLA: 3 Delivery Attempts Max | Verification: Photo POD + SMS OTP</text>
</g>
  </g>

