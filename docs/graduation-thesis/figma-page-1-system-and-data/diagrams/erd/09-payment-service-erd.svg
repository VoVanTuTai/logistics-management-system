<g transform="translate(1010, 20)">
  <rect width="890" height="770" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PAYMENT-SERVICE</text>
  <rect x="710" y="9" width="166" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="793" y="25" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">FINANCIAL SETTLEMENT</text>
  <text x="18" y="66" class="panel-sec-title">▶ VAI TRÒ QUẢN LÝ DÒNG TIỀN THU HỘ (CASH-ON-DELIVERY FINANCIAL MESH)</text>
  <circle cx="25" cy="82" r="2" fill="#000000"/>
  <text x="36" y="86" class="panel-body"><tspan class="panel-bold">Thu tiền mặt chặng cuối:</tspan> Khi phát hàng thành công, bản ghi <tspan class="panel-code">CodRecord</tspan> ghi nhận số tiền Courier thu hộ từ người nhận.</text>
  <circle cx="25" cy="102" r="2" fill="#000000"/>
  <text x="36" y="106" class="panel-body"><tspan class="panel-bold">Chốt ca nộp tiền cuối ngày:</tspan> Điều phối viên bưu cục tổng hợp toàn bộ tiền mặt các đơn giao trong ngày vào một phiên <tspan class="panel-code">CodSettlementBatch</tspan>.</text>
  <text x="18" y="134" class="panel-sec-title">▶ CÔNG NGHỆ QUYẾT TOÁN TỰ ĐỘNG VIETQR &amp; PAYOS WEBHOOK</text>
  <circle cx="25" cy="150" r="2" fill="#000000"/>
  <text x="36" y="154" class="panel-body"><tspan class="panel-bold">Tạo mã VietQR động:</tspan> Hệ thống nhúng chính xác số tiền và cú pháp <tspan class="panel-code">transferMemo</tspan> vào mã QR chuẩn ngân hàng NAPAS.</text>
  <circle cx="25" cy="170" r="2" fill="#000000"/>
  <text x="36" y="174" class="panel-body"><tspan class="panel-bold">Khớp lệnh tự động (Zero-latency):</tspan> Webhook ngân hàng bắn vào <tspan class="panel-code">cod_settlement_payment_events</tspan>, hệ thống tự động đối chiếu memo để gạch nợ cho Courier trong vòng 2 giây.</text>
  <text x="18" y="202" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="218" r="2" fill="#000000"/>
  <text x="36" y="222" class="panel-body"><tspan class="panel-code">COD.SETTLED Event</tspan>: Bắn sang ví điện tử của Merchant, kích hoạt chuyển tiền về tài khoản ngân hàng của chủ shop.</text>
  <rect x="14" y="732" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="749" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: payment_db (PostgreSQL 16) | Payment Gateway: VietQR PayOS Webhook | Settlement: Zero-Touch Auto Match</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 980)">
    <rect width="1920" height="50" rx="6" fill="#F9FAFB" stroke="#000000" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="5" fill="#000000"/>
    <text x="42" y="29" font-size="12" font-weight="700" fill="#000000">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="29" font-size="11.5" fill="#1F2937">Bắn sự kiện COD.SETTLED kích hoạt giải ngân số dư ví điện tử của Merchant và gửi tin nhắn sao kê</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
