<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 920" width="100%" height="100%" style="background:#FFFFFF;">

  <defs>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#000000" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#000000" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#000000" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Technical Blueprint Double Frame -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1970" height="890" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="1960" height="880" fill="none" stroke="#000000" stroke-width="0.8"/>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 11.5px; font-weight: 700; fill: #000000; letter-spacing: 1.2px; text-transform: uppercase; }
    .doc-title { font-size: 23px; font-weight: 800; fill: #000000; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13px; font-weight: 400; fill: #374151; }
    
    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #000000; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #4B5563; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #000000; font-style: italic; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #1F2937; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #4B5563; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #FFFFFF; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #000000; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #000000; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #000000; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #000000; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #1F2937; }
    .panel-bold { font-weight: 700; fill: #000000; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #000000; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 32)">
    <rect width="1920" height="100" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="1920" y2="32" stroke="#E5E7EB" stroke-width="1"/>
    <text x="24" y="22" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE • DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="24" y="58" class="doc-title">4. PICKUP-SERVICE (DỊCH VỤ THU GOM ĐƠN TẬN NƠI)</text>
    <text x="24" y="82" class="doc-subtitle">Quản lý phiếu hẹn gom hàng, định vị tọa độ kho Shop và tập hợp danh sách kiện hàng cần lấy</text>
    
    <!-- Badges -->
    <rect x="1570" y="32" width="160" height="36" rx="4" fill="#F3F4F6" stroke="#000000" stroke-width="1.2"/>
    <text x="1650" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">PORT :3003</text>

    <rect x="1750" y="32" width="170" height="36" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text x="1835" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">DB: pickup_db</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 150)">
    <rect width="1920" height="680" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>

<g transform="translate(24, 20)">
  <rect width="470" height="332" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">PickupRequest</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">PICKUP_REQUESTS (LỆNH GOM HÀNG)</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">pickupCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE (PKP-1234</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">status</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">ENUM REQUESTED, ASSIGNED, PI</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">requesterName</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(128) TÊN NGƯỜI YÊU C</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">contactPhone</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">VARCHAR(20) SĐT LIÊN HỆ GOM</text>
  <circle cx="18" cy="170" r="1.8" fill="#000000"/>
  <text x="30" y="174" class="tbl-field-normal">pickupAddress</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">VARCHAR(255) ĐỊA CHỈ KHO SHO</text>
  <circle cx="18" cy="194" r="1.8" fill="#000000"/>
  <text x="30" y="198" class="tbl-field-normal">pickupLatitude / Longitude</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">FLOAT TỌA ĐỘ GPS KHO SHOP</text>
  <circle cx="18" cy="218" r="1.8" fill="#000000"/>
  <text x="30" y="222" class="tbl-field-normal">note</text>
  <text x="458" y="222" class="tbl-type" text-anchor="end">TEXT GHI CHÚ HÀNG HÓA</text>
  <rect x="8" y="235" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="246" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="246" class="tbl-field-dist">approvedBy</text>
  <text x="458" y="246" class="tbl-type" text-anchor="end">VARCHAR(64) FK-dist auth.use</text>
  <circle cx="18" cy="266" r="1.8" fill="#000000"/>
  <text x="30" y="270" class="tbl-field-normal">approvedAt / completedAt</text>
  <text x="458" y="270" class="tbl-type" text-anchor="end">TIMESTAMP THỜI ĐIỂM DUYỆT /</text>
  <circle cx="18" cy="290" r="1.8" fill="#000000"/>
  <text x="30" y="294" class="tbl-field-normal">cancellationReason</text>
  <text x="458" y="294" class="tbl-type" text-anchor="end">TEXT LÝ DO HỦY YÊU CẦU</text>
  <circle cx="18" cy="314" r="1.8" fill="#000000"/>
  <text x="30" y="318" class="tbl-field-normal">createdAt / updatedAt</text>
  <text x="458" y="318" class="tbl-type" text-anchor="end">TIMESTAMP METADATA</text>
</g>
<g transform="translate(514, 20)">
  <rect width="470" height="164" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">PickupItem</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">PICKUP_ITEMS (DANH SÁCH BƯU GỬI GOM)</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) CUID NOT NULL</text>
  <rect x="10" y="67" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="20" y="78" class="badge-fk" text-anchor="middle">FK</text>
  <text x="42" y="78" class="tbl-field-fk">pickupRequestId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) FK -&gt; PickupRequ</text>
  <rect x="8" y="91" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="102" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="102" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(32) FK-dist shipment</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">quantity</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">INT DEFAULT 1</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">createdAt / updatedAt</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">TIMESTAMP METADATA</text>
</g>
<g transform="translate(514, 204)">
  <rect width="470" height="164" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">OutboxEvent (Pickup)</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">OUTBOX_EVENTS</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">eventId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) UNIQUE</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">eventType / routingKey</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) PICKUP.REQUESTED</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">aggregateType / aggregateId</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(64) PickupRequest /</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">payload</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB CHI TIẾT LÔ HÀNG GOM</text>
</g>

    <path d="M 494 60 L 514 60" stroke="#000000" stroke-width="1.8" fill="none" marker-start="url(#crow-one)" marker-end="url(#crow-many)"/>
    
<g transform="translate(1010, 20)">
  <rect width="890" height="640" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PICKUP-SERVICE</text>
  <rect x="705" y="9" width="171" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="790.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">FIRST-MILE COLLECTION</text>
  <text x="18" y="68" class="panel-sec-title">▶ VAI TRÒ &amp; NGHIỆP VỤ THU GOM</text>
  <circle cx="25" cy="84" r="2" fill="#000000"/>
  <text x="36" y="88" class="panel-body">Tiếp nhận yêu cầu gom hàng tận nơi từ chủ Shop (Merchant) hoặc khách hàng gửi cá</text>
  <text x="36" y="106" class="panel-body">nhân.</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Tập hợp nhiều vận đơn (shipmentCode) vào một PickupRequest duy nhất thông qua quan</text>
  <text x="36" y="144" class="panel-body">hệ 1:N với bảng PickupItem.</text>
  <circle cx="25" cy="160" r="2" fill="#000000"/>
  <text x="36" y="164" class="panel-body">Xác thực tọa độ kho (pickupLatitude, pickupLongitude) hỗ trợ dispatch-service tối</text>
  <text x="36" y="182" class="panel-body">ưu hóa lộ trình tài xế.</text>
  <text x="18" y="210" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="226" r="2" fill="#000000"/>
  <text x="36" y="230" class="panel-body">pickupCode (PKP-XXXXXX): Được truyền sang dispatch-service để tạo nhiệm vụ</text>
  <text x="36" y="248" class="panel-body">TaskType = PICKUP cho tài xế.</text>
  <circle cx="25" cy="264" r="2" fill="#000000"/>
  <text x="36" y="268" class="panel-body">shipmentCode: Ánh xạ từ PickupItem sang shipment-service để cập nhật trạng thái</text>
  <text x="36" y="286" class="panel-body">đơn thành PICKUP_ASSIGNED.</text>
  <text x="18" y="314" class="panel-sec-title">▶ ĐỒNG BỘ TRẠNG THÁI (OUTBOX)</text>
  <circle cx="25" cy="330" r="2" fill="#000000"/>
  <text x="36" y="334" class="panel-body">Khi tài xế hoàn tất nhận hàng tại kho Shop, trạng thái đổi thành PICKED_UP.</text>
  <circle cx="25" cy="350" r="2" fill="#000000"/>
  <text x="36" y="354" class="panel-body">OutboxEvent phát hành sự kiện PICKUP.COMPLETED kích hoạt luồng nhập kho bưu cục</text>
  <text x="36" y="372" class="panel-body">tại scan-service.</text>
  <rect x="14" y="602" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="619" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: pickup_db (PostgreSQL 16) | Pattern: Transactional Outbox | Isolation: Read Committed</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 850)">
    <rect width="1920" height="50" rx="6" fill="#F9FAFB" stroke="#000000" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="5" fill="#000000"/>
    <text x="42" y="29" font-size="12" font-weight="700" fill="#000000">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="29" font-size="11.5" fill="#1F2937">Phát hành sự kiện PICKUP.REQUESTED, PICKUP.COMPLETED qua RabbitMQ mesh</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
