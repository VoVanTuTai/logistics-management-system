  <text x="42" y="102" class="tbl-field-dist">merchantId</text>
  <text x="468" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) FK-dist masterda</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">pickupAddress</text>
  <text x="468" y="126" class="tbl-type" text-anchor="end">VARCHAR(255) ĐỊA CHỈ SHOP LẤ</text>
  <rect x="8" y="139" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="150" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="150" class="tbl-field-dist">hubCode</text>
  <text x="468" y="150" class="tbl-type" text-anchor="end">VARCHAR(32) BƯU CỤC PHỤ TRÁC</text>
  <rect x="8" y="163" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="174" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="174" class="tbl-field-dist">assignedCourierId</text>
  <text x="468" y="174" class="tbl-type" text-anchor="end">VARCHAR(64) TÀI XẾ ĐƯỢC ĐIỀU</text>
  <circle cx="18" cy="194" r="1.8" fill="#000000"/>
  <text x="30" y="198" class="tbl-field-normal">status</text>
  <text x="468" y="198" class="tbl-type" text-anchor="end">ENUM REQUESTED, ASSIGNED, CO</text>
  <circle cx="18" cy="218" r="1.8" fill="#000000"/>
  <text x="30" y="222" class="tbl-field-normal">packageCount</text>
  <text x="468" y="222" class="tbl-type" text-anchor="end">INT SỐ LƯỢNG GÓI HÀNG DỰ KIẾ</text>
  <circle cx="18" cy="242" r="1.8" fill="#000000"/>
  <text x="30" y="246" class="tbl-field-normal">scheduledDate</text>
  <text x="468" y="246" class="tbl-type" text-anchor="end">DATE NGÀY HẸN LẤY HÀNG</text>
  <circle cx="18" cy="266" r="1.8" fill="#000000"/>
  <text x="30" y="270" class="tbl-field-normal">scheduledSlot</text>
  <text x="468" y="270" class="tbl-type" text-anchor="end">VARCHAR(32) CA LẤY (VD: SÁNG</text>
  <circle cx="18" cy="290" r="1.8" fill="#000000"/>
  <text x="30" y="294" class="tbl-field-normal">note</text>
  <text x="468" y="294" class="tbl-type" text-anchor="end">TEXT LƯU Ý CỦA CHỦ SHOP</text>
  <circle cx="18" cy="314" r="1.8" fill="#000000"/>
  <text x="30" y="318" class="tbl-field-normal">createdAt</text>
  <text x="468" y="318" class="tbl-type" text-anchor="end">TIMESTAMP DEFAULT NOW()</text>
</g>
<g transform="translate(680, 80)">
  <rect width="480" height="188" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="480" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">PickupItem</text>
  <text x="466" y="23" class="tbl-tag" text-anchor="end">PICKUP_ITEMS (DANH MỤC ĐƠN THU)</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="468" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) CUID NOT NULL</text>
  <rect x="10" y="67" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="20" y="78" class="badge-fk" text-anchor="middle">FK</text>
  <text x="42" y="78" class="tbl-field-fk">pickupRequestId</text>
  <text x="468" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) FK -&gt; PickupRequ</text>
  <rect x="8" y="91" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="102" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="102" class="tbl-field-dist">shipmentCode</text>
  <text x="468" y="102" class="tbl-type" text-anchor="end">VARCHAR(32) MÃ VẬN ĐƠN BƯU P</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">status</text>
  <text x="468" y="126" class="tbl-type" text-anchor="end">ENUM PENDING, COLLECTED, FAI</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">collectedAt</text>
  <text x="468" y="150" class="tbl-type" text-anchor="end">TIMESTAMP THỜI ĐIỂM QUÉT THU</text>
  <circle cx="18" cy="170" r="1.8" fill="#000000"/>
  <text x="30" y="174" class="tbl-field-normal">failureReason</text>
  <text x="468" y="174" class="tbl-type" text-anchor="end">VARCHAR(128) LÝ DO KHÔNG LẤY</text>
</g>
<g transform="translate(680, 318)">
  <rect width="480" height="140" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="480" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">OutboxEvent (Pickup)</text>
  <text x="466" y="23" class="tbl-tag" text-anchor="end">OUTBOX_EVENTS</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="468" y="54" class="tbl-type" text-anchor="end">VARCHAR(64) CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">eventId</text>
  <text x="468" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) UNIQUE</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">eventType</text>
  <text x="468" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) PICKUP.ASSIGNED,</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">payload</text>
  <text x="468" y="126" class="tbl-type" text-anchor="end">JSONB DỮ LIỆU ĐỢT THU GOM</text>
</g>

    <!-- PickupRequest (1) -> PickupItem (N) Direct Cross -->
      <path d="M 520 140 L 680 140" stroke="#000000" stroke-width="1.8" fill="none"/>
  <line x1="527.0" y1="134.0" x2="527.0" y2="146.0" stroke="#000000" stroke-width="1.8"/>
  <line x1="533.0" y1="134.0" x2="533.0" y2="146.0" stroke="#000000" stroke-width="1.8"/>
  <text x="542.0" y="135.0" font-size="11" font-weight="700" fill="#000000" text-anchor="start">1</text>
  <path d="M 667.0 140.0 L 680.0 133.0 M 667.0 140.0 L 680.0 147.0" stroke="#000000" stroke-width="1.8" fill="none"/>
  <line x1="663.0" y1="134.0" x2="663.0" y2="146.0" stroke="#000000" stroke-width="1.8"/>
  <text x="654.0" y="135.0" font-size="11" font-weight="700" fill="#000000" text-anchor="end">N</text>
    
<g transform="translate(1200, 20)">
  <rect width="700" height="1020" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="700" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: PICKUP-SERVICE</text>
  <rect x="515" y="9" width="171" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="600.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">FIRST-MILE OPERATIONS</text>
  <text x="18" y="70" class="panel-sec-title">▶ VAI TRÒ &amp; NGHIỆP VỤ THU GOM</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Khởi tạo ca lấy hàng tận nơi: Tiếp nhận lệnh gom từ Portal Shop, tổng hợp</text>
  <text x="36" y="110" class="panel-body">danh mục bưu phẩm cần lấy theo khung giờ.</text>
  <circle cx="25" cy="128" r="2" fill="#000000"/>
  <text x="36" y="132" class="panel-body">Quản lý danh sách đơn con (PickupItem): Bưu tá quét mã từng bưu kiện tại</text>
  <text x="36" y="150" class="panel-body">kho Shop; ghi nhận bưu kiện thu thành công hoặc thất bại.</text>
  <text x="18" y="182" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="200" r="2" fill="#000000"/>
  <text x="36" y="204" class="panel-body">assignedCourierId: Liên kết bưu tá từ auth-service và phân công qua</text>
  <text x="36" y="222" class="panel-body">dispatch-service.</text>
  <circle cx="25" cy="240" r="2" fill="#000000"/>
  <text x="36" y="244" class="panel-body">shipmentCode: Đồng bộ chuyển trạng thái đơn sang PICKED_UP trên shipment-</text>
  <text x="36" y="262" class="panel-body">service.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: PostgreSQL 16 | Pattern: Transactional Outbox | Message Broker: RabbitMQ (Topic Exchange)</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 1230)">
    <rect width="1920" height="50" rx="6" fill="#F9FAFB" stroke="#000000" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="5" fill="#000000"/>
    <text x="42" y="29" font-size="12" font-weight="700" fill="#000000">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="29" font-size="11.5" fill="#1F2937">Phát hành sự kiện PICKUP.ASSIGNED, PICKUP.COLLECTED tới dispatch-service &amp; tracking-service</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
