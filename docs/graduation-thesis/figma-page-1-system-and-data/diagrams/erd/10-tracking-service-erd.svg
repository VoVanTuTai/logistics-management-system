<g transform="translate(1010, 20)">
  <rect width="890" height="620" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: TRACKING-SERVICE</text>
  <rect x="628" y="9" width="248" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="752.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">CQRS READ MODEL &amp; EVENT SOURCING</text>
  <text x="18" y="68" class="panel-sec-title">▶ MÔ HÌNH READ-MODEL &amp; EVENT SOURCING</text>
  <circle cx="25" cy="84" r="2" fill="#000000"/>
  <text x="36" y="88" class="panel-body">Tách biệt truy vấn đọc (CQRS Pattern): tracking-service không ghi dữ liệu gốc, chỉ</text>
  <text x="36" y="106" class="panel-body">lắng nghe toàn bộ sự kiện từ RabbitMQ mesh để xây dựng hành trình bưu kiện.</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Dòng sự kiện bất biến (TimelineEvent): Lưu vết tuần tự mọi sự kiện từ khi tạo đơn,</text>
  <text x="36" y="144" class="panel-body">đóng bao, xuất kho, phát hàng đến đối soát COD.</text>
  <circle cx="25" cy="160" r="2" fill="#000000"/>
  <text x="36" y="164" class="panel-body">Bảo vệ dữ liệu cá nhân (PII Sanitization): Trường viewPayload trong</text>
  <text x="36" y="182" class="panel-body">TrackingCurrent tự động che giấu số điện thoại và địa chỉ nhà riêng (098***) cho</text>
  <text x="36" y="200" class="panel-body">người xem công khai.</text>
  <text x="18" y="228" class="panel-sec-title">▶ TỐI ƯU HÓA TRA CỨU CÔNG KHAI (HIGH-TRAFFIC CACHE)</text>
  <circle cx="25" cy="244" r="2" fill="#000000"/>
  <text x="36" y="248" class="panel-body">Bảng TrackingIndex cho phép hàng triệu lượt khách vãng lai tra cứu đơn hàng qua mã</text>
  <text x="36" y="266" class="panel-body">vận đơn shipmentCode với độ trễ dưới 15ms.</text>
  <rect x="14" y="582" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="599" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: tracking_db (PostgreSQL 16) | Pattern: CQRS Read-Side Projection | Security: Automated PII Masking</text>
</g>
