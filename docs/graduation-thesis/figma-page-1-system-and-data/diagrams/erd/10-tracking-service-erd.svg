<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 850" width="100%" height="100%" style="background:#FFFFFF;">

  <defs>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#000000" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#000000" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#000000" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Technical Blueprint Frame -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1970" height="820" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="20" y="20" width="1960" height="810" fill="none" stroke="#000000" stroke-width="0.8"/>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 11.5px; font-weight: 700; fill: #000000; letter-spacing: 1.2px; text-transform: uppercase; }
    .doc-title { font-size: 23px; font-weight: 800; fill: #000000; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13px; font-weight: 400; fill: #374151; }
    
    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #000000; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #4B5563; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #000000; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #000000; font-style: italic; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #1F2937; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #4B5563; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #FFFFFF; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #000000; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #000000; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #000000; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #000000; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #1F2937; }
    .panel-bold { font-weight: 700; fill: #000000; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #000000; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 32)">
    <rect width="1920" height="100" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="1920" y2="32" stroke="#E5E7EB" stroke-width="1"/>
    <text x="24" y="22" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE • DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="24" y="58" class="doc-title">10. TRACKING-SERVICE (DỊCH VỤ TRA CỨU HÀNH TRÌNH BƯU PHẨM)</text>
    <text x="24" y="82" class="doc-subtitle">Mô hình Event Sourcing Read-Model, lưu vết chuỗi thời gian &amp; bảo vệ dữ liệu cá nhân PI</text>
    
    <!-- Badges -->
    <rect x="1570" y="32" width="160" height="36" rx="4" fill="#F3F4F6" stroke="#000000" stroke-width="1.2"/>
    <text x="1650" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">PORT :3008</text>

    <rect x="1750" y="32" width="170" height="36" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
    <text x="1835" y="55" font-size="12.5" font-weight="700" fill="#000000" text-anchor="middle">DB: tracking_db</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 150)">
    <rect width="1920" height="610" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.6"/>

<g transform="translate(20, 20)">
  <rect width="470" height="212" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">TimelineEvent</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">LỊCH TRÌNH BƯU PHẨM</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <circle cx="18" cy="74" r="1.8" fill="#000000"/>
  <text x="30" y="78" class="tbl-field-normal">eventId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) UNIQUE</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">eventType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) MANIFEST, SCAN, DELIVERY...</text>
  <rect x="8" y="115" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="126" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="126" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(32) INDEX (MÃ ĐƠN)</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">actor / locationCode</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">VARCHAR NGƯỜI LÀM / BƯU CỤC</text>
  <circle cx="18" cy="170" r="1.8" fill="#000000"/>
  <text x="30" y="174" class="tbl-field-normal">payload</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">JSONB SNAPSHOT DỮ LIỆU</text>
  <circle cx="18" cy="194" r="1.8" fill="#000000"/>
  <text x="30" y="198" class="tbl-field-normal">occurredAt</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">TIMESTAMP INDEX TIME</text>
</g>
<g transform="translate(510, 20)">
  <rect width="470" height="164" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">TrackingCurrent</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">BẢN GHI TRA CỨU NHANH</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="8" y="67" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="78" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="78" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE (READ-MODEL)</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">currentStatus / Location</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR TRẠNG THÁI HIỆN TẠI</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">lastEventType / lastEventAt</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR / TIME SỰ KIỆN MỚI NHẤT</text>
  <circle cx="18" cy="146" r="1.8" fill="#000000"/>
  <text x="30" y="150" class="tbl-field-normal">viewPayload</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB DỮ LIỆU ĐÃ CHE PII</text>
</g>
<g transform="translate(510, 230)">
  <rect width="470" height="140" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <line x1="0" y1="36" x2="470" y2="36" stroke="#000000" stroke-width="1.2"/>
  <text x="14" y="23" class="tbl-header">TrackingIndex</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">CHỈ MỤC TÌM KIẾM NHANH</text>
  <rect x="10" y="43" width="20" height="14" rx="2" fill="#000000"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="8" y="67" width="28" height="14" rx="2" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="2 1.5"/>
  <text x="22" y="78" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="78" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE</text>
  <circle cx="18" cy="98" r="1.8" fill="#000000"/>
  <text x="30" y="102" class="tbl-field-normal">latestEventType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) INDEX LOẠI SỰ KIỆN</text>
  <circle cx="18" cy="122" r="1.8" fill="#000000"/>
  <text x="30" y="126" class="tbl-field-normal">latestEventAt</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">TIMESTAMP MỐC SỰ KIỆN GẦN NHẤT</text>
</g>

<g transform="translate(1010, 20)">
  <rect width="890" height="570" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: TRACKING-SERVICE</text>
  <rect x="710" y="9" width="166" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="793" y="25" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">PUBLIC TRACKING</text>
  <text x="18" y="66" class="panel-sec-title">▶ MÔ HÌNH DÒNG SỰ KIỆN BẤT BIẾN (EVENT SOURCING READ-MODEL)</text>
  <circle cx="25" cy="82" r="2" fill="#000000"/>
  <text x="36" y="86" class="panel-body"><tspan class="panel-bold">Nhật ký bất biến (Append-only):</tspan> Bảng <tspan class="panel-code">TimelineEvent</tspan> lưu giữ toàn bộ các sự kiện xảy ra với bưu phẩm theo đúng trật tự thời gian chính xác.</text>
  <circle cx="25" cy="102" r="2" fill="#000000"/>
  <text x="36" y="106" class="panel-body"><tspan class="panel-bold">Bảo mật thông tin cá nhân (PII Masking):</tspan> Bảng <tspan class="panel-code">TrackingCurrent</tspan> tự động che giấu số điện thoại và địa chỉ nhà chi tiết khi trả về cho khách tra cứu công khai (Guest Tracking).</text>
  <text x="18" y="134" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="150" r="2" fill="#000000"/>
  <text x="36" y="154" class="panel-body"><tspan class="panel-code">shipmentCode</tspan>: Khóa tìm kiếm chính xác bưu phẩm trên cổng Web và ứng dụng di động.</text>
  <circle cx="25" cy="170" r="2" fill="#000000"/>
  <text x="36" y="174" class="panel-body"><tspan class="panel-bold">Đồng bộ từ RabbitMQ:</tspan> Lắng nghe sự kiện từ tất cả các dịch vụ: scan, manifest, dispatch, delivery.</text>
  <rect x="14" y="532" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="445.0" y="549" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: tracking_db (PostgreSQL 16) | Architecture: Event Sourcing CQRS Read Model | Privacy: Automated PII Masking</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 780)">
    <rect width="1920" height="50" rx="6" fill="#F9FAFB" stroke="#000000" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="5" fill="#000000"/>
    <text x="42" y="29" font-size="12" font-weight="700" fill="#000000">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="29" font-size="11.5" fill="#1F2937">Tiếp nhận sự kiện từ toàn bộ hệ thống để xây dựng dòng thời gian lịch trình phục vụ Web/Mobile</text>
    <text x="1900" y="29" font-size="11" font-weight="600" fill="#4B5563" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
