<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 850" width="100%" height="100%" style="background:#F8FAFC;">

  <defs>
    <filter id="card-shadow" x="-2%" y="-1.5%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="table-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <marker id="crow-many" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 10 7 L 0 14 M 10 0 L 10 14" stroke="#475569" stroke-width="1.8" fill="none"/>
    </marker>
    <marker id="crow-one" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <line x1="5" y1="2" x2="5" y2="12" stroke="#475569" stroke-width="1.8"/>
      <line x1="9" y1="2" x2="9" y2="12" stroke="#475569" stroke-width="1.8"/>
    </marker>
    <marker id="arrow-dist" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 0 1 L 9 6 L 0 11 z" fill="#0284C7"/>
    </marker>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E2E8F0"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .doc-badge { font-size: 12.5px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.5px; text-transform: uppercase; }
    .doc-title { font-size: 24px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .doc-subtitle { font-size: 13.5px; font-weight: 400; fill: #CBD5E1; }
    .meta-tag { font-size: 11.5px; font-weight: 600; fill: #E2E8F0; }
    
    .svc-title { font-size: 18px; font-weight: 800; fill: #0F172A; }
    .svc-sub { font-size: 12.5px; font-weight: 500; fill: #64748B; }
    .svc-port { font-size: 12px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; fill: #0284C7; }

    .tbl-header { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
    .tbl-tag { font-size: 10.5px; font-weight: 600; fill: #CBD5E1; text-transform: uppercase; }
    .tbl-field-pk { font-size: 11.5px; font-weight: 700; fill: #0F172A; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-fk { font-size: 11.5px; font-weight: 600; fill: #1D4ED8; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-dist { font-size: 11.5px; font-weight: 600; fill: #6D28D9; font-family: ui-monospace, Menlo, monospace; }
    .tbl-field-normal { font-size: 11.5px; font-weight: 500; fill: #334155; font-family: ui-monospace, Menlo, monospace; }
    .tbl-type { font-size: 11px; font-weight: 500; fill: #64748B; }

    .badge-pk { font-size: 9.5px; font-weight: 800; fill: #B91C1C; }
    .badge-fk { font-size: 9.5px; font-weight: 800; fill: #1D4ED8; }
    .badge-dist { font-size: 9.5px; font-weight: 800; fill: #6D28D9; }

    .panel-header { font-size: 13.5px; font-weight: 800; fill: #0F172A; text-transform: uppercase; letter-spacing: 0.5px; }
    .panel-sec-title { font-size: 12px; font-weight: 700; fill: #1E293B; }
    .panel-body { font-size: 11.5px; font-weight: 400; fill: #334155; }
    .panel-bold { font-weight: 700; fill: #0F172A; }
    .panel-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #0284C7; }
  </style>


  <!-- HEADER -->
  <g id="Header" transform="translate(40, 30)">
    <rect width="1920" height="105" rx="12" fill="url(#header-grad)" filter="url(#card-shadow)"/>
    <text x="30" y="32" class="doc-badge">NEXUS LOGISTICS SYSTEM ARCHITECTURE | DATABASE-PER-SERVICE SPECIFICATION</text>
    <text x="30" y="65" class="doc-title">10. TRACKING-SERVICE (DỊCH VỤ TRA CỨU HÀNH TRÌNH BƯU PHẨM)</text>
    <text x="30" y="90" class="doc-subtitle">Mô hình Event Sourcing Read-Model, lưu vết chuỗi thời gian &amp; bảo vệ dữ liệu cá nhân PI</text>
    
    <!-- Badges -->
    <rect x="1560" y="36" width="160" height="34" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="1640" y="58" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">PORT :3008</text>

    <rect x="1740" y="36" width="180" height="34" rx="6" fill="#1E293B" stroke="#2563EB" stroke-width="1.2"/>
    <text x="1830" y="58" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">DB: tracking_db</text>
  </g>


  <!-- MAIN SERVICE CONTAINER -->
  <g id="ServiceBody" transform="translate(40, 155)">
    <rect width="1920" height="600" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)"/>

<g transform="translate(20, 20)">
  <rect width="470" height="212" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#1D4ED8"/>
  <text x="14" y="23" class="tbl-header">TimelineEvent</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">LỊCH TRÌNH BƯU PHẨM</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="74" r="2" fill="#94A3B8"/>
  <text x="30" y="78" class="tbl-field-normal">eventId</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(64) UNIQUE</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">eventType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) MANIFEST, SCAN, DELIVERY...</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <rect x="8" y="115" width="26" height="14" rx="3" fill="#EDE9FE"/>
  <text x="21" y="126" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="126" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR(32) INDEX (MÃ ĐƠN)</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="146" r="2" fill="#94A3B8"/>
  <text x="30" y="150" class="tbl-field-normal">actor / locationCode</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">VARCHAR NGƯỜI LÀM / BƯU CỤC</text>
  <rect x="1" y="156" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="170" r="2" fill="#94A3B8"/>
  <text x="30" y="174" class="tbl-field-normal">payload</text>
  <text x="458" y="174" class="tbl-type" text-anchor="end">JSONB SNAPSHOT DỮ LIỆU</text>
  <rect x="1" y="180" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="194" r="2" fill="#94A3B8"/>
  <text x="30" y="198" class="tbl-field-normal">occurredAt</text>
  <text x="458" y="198" class="tbl-type" text-anchor="end">TIMESTAMP INDEX TIME</text>
</g>
<g transform="translate(510, 20)">
  <rect width="470" height="164" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#1D4ED8"/>
  <text x="14" y="23" class="tbl-header">TrackingCurrent</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">BẢN GHI TRA CỨU NHANH</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <rect x="8" y="67" width="26" height="14" rx="3" fill="#EDE9FE"/>
  <text x="21" y="78" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="78" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE (READ-MODEL)</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">currentStatus / Location</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR TRẠNG THÁI HIỆN TẠI</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">lastEventType / lastEventAt</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">VARCHAR / TIME SỰ KIỆN MỚI NHẤT</text>
  <rect x="1" y="132" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="146" r="2" fill="#94A3B8"/>
  <text x="30" y="150" class="tbl-field-normal">viewPayload</text>
  <text x="458" y="150" class="tbl-type" text-anchor="end">JSONB DỮ LIỆU ĐÃ CHE PII</text>
</g>
<g transform="translate(510, 230)">
  <rect width="470" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" filter="url(#table-shadow)"/>
  <path d="M 0 8 Q 0 0 8 0 L 462 0 Q 470 0 470 8 L 470 36 L 0 36 Z" fill="#2563EB"/>
  <text x="14" y="23" class="tbl-header">TrackingIndex</text>
  <text x="456" y="23" class="tbl-tag" text-anchor="end">CHỈ MỤC TÌM KIẾM NHANH</text>
  <rect x="1" y="36" width="468" height="24" fill="#FFFFFF"/>
  <rect x="10" y="43" width="20" height="14" rx="3" fill="#FEE2E2"/>
  <text x="20" y="54" class="badge-pk" text-anchor="middle">PK</text>
  <text x="42" y="54" class="tbl-field-pk">id</text>
  <text x="458" y="54" class="tbl-type" text-anchor="end">CUID NOT NULL</text>
  <rect x="1" y="60" width="468" height="24" fill="#F8FAFC"/>
  <rect x="8" y="67" width="26" height="14" rx="3" fill="#EDE9FE"/>
  <text x="21" y="78" class="badge-dist" text-anchor="middle">DIST</text>
  <text x="42" y="78" class="tbl-field-dist">shipmentCode</text>
  <text x="458" y="78" class="tbl-type" text-anchor="end">VARCHAR(32) UNIQUE</text>
  <rect x="1" y="84" width="468" height="24" fill="#FFFFFF"/>
  <circle cx="18" cy="98" r="2" fill="#94A3B8"/>
  <text x="30" y="102" class="tbl-field-normal">latestEventType</text>
  <text x="458" y="102" class="tbl-type" text-anchor="end">VARCHAR(64) INDEX LOẠI SỰ KIỆN</text>
  <rect x="1" y="108" width="468" height="24" fill="#F8FAFC"/>
  <circle cx="18" cy="122" r="2" fill="#94A3B8"/>
  <text x="30" y="126" class="tbl-field-normal">latestEventAt</text>
  <text x="458" y="126" class="tbl-type" text-anchor="end">TIMESTAMP MỐC SỰ KIỆN GẦN NHẤT</text>
</g>

<g transform="translate(1010, 20)">
  <rect width="890" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#table-shadow)"/>
  <rect x="0" y="0" width="890" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="14" y="13" width="7" height="18" rx="2" fill="#2563EB"/>
  <text x="28" y="27" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: TRACKING-SERVICE</text>
  <rect x="710" y="10" width="166" height="24" rx="5" fill="#2563EB18" stroke="#2563EB" stroke-width="1"/>
  <text x="793" y="26" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">PUBLIC TRACKING</text>
  <text x="18" y="68" class="panel-sec-title">▶ MÔ HÌNH DÒNG SỰ KIỆN BẤT BIẾN (EVENT SOURCING READ-MODEL)</text>
  <circle cx="25" cy="84" r="2.2" fill="#2563EB"/>
  <text x="36" y="88" class="panel-body"><tspan class="panel-bold">Nhật ký bất biến (Append-only):</tspan> Bảng <tspan class="panel-code">TimelineEvent</tspan> lưu giữ toàn bộ các sự kiện xảy ra với bưu phẩm theo đúng trật tự thời gian chính xác.</text>
  <circle cx="25" cy="104" r="2.2" fill="#2563EB"/>
  <text x="36" y="108" class="panel-body"><tspan class="panel-bold">Bảo mật thông tin cá nhân (PII Masking):</tspan> Bảng <tspan class="panel-code">TrackingCurrent</tspan> tự động che giấu số điện thoại và địa chỉ nhà chi tiết khi trả về cho khách tra cứu công khai (Guest Tracking).</text>
  <text x="18" y="136" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="152" r="2.2" fill="#2563EB"/>
  <text x="36" y="156" class="panel-body"><tspan class="panel-code">shipmentCode</tspan>: Khóa tìm kiếm chính xác bưu phẩm trên cổng Web và ứng dụng di động.</text>
  <circle cx="25" cy="172" r="2.2" fill="#2563EB"/>
  <text x="36" y="176" class="panel-body"><tspan class="panel-bold">Đồng bộ từ RabbitMQ:</tspan> Lắng nghe sự kiện từ tất cả các dịch vụ: scan, manifest, dispatch, delivery.</text>
  <rect x="14" y="520" width="862" height="28" rx="5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="445.0" y="538" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Engine: tracking_db (PostgreSQL 16) | Architecture: Event Sourcing CQRS Read Model | Privacy: Automated PII Masking</text>
</g>
  </g>

  <!-- SAGA CONTEXT FOOTER -->
  <g id="FooterSaga" transform="translate(40, 775)">
    <rect width="1920" height="55" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="25" cy="28" r="6" fill="#38BDF8"/>
    <text x="42" y="32" font-size="12" font-weight="700" fill="#38BDF8">CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA):</text>
    <text x="310" y="32" font-size="11.5" fill="#E2E8F0">Tiếp nhận sự kiện từ toàn bộ hệ thống để xây dựng dòng thời gian lịch trình phục vụ Web/Mobile</text>
    <text x="1900" y="32" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="end">Nexus Software Engineering Thesis</text>
  </g>
</svg>
