  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: TRACKING-SERVICE</text>
  <rect x="516" y="9" width="170" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="601.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">CQRS READ MODEL</text>
  <text x="18" y="70" class="panel-sec-title">▶ MÔ HÌNH CQRS &amp; TRUY VẾT CÔNG KHAI TỐC ĐỘ CAO</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Phân tách Đọc/Ghi (CQRS): tracking-service đóng vai trò Read-Model, nhận</text>
  <text x="36" y="110" class="panel-body">sự kiện từ tất cả các dịch vụ (scan, shipment, delivery) để tổng hợp dòng</text>
  <text x="36" y="128" class="panel-body">thời gian.</text>
  <circle cx="25" cy="146" r="2" fill="#000000"/>
  <text x="36" y="150" class="panel-body">Trạng thái tức thời (TrackingCurrent): 1 bản ghi duy nhất cho mỗi đơn hàng</text>
  <text x="36" y="168" class="panel-body">giúp phục vụ hàng triệu lượt tra cứu mã vận đơn công khai mà không phải</text>
  <text x="36" y="186" class="panel-body">quét bảng lịch sử.</text>
  <circle cx="25" cy="204" r="2" fill="#000000"/>
  <text x="36" y="208" class="panel-body">Chỉ mục tìm kiếm mờ (TrackingIndex): Tối ưu hóa truy vấn theo số điện</text>
  <text x="36" y="226" class="panel-body">thoại người nhận hoặc tên khách hàng.</text>
  <text x="18" y="258" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="276" r="2" fill="#000000"/>
  <text x="36" y="280" class="panel-body">shipmentCode: Khóa định danh liên kết toàn bộ hành trình từ lúc tạo đến</text>
  <text x="36" y="298" class="panel-body">phát thành công.</text>
  <circle cx="25" cy="316" r="2" fill="#000000"/>
  <text x="36" y="320" class="panel-body">Public API Cache: Cache kết quả tra cứu tại Cloudflare CDN &amp; Redis để giảm</text>
  <text x="36" y="338" class="panel-body">tải tối đa cho DB.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: PostgreSQL 16 | Architecture: CQRS Pattern | Read Scale: 50,000 req/sec (Redis/CDN)</text>
</g>
