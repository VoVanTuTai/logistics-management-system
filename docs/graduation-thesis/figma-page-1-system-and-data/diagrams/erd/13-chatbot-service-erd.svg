  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Tìm kiếm lai (Hybrid Search): Kết hợp độ tương đồng Cosine (0.70) và từ khóa chính</text>
  <text x="36" y="144" class="panel-body">xác BM25 (0.35) đảm bảo trích xuất chính xác 100% quy định bồi thường.</text>
  <circle cx="25" cy="160" r="2" fill="#000000"/>
  <text x="36" y="164" class="panel-body">Bóc tách thực thể Regex (IntentEntityMap): Tự động nhận dạng mã vận đơn NX-XXXXXX</text>
