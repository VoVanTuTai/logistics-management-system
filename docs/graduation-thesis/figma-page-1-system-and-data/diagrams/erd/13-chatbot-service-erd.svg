  <rect x="515" y="9" width="171" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="600.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">VECTOR DATABASE &amp; RAG</text>
  <text x="18" y="70" class="panel-sec-title">▶ KHO TRI THỨC NHÚNG VECTOR &amp; PHIÊN HỘI THOẠI AI (RAG ENGINE)</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Lưu trữ Vector Embedding: FaqVectorStore lưu các đoạn tri thức phân đoạn</text>
  <text x="36" y="110" class="panel-body">(Chunk 450 tokens) được nhúng qua Google Gemini Text-Embedding-004 (768</text>
  <text x="36" y="128" class="panel-body">chiều).</text>
  <circle cx="25" cy="146" r="2" fill="#000000"/>
  <text x="36" y="150" class="panel-body">Quản lý phiên hội thoại (ChatSessionLog): Ghi nhận toàn bộ ngữ cảnh trao</text>
  <text x="36" y="168" class="panel-body">đổi, bóc tách ý định (Intent Extraction) và tự động lọc dữ liệu nhạy cảm</text>
  <text x="36" y="186" class="panel-body">PII.</text>
  <circle cx="25" cy="204" r="2" fill="#000000"/>
  <text x="36" y="208" class="panel-body">Cơ chế chuyển tiếp người thật (Human-in-the-Loop): Khi điểm tự tin</text>
  <text x="36" y="226" class="panel-body">confidenceScore &lt; 0.65, kích hoạt cờ isEscalatedToHuman để chuyển giao</text>
  <text x="36" y="244" class="panel-body">điện thoại thoại viên.</text>
