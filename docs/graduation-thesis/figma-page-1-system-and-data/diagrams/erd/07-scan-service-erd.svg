  <rect x="0" y="0" width="700" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: SCAN-SERVICE</text>
  <rect x="494" y="9" width="192" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="590.0" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">HIGH-FREQUENCY EVENT LOG</text>
  <text x="18" y="70" class="panel-sec-title">▶ GHI LOG BẤT BIẾN &amp; HIỆU NĂNG CAO</text>
  <circle cx="25" cy="88" r="2" fill="#000000"/>
  <text x="36" y="92" class="panel-body">Bản ghi vết quét chỉ ghi (Append-Only): ScanEvent lưu lại mọi thao tác</text>
  <text x="36" y="110" class="panel-body">quét mã vạch vật lý tại cửa kho và bưu cục trung chuyển.</text>
  <circle cx="25" cy="128" r="2" fill="#000000"/>
  <text x="36" y="132" class="panel-body">Cập nhật vị trí tức thời (CurrentLocation): Upsert vị trí mới nhất của bưu</text>
  <text x="36" y="150" class="panel-body">kiện để phục vụ API tra cứu đơn hàng tốc độ cao.</text>
  <circle cx="25" cy="168" r="2" fill="#000000"/>
  <text x="36" y="172" class="panel-body">Giám sát hành trình GPS bưu tá: CourierCurrentLocation lưu tọa độ bưu tá</text>
  <text x="36" y="190" class="panel-body">thời gian thực (Heartbeat 30s) và ghi lịch sử vào CourierLocationHistory.</text>
  <text x="18" y="222" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="240" r="2" fill="#000000"/>
  <text x="36" y="244" class="panel-body">shipmentCode: Cung cấp chuỗi vết quét làm bằng chứng điều tra cho</text>
  <text x="36" y="262" class="panel-body">shipment-service.</text>
  <circle cx="25" cy="280" r="2" fill="#000000"/>
  <text x="36" y="284" class="panel-body">courierId: Phục vụ giám sát lộ trình di chuyển bưu tá cho dispatch-</text>
  <text x="36" y="302" class="panel-body">service.</text>
  <rect x="14" y="982" width="672" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
  <text x="350.0" y="999" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">Engine: PostgreSQL 16 | Write Load: 15,000 scans/sec | Stream: Append-Only Immutable Log</text>
</g>
