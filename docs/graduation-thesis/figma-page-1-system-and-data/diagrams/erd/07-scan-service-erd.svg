<g transform="translate(1010, 20)">
  <rect width="890" height="870" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="1.4"/>
  <rect x="0" y="0" width="890" height="42" rx="6" fill="#F3F4F6" stroke="#000000" stroke-width="1"/>
  <rect x="14" y="12" width="6" height="18" rx="1" fill="#000000"/>
  <text x="28" y="26" class="panel-header">GIẢI THÍCH SƠ BỘ &amp; QUY TẮC DỮ LIỆU: SCAN-SERVICE</text>
  <rect x="677" y="9" width="199" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <text x="776.5" y="25" font-size="10" font-weight="700" fill="#000000" text-anchor="middle">HIGH-THROUGHPUT TELEMETRY</text>
  <text x="18" y="68" class="panel-sec-title">▶ GHI LOG BẤT BIẾN &amp; HIỆU NĂNG CAO</text>
  <circle cx="25" cy="84" r="2" fill="#000000"/>
  <text x="36" y="88" class="panel-body">Bảng ScanEvent hoạt động theo cơ chế Append-only: Không bao giờ cập nhật hay xóa</text>
  <text x="36" y="106" class="panel-body">bản ghi để phục vụ truy xuất pháp lý.</text>
  <circle cx="25" cy="122" r="2" fill="#000000"/>
  <text x="36" y="126" class="panel-body">Chống quét trùng (IdempotencyRecord): Tránh lỗi nhân viên bưu cục bấm máy quét 2</text>
  <text x="36" y="144" class="panel-body">lần liên tiếp tạo ra 2 sự kiện trùng lặp.</text>
  <circle cx="25" cy="160" r="2" fill="#000000"/>
  <text x="36" y="164" class="panel-body">Vị trí bưu kiện thời gian thực: CurrentLocation lưu trữ snapshot vị trí và thời</text>
  <text x="36" y="182" class="panel-body">điểm quét gần nhất để người dùng tra cứu nhanh.</text>
  <text x="18" y="210" class="panel-sec-title">▶ THEO DÕI VỊ TRÍ TÀI XẾ (COURIER GPS TRACKING)</text>
  <circle cx="25" cy="226" r="2" fill="#000000"/>
  <text x="36" y="230" class="panel-body">Lưu trữ tọa độ GPS thời gian thực (CourierCurrentLocation) phục vụ bản đồ điều</text>
  <text x="36" y="248" class="panel-body">hành trực quan trên Ops Portal.</text>
  <circle cx="25" cy="264" r="2" fill="#000000"/>
  <text x="36" y="268" class="panel-body">Ghi nhận lịch sử di chuyển (CourierLocationHistory) để đối chiếu lộ trình khi</text>
  <text x="36" y="286" class="panel-body">khách hàng khiếu nại tài xế không đến giao hàng.</text>
  <text x="18" y="314" class="panel-sec-title">▶ CƠ CHẾ LIÊN KẾT PHÂN TÁN (SAGA LINKAGE)</text>
  <circle cx="25" cy="330" r="2" fill="#000000"/>
  <text x="36" y="334" class="panel-body">locationCode: Ánh xạ tới bưu cục thao tác trong masterdata-service.</text>
  <circle cx="25" cy="350" r="2" fill="#000000"/>
  <text x="36" y="354" class="panel-body">OutboxEvent phát hành tín hiệu giúp tracking-service vẽ đường thời gian và</text>
  <text x="36" y="372" class="panel-body">reporting-service tính toán sản lượng bưu cục.</text>
  <rect x="14" y="832" width="862" height="26" rx="4" fill="#F9FAFB" stroke="#000000" stroke-width="1"/>
