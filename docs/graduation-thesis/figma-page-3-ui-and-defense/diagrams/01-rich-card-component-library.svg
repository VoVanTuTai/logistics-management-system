    <!-- Cảnh báo quy chế 24h -->
    <rect x="95" y="785" width="790" height="40" class="card-fill-subtle"/>
    <text x="110" y="810" class="text-body">⚠️ <tspan font-weight="bold">Quy chuẩn Bưu chính:</tspan> Sự cố vỡ/hỏng phải lập BBBT trong vòng 24 giờ kể từ thời điểm phát hàng thành công.</text>

    <!-- Trường 1: Loại sự cố -->
    <text x="95" y="855" class="text-card-h2">1. HẠNG MỤC SỰ CỐ PHÁT SINH:</text>
    <rect x="95" y="865" width="380" height="32" class="card-fill"/>
    <text x="110" y="886" class="text-body">[X] Kiện hàng bị bể vỡ / Hư hỏng vật lý</text>
    <rect x="495" y="865" width="390" height="32" class="card-fill-subtle"/>
    <text x="510" y="886" class="text-body-muted">[ ] Thất lạc / Thiếu hàng bên trong gói</text>

    <!-- Trường 2: Mô tả -->
    <text x="95" y="925" class="text-card-h2">2. MÔ TẢ CHI TIẾT HIỆN TRƯỜNG:</text>
    <rect x="95" y="935" width="790" height="55" class="card-fill"/>
    <text x="110" y="955" class="text-body">Hộp carton bị móp góc bên phải, băng keo niêm phong rách. Màn hình thiết bị bên trong nứt vỡ góc trái.</text>

    <!-- Trường 3: Đính kèm bằng chứng (Proof Evidence Upload) -->
    <text x="95" y="1015" class="text-card-h2">3. BẰNG CHỨNG HÌNH ẢNH / VIDEO (TỐI THIỂU 1 ẢNH RÕ VẬN ĐƠN VÀ 1 ẢNH HƯ HỎNG):</text>
    <rect x="95" y="1030" width="180" height="70" class="card-fill-subtle" stroke-dasharray="4 2"/>
    <text x="135" y="1065" class="text-body-muted">[+ Thêm ảnh mặt bưu gửi]</text>

    <rect x="290" y="1030" width="180" height="70" class="card-fill"/>
    <text x="310" y="1060" class="text-body">📷 anh_vo_man_hinh.jpg</text>
    <text x="310" y="1080" class="text-body-muted">2.4 MB • Đã tải lên</text>

    <rect x="485" y="1030" width="180" height="70" class="card-fill"/>
    <text x="505" y="1060" class="text-body">🎥 video_mo_hop.mp4</text>
    <text x="505" y="1080" class="text-body-muted">14.1 MB • Đã tải lên</text>

    <!-- Nút hành động -->
    <rect x="95" y="1135" width="380" height="45" rx="4" class="btn-primary"/>
    <text x="180" y="1162" class="text-btn-white">NỘP BIÊN BẢN &amp; KHỞI TẠO KHIẾU NẠI</text>

    <rect x="495" y="1135" width="390" height="45" rx="4" class="btn-outline"/>
    <text x="600" y="1162" class="text-btn-black">YÊU CẦU ĐIỀU PHỐI VIÊN HỖ TRỢ</text>
  </g>

