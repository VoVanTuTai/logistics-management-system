<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" width="1920" height="1280">
  <defs>
    <style>
      .bg-canvas { fill: #FFFFFF; }
      .border-main { stroke: #000000; stroke-width: 2; fill: none; }
      .border-thin { stroke: #000000; stroke-width: 1; fill: none; }
      .border-dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
      .card-fill { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .card-fill-subtle { fill: #F9F9F9; stroke: #000000; stroke-width: 1; }
      .btn-primary { fill: #000000; stroke: #000000; stroke-width: 1; }
      .btn-outline { fill: #FFFFFF; stroke: #000000; stroke-width: 1.5; }
      .text-title { font-family: "Times New Roman", Times, serif; font-size: 26px; font-weight: bold; fill: #000000; }
      .text-section { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #000000; letter-spacing: 1px; }
      .text-card-h1 { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #000000; }
      .text-card-h2 { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #000000; }
      .text-body { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
      .text-body-muted { font-family: Arial, sans-serif; font-size: 11px; fill: #555555; }
      .text-code { font-family: "Courier New", monospace; font-size: 12px; fill: #000000; font-weight: bold; }
      .text-btn-white { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; }
      .text-btn-black { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #000000; }
      .badge-black { fill: #000000; }
      .badge-outline { fill: #FFFFFF; stroke: #000000; stroke-width: 1; }
    </style>
  </defs>

  <!-- NỀN CANVAS CHÍNH -->
  <rect width="1920" height="1280" class="bg-canvas"/>
  <rect x="20" y="20" width="1880" height="1240" class="border-main"/>
  <rect x="24" y="24" width="1872" height="1232" class="border-thin"/>

  <!-- TIÊU ĐỀ BẢN VẼ KỸ THUẬT -->
  <g id="Header_Technical">
    <rect x="40" y="40" width="1840" height="80" class="card-fill"/>
    <text x="60" y="75" class="text-title">BẢN VẼ THIẾT KẾ GIAO DIỆN TRỢ LÝ AI: THƯ VIỆN THẺ TƯƠNG TÁC (RICH ACTIONABLE CARDS)</text>
    <text x="60" y="102" class="text-body-muted">TIÊU CHUẨN ĐỒ ÁN TỐT NGHIỆP KỸ SƯ CNTT • HỆ THỐNG NEXUS LOGISTICS • PHÂN HỆ HUMAN-AI INTERACTION (SECTION 3.1)</text>
    <rect x="1560" y="55" width="300" height="50" class="card-fill-subtle"/>
    <text x="1575" y="75" class="text-card-h2">MÃ BẢN VẼ: UI-SPEC-01</text>
    <text x="1575" y="95" class="text-body-muted">TỶ LỆ: 1:1 • FIGMA PAGE 3</text>
  </g>

  <!-- KHU VỰC 1: SINGLE ORDER SUMMARY CARD -->
  <g id="Component_Order_Summary_Card">
    <rect x="40" y="140" width="580" height="500" class="card-fill-subtle"/>
    <rect x="50" y="150" width="560" height="30" class="card-fill"/>
    <text x="65" y="170" class="text-section">1. COMPONENT: THẺ TÓM TẮT ĐƠN HÀNG (ORDER CARD)</text>

    <!-- Thẻ mô phỏng thực tế -->
    <rect x="70" y="200" width="520" height="420" rx="8" class="card-fill"/>
    
    <!-- Header thẻ -->
    <rect x="70" y="200" width="520" height="50" rx="8" class="card-fill"/>
    <text x="90" y="230" class="text-card-h1">VẬN ĐƠN: </text>
    <text x="175" y="230" class="text-code">#NX89421VN</text>
    <rect x="420" y="215" width="150" height="24" rx="12" class="badge-black"/>
    <text x="440" y="231" class="text-btn-white">ĐANG GIAO HÀNG</text>
    
    <!-- Body thông tin -->
    <line x1="70" y1="250" x2="590" y2="250" class="border-thin"/>
    
    <text x="90" y="280" class="text-card-h2">THÔNG TIN GIAO NHẬN (ĐÃ CHE MỜ PII):</text>
    <text x="90" y="305" class="text-body">• Người gửi: Bưu cục Cầu Giấy (Hub HN-01)</text>
    <text x="90" y="330" class="text-body">• Người nhận: Ng***** V** A** (098****321)</text>
    <text x="90" y="355" class="text-body">• Địa chỉ: 1** Đ** T*** H***, Phường 2, Tân Bình, TP.HCM</text>
    
    <line x1="90" y1="375" x2="570" y2="375" class="border-dashed"/>
    
    <text x="90" y="405" class="text-card-h2">TÀI CHÍNH &amp; HÀNG HÓA:</text>
    <text x="90" y="430" class="text-body">• Kiện hàng: 01 Thiết bị điện tử (0.85 kg)</text>
    <text x="90" y="455" class="text-body">• Tiền thu hộ COD: <tspan class="text-code">1,450,000 đ</tspan> | Phí cước: <tspan class="text-code">38,000 đ</tspan></text>
    <text x="90" y="480" class="text-body">• Gói bảo hiểm: Khai giá toàn phần (Mức đền tối đa: 100%)</text>

    <!-- Nút tương tác Action Buttons -->
    <rect x="90" y="520" width="230" height="40" rx="4" class="btn-primary"/>
    <text x="135" y="545" class="text-btn-white">XEM HÀNH TRÌNH CHI TIẾT</text>

    <rect x="330" y="520" width="240" height="40" rx="4" class="btn-outline"/>
    <text x="365" y="545" class="text-btn-black">BÁO CÁO SỰ CỐ / HỎNG HÓA</text>

    <text x="90" y="595" class="text-body-muted">Ghi chú kỹ thuật: Render qua schema OrderCardDTO; tự động map qua Chatbot Service.</text>
  </g>

  <!-- KHU VỰC 2: TRACKING TIMELINE STEPPER -->
  <g id="Component_Tracking_Timeline_Card">
    <rect x="640" y="140" width="600" height="500" class="card-fill-subtle"/>
    <rect x="650" y="150" width="580" height="30" class="card-fill"/>
    <text x="665" y="170" class="text-section">2. COMPONENT: DÒNG THỜI GIAN VẬN CHUYỂN (STEPPER TIMELINE)</text>

    <!-- Thẻ mô phỏng -->
    <rect x="670" y="200" width="540" height="420" rx="8" class="card-fill"/>
    
    <text x="700" y="235" class="text-card-h1">TIẾN TRÌNH VẬN ĐƠN: #NX89421VN</text>
    <text x="1050" y="235" class="text-body-muted">Cập nhật: 10 phút trước</text>
    <line x1="670" y1="255" x2="1210" y2="255" class="border-thin"/>

    <!-- Stepper Line dọc -->
    <line x1="720" y1="285" x2="720" y2="495" class="border-main"/>

    <!-- Mốc 1: Đã hoàn tất -->
    <circle cx="720" cy="285" r="10" fill="#000000"/>
    <text x="716" y="289" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">✓</text>
    <text x="745" y="285" class="text-card-h2">14:30 - 26/09/2026 | TIẾP NHẬN KIỆN HÀNG</text>
    <text x="745" y="303" class="text-body-muted">Bưu tá tiếp nhận tại điểm gửi: Bưu cục Cầu Giấy, Hà Nội.</text>

    <!-- Mốc 2: Đã hoàn tất -->
    <circle cx="720" cy="345" r="10" fill="#000000"/>
    <text x="716" y="349" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF">✓</text>
    <text x="745" y="345" class="text-card-h2">21:15 - 26/09/2026 | RỜI KHO TỔNG MIỀN BẮC</text>
    <text x="745" y="363" class="text-body-muted">Đóng bao tải mã hiệu #PACK-992, lên xe trung chuyển liên tỉnh.</text>

    <!-- Mốc 3: Hiện tại (Đang xử lý) -->
    <circle cx="720" cy="415" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
    <circle cx="720" cy="415" r="5" fill="#000000"/>
    <text x="745" y="415" class="text-card-h2">08:20 - 27/09/2026 | NHẬP KHO CHUYỂN PHÁT TÂN BÌNH</text>
    <text x="745" y="433" class="text-body">Phân công bưu tá: <tspan font-weight="bold">Trần V** T*** (SĐT: 091****888)</tspan></text>
    <rect x="745" y="443" width="130" height="20" class="badge-outline"/>
    <text x="753" y="457" class="text-btn-black">ĐANG TRÊN ĐƯỜNG GIAO</text>

    <!-- Mốc 4: Tương lai -->
    <circle cx="720" cy="495" r="10" fill="#FFFFFF" stroke="#555555" stroke-width="1.5"/>
    <text x="745" y="495" class="text-card-h2" fill="#777777">DỰ KIẾN: 14:00 - 17:30 | GIAO HÀNG THÀNH CÔNG</text>
    <text x="745" y="513" class="text-body-muted">Khách hàng kiểm tra hàng đúng quy chế đồng kiểm.</text>

    <!-- Nút hành động chân thẻ -->
    <rect x="700" y="550" width="480" height="38" rx="4" class="btn-outline"/>
    <text x="860" y="574" class="text-btn-black">LIÊN HỆ BƯU TÁ PHÁT HÀNG</text>
  </g>

  <!-- KHU VỰC 3: PRICING ESTIMATOR & IATA CALCULATOR -->
  <g id="Component_Pricing_IATA_Card">
    <rect x="1260" y="140" width="620" height="500" class="card-fill-subtle"/>
    <rect x="1270" y="150" width="600" height="30" class="card-fill"/>
    <text x="1285" y="170" class="text-section">3. COMPONENT: DỰ TOÁN CƯỚC &amp; QUY ĐỔI THỂ TÍCH IATA</text>

    <!-- Thẻ mô phỏng -->
    <rect x="1290" y="200" width="560" height="420" rx="8" class="card-fill"/>
    
    <text x="1320" y="235" class="text-card-h1">DỰ TOÁN CƯỚC VẬN CHUYỂN TIÊU CHUẨN BƯU CHÍNH</text>
    <line x1="1290" y1="255" x2="1850" y2="255" class="border-thin"/>

    <!-- Thông số đầu vào -->
    <text x="1320" y="285" class="text-card-h2">1. THÔNG SỐ ĐẦU VÀO TỪ KHÁCH HÀNG:</text>
    <rect x="1320" y="300" width="240" height="32" class="card-fill-subtle"/>
    <text x="1330" y="321" class="text-body">Trọng lượng cân nặng: <tspan class="text-code">1.50 kg</tspan></text>

    <rect x="1580" y="300" width="240" height="32" class="card-fill-subtle"/>
    <text x="1590" y="321" class="text-body">Kích thước: <tspan class="text-code">40 x 30 x 25 cm</tspan></text>

    <!-- Công thức IATA -->
    <text x="1320" y="360" class="text-card-h2">2. CÔNG THỨC QUY ĐỔI KHỐI LƯỢNG THỂ TÍCH (IATA CARGO STANDARD):</text>
    <rect x="1320" y="375" width="500" height="50" class="card-fill"/>
    <text x="1340" y="405" class="text-code">VW = (Dài x Rộng x Cao) / 5000 = (40 x 30 x 25) / 5000 = 6.00 kg</text>

    <!-- Kết luận nấc tính cước -->
    <text x="1320" y="450" class="text-card-h2">3. KHỐI LƯỢNG TÍNH CƯỚC (CHARGEABLE WEIGHT):</text>
    <text x="1320" y="475" class="text-body">CW = Max(Trọng lượng thực, Khối lượng thể tích) = Max(1.5 kg, 6.0 kg) = <tspan font-weight="bold" font-size="14">6.00 kg</tspan></text>

    <!-- Bảng cước & Thành tiền -->
    <rect x="1320" y="495" width="500" height="60" class="card-fill-subtle"/>
    <text x="1340" y="520" class="text-card-h2">TỔNG CƯỚC DỰ TOÁN (TUYẾN HÀ NỘI ➔ TP.HCM):</text>
    <text x="1340" y="543" class="text-title" font-size="20">68,000 VNĐ <tspan font-size="11" font-weight="normal" fill="#555555">(Chưa bao gồm VAT &amp; Phí bảo hiểm)</tspan></text>

    <rect x="1320" y="570" width="500" height="36" rx="4" class="btn-primary"/>
    <text x="1480" y="593" class="text-btn-white">TẠO ĐƠN VẬN CHUYỂN NGAY</text>
  </g>

  <!-- KHU VỰC 4: BIÊN BẢN BẤT THƯỜNG & KHAI BÁO SỰ CỐ (CLAIM / INCIDENT DIALOG) -->
  <g id="Component_Incident_Claim_Dialog">
