    <rect x="1310" y="1070" width="240" height="36" rx="4" class="btn-outline"/>
    <text x="1360" y="1093" class="text-btn-black">CHỌN TRA CỨU ĐƠN NÀY</text>

    <!-- Card 3 trong Carousel -->
    <rect x="1590" y="750" width="280" height="380" rx="6" class="card-fill"/>
    <rect x="1590" y="750" width="280" height="36" rx="6" class="card-fill"/>
    <text x="1605" y="773" class="text-card-h1">ĐƠN 3: #NX65019VN</text>
    <text x="1605" y="810" class="text-card-h2">Trạng thái: Đang chuyển hoàn</text>
