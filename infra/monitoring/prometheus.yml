global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: nexus-express
    environment: production-apple-silicon

rule_files:
  - prometheus-alerts.yml

scrape_configs:
  - job_name: gateway-bff-http
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: gateway-bff

  - job_name: gateway-bff-chat
    metrics_path: /chat/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: gateway-chat

  - job_name: rabbitmq-broker
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: rabbitmq
